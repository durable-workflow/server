name: durable-workflow-server

# The published Durable Workflow Server: the native (Rust) server and MySQL.
#
#   curl -fsSLO https://raw.githubusercontent.com/durable-workflow/server/main/docker-compose.published.yml
#   docker compose -f docker-compose.published.yml up -d --wait
#
# The Server runs the API and maintenance in one long-lived process.
# Two one-shot services prepare the native schema and apply any staged
# checkpoint DDL for the scoped Server account. Use docker-compose.php.yml
# for the PHP 2.x Server.
#
# The default image is the native release this commit is tagged as: a final
# release's commit moves it (verify-native-release-dispatch.sh refuses a
# release whose default names another image). Set DW_SERVER_IMAGE to run
# any other native image, by tag or digest; pin a digest for production
# change control.
x-server-image: &server-image ${DW_SERVER_IMAGE:-durableworkflow/server:3.24.0}

x-mysql-image: &mysql-image mysql:${MYSQL_VERSION:-8.0}
x-server-database: &server-database
  DW_RUST_EXPERIMENTAL: "1"
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-durable_workflow}
  DB_USERNAME: ${DB_USERNAME:-workflow}
  DB_PASSWORD: ${DB_PASSWORD:-workflow}

services:
  server:
    image: *server-image
    platform: ${DW_SERVER_PLATFORM:-}
    restart: unless-stopped
    # Loopback only by default. For remote access set SERVER_BIND_ADDRESS to a
    # protected private interface and terminate HTTPS at a reverse proxy.
    ports:
      - "${SERVER_BIND_ADDRESS:-127.0.0.1}:${SERVER_PORT:-8080}:8080"
    environment:
      <<: *server-database
      DW_SERVER_KEY: ${DW_SERVER_KEY:-}
      # Token auth. There is no default token: Compose refuses to start until
      # DW_AUTH_TOKEN is set. Native requires this shared token and accepts it
      # for every role (it refuses DW_AUTH_BACKWARD_COMPATIBLE=false), so use a
      # strong random value outside local testing. The role tokens add
      # narrower worker, operator and admin tokens.
      DW_AUTH_DRIVER: ${DW_AUTH_DRIVER:-token}
      DW_AUTH_TOKEN: ${DW_AUTH_TOKEN:?Set DW_AUTH_TOKEN, for example export DW_AUTH_TOKEN=dev-token for local testing}
      DW_RUNTIME_CREDENTIALS_ENABLED: ${DW_RUNTIME_CREDENTIALS_ENABLED:-false}
      DW_WORKER_TOKEN: ${DW_WORKER_TOKEN:-}
      DW_OPERATOR_TOKEN: ${DW_OPERATOR_TOKEN:-}
      DW_ADMIN_TOKEN: ${DW_ADMIN_TOKEN:-}
      DW_HTTP_ACCESS_LOG: ${DW_HTTP_ACCESS_LOG:-false}
    volumes:
      - server_storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      schema-install:
        condition: service_completed_successfully
    # The image has no curl; bash's /dev/tcp reads /api/ready.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /api/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s

  schema-plan:
    image: *server-image
    platform: ${DW_SERVER_PLATFORM:-}
    environment: *server-database
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - schema_plan:/app/storage
    entrypoint: [bash, -ec]
    command:
      - |
        umask 077
        plan=/app/storage/checkpoint.sql
        errors=/app/storage/bootstrap.stderr
        : > "$$plan"
        if durable-workflow-server schema-bootstrap 2>"$$errors"; then
          exit 0
        fi
        if grep -Fxq native_child_checkpoint_trigger_privilege_required "$$errors"; then
          durable-workflow-server schema-checkpoint-ddl >"$$plan"
        else
          cat "$$errors" >&2
          exit 1
        fi

  schema-install:
    image: *mysql-image
    user: "1000:1000"
    network_mode: service:mysql
    depends_on:
      schema-plan:
        condition: service_completed_successfully
    environment:
      MYSQL_PWD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - schema_plan:/plan:ro
    entrypoint: [sh, -ec]
    command:
      - |
        if [ -s /plan/checkpoint.sql ]; then
          mysql --protocol=TCP --host=127.0.0.1 --user=root --batch < /plan/checkpoint.sql
        fi

  mysql:
    image: *mysql-image
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-durable_workflow}
      MYSQL_USER: ${DB_USERNAME:-workflow}
      MYSQL_PASSWORD: ${DB_PASSWORD:-workflow}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--protocol=TCP", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
  server_storage:
  schema_plan:
