name: Workflow Memo Rolling Upgrade
run-name: Workflow Memo Rolling Upgrade @ ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - "app/Casts/WorkflowMemoValueCompatibilityCast.php"
      - "app/Support/WorkflowMemoPayloadMigration.php"
      - "app/Support/WorkflowMemoRollingCompatibility.php"
      - "database/migrations/*workflow_memo*"
      - "docker-compose.memo-rolling.yml"
      - "scripts/smoke-workflow-memo-rolling-upgrade.sh"
      - ".github/workflows/memo-rolling-upgrade.yml"
  pull_request:
    paths:
      - "app/Casts/WorkflowMemoValueCompatibilityCast.php"
      - "app/Support/WorkflowMemoPayloadMigration.php"
      - "app/Support/WorkflowMemoRollingCompatibility.php"
      - "database/migrations/*workflow_memo*"
      - "docker-compose.memo-rolling.yml"
      - "scripts/smoke-workflow-memo-rolling-upgrade.sh"
      - ".github/workflows/memo-rolling-upgrade.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rolling-upgrade:
    name: ${{ matrix.database }} predecessor/successor
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DW_MEMO_ROLLING_HOST_PORT: "0"
    strategy:
      fail-fast: false
      matrix:
        database: [mysql, pgsql]

    steps:
      - name: Checkout server
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4

      - name: Exercise interrupted migration and mixed revisions
        env:
          COMPOSE_PROJECT_NAME: memo-rolling-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          DW_MEMO_ROLLING_DATABASES: ${{ matrix.database }}
          DW_MEMO_SUCCESSOR_IMAGE: durable-workflow/server-memo-rolling:${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.database }}
        run: scripts/smoke-workflow-memo-rolling-upgrade.sh

      - name: Clean up disposable stack
        if: always()
        env:
          COMPOSE_PROJECT_NAME: memo-rolling-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          DW_MEMO_ROLLING_DB: ${{ matrix.database }}
          DW_MEMO_ROLLING_DB_HOST: ${{ matrix.database }}
          DW_MEMO_ROLLING_DB_PORT: ${{ matrix.database == 'mysql' && '3306' || '5432' }}
        run: >-
          docker compose -p "$COMPOSE_PROJECT_NAME-${{ matrix.database }}"
          --profile "${{ matrix.database }}"
          -f docker-compose.memo-rolling.yml
          down -v --remove-orphans || true
