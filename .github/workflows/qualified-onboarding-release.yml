name: Qualified Onboarding Release

on:
  pull_request:
    paths:
      - '.github/workflows/qualified-onboarding-release.yml'
      - 'README.md'
      - 'docker-compose.published.yml'
      - 'docker-compose.dedicated-matching.yml'
      - 'k8s/**'
      - 'resources/release/qualified-onboarding-release.json'
      - 'scripts/ci/sync-qualified-onboarding-release.mjs'
      - 'scripts/k8s-kind-smoke.sh'
      - 'tests/Unit/OnboardingVersionPinsTest.php'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualified-onboarding-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Verify qualified Compose, Kubernetes, and Helm defaults
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Check generated onboarding defaults against the public authority
        if: ${{ github.server_url == 'https://github.com' }}
        run: node scripts/ci/sync-qualified-onboarding-release.mjs --check

      - name: Check generated onboarding defaults against checked-in authority
        if: ${{ github.server_url != 'https://github.com' }}
        run: node scripts/ci/sync-qualified-onboarding-release.mjs --check --offline
