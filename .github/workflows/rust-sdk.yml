name: Rust SDK

on:
  pull_request:
    branches: [main]
    paths:
      - "sdk-rust/**"
      - "scripts/ci/publish-rust-sdk.sh"
      - ".github/workflows/rust-sdk.yml"
      - ".github/workflows/release.yml"
  push:
    branches: [main]
    paths:
      - "sdk-rust/**"
      - "scripts/ci/publish-rust-sdk.sh"
      - ".github/workflows/rust-sdk.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test registry-ready crate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.86
        uses: dtolnay/rust-toolchain@1.86.0
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path sdk-rust/Cargo.toml --check

      - name: Test SDK
        run: cargo test --manifest-path sdk-rust/Cargo.toml --all-targets

      - name: Verify publishable package
        run: cargo package --manifest-path sdk-rust/Cargo.toml --allow-dirty

      - name: Validate release script syntax
        run: bash -n scripts/ci/publish-rust-sdk.sh
