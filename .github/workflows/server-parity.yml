name: Shared Server fixtures

on:
  # Pull requests run without a path filter so that the terminal result always
  # reports. The `changes` job applies the push path list below to them.
  pull_request:
  push:
    branches: [main]
    paths:
      - .github/workflows/server-parity.yml
      - .gitattributes
      - .cargo/**
      - Cargo.toml
      - Cargo.lock
      - scripts/conformance/**
      - scripts/ci/**
      - tests/Unit/ServerParity*.mjs
      - tests/Support/ServerParity*.mjs
      - scripts/conformance/server-parity*
      - scripts/conformance/server-parity/**
      - scripts/ci/pull-images.sh
      - scripts/ci/patched-pip.sh
      - scripts/ci/sdk-adapter-cache-key.sh
      - tests/Unit/NativeDebugArtifactTest.mjs
      - config/dw-contract.php
      - tests/Fixtures/ActivityMetadataProjection/**
      - tests/Fixtures/CodecRegression/**
      - tests/Fixtures/HistoryBudget/**
      - tests/Fixtures/ServerUpgrade/**
      - tests/Fixtures/ServerParity/**
      - tests/Fixtures/ServerParityBaselines/**
      - tests/Fixtures/ServerParityNormalization/**
