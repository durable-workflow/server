          if docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" \
            -e DW_RUST_EXPERIMENTAL=1 -e DB_CONNECTION=mysql -e DB_HOST=parity-mysql -e DB_DATABASE=native_ref \
            -e DB_USERNAME=root -e DB_PASSWORD=parity-disposable-password \
            -e DB_SSLMODE=verify_identity -e DB_SSLROOTCERT=/tls/untrusted.crt \
            -v "$PWD/mysql-tls/untrusted.crt:/tls/untrusted.crt:ro" -v "$PWD/rust-target:/target:ro" \
            --entrypoint /target/debug/durable-workflow-server \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0 \
            schema-check > parity-evidence/tls-untrusted.txt 2>&1; then
            exit 1
          fi
          if docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" \
            -e DW_RUST_EXPERIMENTAL=1 -e DB_CONNECTION=mysql -e DB_HOST="$RESOURCE_SCOPE-db" -e DB_DATABASE=native_ref \
            -e DB_USERNAME=root -e DB_PASSWORD=parity-disposable-password \
            -e DB_SSLMODE=verify_identity -e DB_SSLROOTCERT=/tls/ca.crt \
            -v "$PWD/mysql-tls/ca.crt:/tls/ca.crt:ro" -v "$PWD/rust-target:/target:ro" \
            --entrypoint /target/debug/durable-workflow-server \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0 \
            schema-check > parity-evidence/tls-wrong-hostname.txt 2>&1; then
            exit 1
          fi
          grep -Fq database_tls_connection_failed parity-evidence/tls-untrusted.txt
          grep -Fq database_tls_connection_failed parity-evidence/tls-wrong-hostname.txt
      - name: Collect logs and clean owned resources
        if: always()
        run: |
          mkdir -p parity-evidence
          docker logs "$RESOURCE_SCOPE-php" > parity-evidence/php.log 2>&1 || true
          docker logs "$RESOURCE_SCOPE-php-maintenance" > parity-evidence/php-maintenance.log 2>&1 || true
          docker logs "$RESOURCE_SCOPE-native-a" > parity-evidence/native-a.log 2>&1 || true
          docker logs "$RESOURCE_SCOPE-native-b" > parity-evidence/native-b.log 2>&1 || true
          docker inspect --format '{{json .State}}' "$RESOURCE_SCOPE-native-a" > parity-evidence/native-a-state.json 2>&1 || true
          docker inspect --format '{{json .State}}' "$RESOURCE_SCOPE-native-b" > parity-evidence/native-b-state.json 2>&1 || true
          docker inspect --format '{"memory":{{json .HostConfig.Memory}},"memory_swap":{{json .HostConfig.MemorySwap}},"nano_cpus":{{json .HostConfig.NanoCpus}}}' "$RESOURCE_SCOPE-native-a" > parity-evidence/native-a-limits.json 2>&1 || true
          docker inspect --format '{"memory":{{json .HostConfig.Memory}},"memory_swap":{{json .HostConfig.MemorySwap}},"nano_cpus":{{json .HostConfig.NanoCpus}}}' "$RESOURCE_SCOPE-native-b" > parity-evidence/native-b-limits.json 2>&1 || true
          docker logs "$RESOURCE_SCOPE-recovered" > parity-evidence/native-recovered.log 2>&1 || true
          docker logs "$RESOURCE_SCOPE-db" > parity-evidence/database.log 2>&1 || true
          bash scripts/conformance/server-parity/range-repair-cleanup.sh mysql
          bash scripts/conformance/server-parity/range-repair-cleanup.sh mysql pending-native
          bash scripts/conformance/server-parity/sdk-direction-cleanup.sh mysql
          bash scripts/conformance/server-parity/sdk-direction-cleanup.sh mysql child
          bash scripts/conformance/server-parity/sdk-direction-cleanup.sh mysql timer
          bash scripts/conformance/server-parity/sdk-direction-cleanup.sh mysql signal
          bash scripts/conformance/server-parity/sdk-direction-cleanup.sh mysql namespace-signal
          bash scripts/conformance/server-parity/sdk-direction-cleanup.sh mysql selected-run-signal
          bash scripts/conformance/server-parity/sdk-direction-cleanup.sh mysql query
          bash scripts/conformance/server-parity/sdk-direction-cleanup.sh mysql update
          bash scripts/conformance/server-parity/sdk-direction-cleanup.sh mysql update-failure
          bash scripts/conformance/server-parity/corrected-marker-cleanup.sh mysql
          docker inspect --format '{{json .State}}' "$RESOURCE_SCOPE-db" > parity-evidence/database-state.json 2>&1 || true
          docker inspect --format '{{json .HostConfig.Memory}}' "$RESOURCE_SCOPE-db" > parity-evidence/database-memory-limit.json 2>&1 || true
          for profile in fence pressure; do
            for target in php native; do
              docker logs "$RESOURCE_SCOPE-$profile-$target" > "parity-evidence/$profile-$target.log" 2>&1 || true
              docker rm -f "$RESOURCE_SCOPE-$profile-$target" || true
            done
          done
          for target in php native; do
            docker logs "$RESOURCE_SCOPE-role-$target" > "parity-evidence/roles-$target.log" 2>&1 || true
            docker rm -f "$RESOURCE_SCOPE-role-$target" || true
          done
          docker rm -f "$RESOURCE_SCOPE-php" "$RESOURCE_SCOPE-php-maintenance" "$RESOURCE_SCOPE-native-a" "$RESOURCE_SCOPE-native-b" "$RESOURCE_SCOPE-recovered" "$RESOURCE_SCOPE-db" || true
          docker network rm "$RESOURCE_SCOPE" || true
      - name: Summarize MySQL execution evidence
        if: always()
        env:
          PARITY_JOB_OUTCOME: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p parity-evidence parity-summary
          image=$(jq -r '.server.images["linux/amd64"] | sub("^durableworkflow/server@"; "ghcr.io/durable-workflow/server@")' tests/Fixtures/ServerParityBaselines/php-2.11.1.json)
          docker run --rm --user="$(id -u):$(id -g)" --network=none --cpus=1 --memory=256m --memory-swap=256m \
            --entrypoint node -e PARITY_JOB_OUTCOME -e GITHUB_SHA \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence:ro" -v "$PWD/parity-summary:/summary" \
            "$image" /source/scripts/conformance/server-parity/artifact-summary.mjs /evidence /summary
      - name: Retain MySQL execution summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mysql-execution-${{ matrix.label }}
          path: parity-summary
          retention-days: 1

  postgres-storage:
    needs: published-sdk-adapters
    runs-on: ubuntu-latest
    # Corrected marker/range/clock coverage expands the job, and the fixture step
    # runs every later profile before failing; scenario budgets stay fixed.
    # MySQL runs take 75 to 85 minutes; PostgreSQL's jobs take about 60.
    timeout-minutes: 105
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: existing-php-matrix
            image: mirror.gcr.io/library/postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
          - label: postgres-17
            image: mirror.gcr.io/library/postgres@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    env:
      RESOURCE_SCOPE: dw-pg-parity-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.label }}
      POSTGRES_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Fetch this run's published SDK adapters
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: published-sdk-patch-adapters
          path: published-sdk-adapters
          digest-mismatch: error
      - name: Fetch this run's current query consumers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: query-authority-adapters
          path: query-authority-adapters
          digest-mismatch: error
      - name: Fetch this run's genuine legacy-marker adapters
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: legacy-marker-adapters
          path: legacy-marker-adapters
          digest-mismatch: error
      - name: Fetch this run's published SDK direction adapters
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sdk-direction-adapters
          path: sdk-direction-adapters
          digest-mismatch: error
      - name: Fetch this run's corrected cohort adapters
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: corrected-marker-adapters
          path: corrected-marker-adapters
          digest-mismatch: error
      - name: Fetch locked Rust dependencies
        # A registry or network failure belongs to this step, not to the
        # offline native builds and tests that follow.
        run: |
          set -euo pipefail
          mkdir -p cargo-home
          docker run --rm --user="$(id -u):$(id -g)" --cpus=2 --memory=2g --memory-swap=2g \
            -e CARGO_HOME=/cargo -e CARGO_NET_RETRY=10 \
            -v "$PWD:/source:ro" -v "$PWD/cargo-home:/cargo" -w /source/rust \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0 \
            cargo fetch --locked
      - name: Bootstrap independent published PHP and native PostgreSQL databases
        env:
          POSTGRES_IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          # Failed Rust tests are printed from their evidence files into this step's log.
          rust_test_failures() {
            bash scripts/conformance/server-parity/rust-test-failures.sh
          }
          trap rust_test_failures ERR
          mkdir -p cargo-home rust-target parity-evidence pg-state
          chmod 0777 parity-evidence
          docker network create "$RESOURCE_SCOPE"
          docker run -d --name "$RESOURCE_SCOPE-db" --network "$RESOURCE_SCOPE" --network-alias=parity-pg \
            --user="$(id -u):$(id -g)" --cpus=1 --memory=512m --memory-swap=512m \
            -e POSTGRES_USER=parity -e POSTGRES_PASSWORD=parity-disposable-password -e POSTGRES_DB=php_ref \
            -v "$PWD/pg-state:/var/lib/postgresql/data" "$POSTGRES_IMAGE"
          ready=0
          for attempt in $(seq 1 30); do
            if docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" \
              --entrypoint pg_isready "$POSTGRES_IMAGE" -h parity-pg -U parity -d php_ref; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          docker run --rm --user="$(id -u):$(id -g)" --network=none --entrypoint postgres \
            "$POSTGRES_IMAGE" --version > parity-evidence/postgres-version.txt
          docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" \
            -e PGPASSWORD=parity-disposable-password --entrypoint createdb "$POSTGRES_IMAGE" -h parity-pg -U parity native_ref
          image=$(jq -r '.server.images["linux/amd64"] | sub("^durableworkflow/server@"; "ghcr.io/durable-workflow/server@")' tests/Fixtures/ServerParityBaselines/php-2.11.1.json)
          # The physical layout stays the frozen published 2.5.14 one; behavior
          # runs on the current reference after migrating that database forward.
          layout=$(jq -r '.server.images["linux/amd64"] | sub("^durableworkflow/server@"; "ghcr.io/durable-workflow/server@")' tests/Fixtures/ServerParityBaselines/php-2.5.14.json)
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint php \
            -e DB_CONNECTION=pgsql -e DB_HOST=parity-pg -e DB_DATABASE=php_ref \
            -e DB_USERNAME=parity -e DB_PASSWORD=parity-disposable-password \
            -e CACHE_STORE=file -e QUEUE_CONNECTION=database -e DW_AUTH_TOKEN=parity-test-token \
            "$layout" artisan server:bootstrap --force > parity-evidence/published-bootstrap.txt
          # Compiling the library tests with two jobs peaks near 4.2 GB; a 4 GB limit OOM-killed rustc (exit 101).
          docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" --cpus=2 --memory=6g --memory-swap=6g \
            -e CARGO_HOME=/cargo -e CARGO_TARGET_DIR=/target -e CARGO_BUILD_JOBS=2 \
            -e DW_TEST_POSTGRES_URL=postgres://parity:parity-disposable-password@parity-pg:5432/php_ref \
            -e DW_EXECUTION_POSTGRES_URL=postgres://parity:parity-disposable-password@parity-pg:5432/php_ref \
            -v "$PWD:/source:ro" -v "$PWD/cargo-home:/cargo" -v "$PWD/rust-target:/target" \
            -v "$PWD/parity-evidence:/evidence" -w /source/rust --entrypoint bash \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0 -c \
            'cargo test --locked --offline --lib runtime::postgres::tests::qualification_ -- --ignored --nocapture > /evidence/postgres-tests.txt && cargo test --locked --offline --test execution -- --nocapture > /evidence/postgres-execution-tests.txt && cargo build --locked --offline'
          docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" \
            -e DW_RUST_EXPERIMENTAL=1 -e DB_CONNECTION=pgsql -e DB_HOST=parity-pg -e DB_DATABASE=native_ref \
            -e DB_USERNAME=parity -e DB_PASSWORD=parity-disposable-password \
            -v "$PWD/rust-target:/target:ro" --entrypoint /target/debug/durable-workflow-server \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0 \
            schema-bootstrap > parity-evidence/native-bootstrap.json
          docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" \
            -e DW_RUST_EXPERIMENTAL=1 -e DB_CONNECTION=pgsql -e DB_HOST=parity-pg -e DB_DATABASE=native_ref \
            -e DB_USERNAME=parity -e DB_PASSWORD=parity-disposable-password \
            -v "$PWD/rust-target:/target:ro" --entrypoint /target/debug/durable-workflow-server \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0 \
            schema-check > parity-evidence/native-check.json
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint php \
            -e DB_HOST=parity-pg -e DB_USERNAME=parity -e DB_PASSWORD=parity-disposable-password \
            -v "$PWD:/source:ro" -w /source "$image" \
            scripts/conformance/server-parity/postgres-schema.php compare php_ref native_ref > parity-evidence/catalog-comparison.json
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint php \
            -e DB_CONNECTION=pgsql -e DB_HOST=parity-pg -e DB_DATABASE=php_ref \
            -e DB_USERNAME=parity -e DB_PASSWORD=parity-disposable-password \
            -e CACHE_STORE=file -e QUEUE_CONNECTION=database -e DW_AUTH_TOKEN=parity-test-token \
            "$image" artisan server:bootstrap --force > parity-evidence/published-upgrade-bootstrap.txt
      - name: Compare three runtimes, recover killed native nodes and refuse published PHP takeover
        id: prepare_runtime_comparison
        env:
          POSTGRES_IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          # Bounded container log tails make a failure in this step diagnosable from its own log.
          container_log_tails() {
            bash scripts/conformance/server-parity/container-log-tails.sh
          }
          trap container_log_tails ERR
          image=$(jq -r '.server.images["linux/amd64"] | sub("^durableworkflow/server@"; "ghcr.io/durable-workflow/server@")' tests/Fixtures/ServerParityBaselines/php-2.11.1.json)
          docker run --rm --user="$(id -u):$(id -g)" --entrypoint composer \
            -e COMPOSER_HOME=/tmp/composer -v "$PWD:/source" -w /source "$image" \
            install --working-dir=scripts/conformance/server-parity --no-interaction --no-progress
          docker run -d --name "$RESOURCE_SCOPE-php" --network "$RESOURCE_SCOPE" --network-alias=parity-php \
            --user=1000:1000 --cpus=1 --memory=512m --memory-swap=512m --tmpfs /state \
            -e DB_CONNECTION=pgsql -e DB_HOST=parity-pg -e DB_DATABASE=php_ref \
            -e DB_USERNAME=parity -e DB_PASSWORD=parity-disposable-password \
            -e CACHE_STORE=file -e QUEUE_CONNECTION=database -e DW_AUTH_TOKEN=parity-test-token "$image"
          ready=0
          for attempt in $(seq 1 30); do
            if docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint curl "$image" \
              -fsS http://parity-php:8080/api/ready > parity-evidence/php-readiness.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" \
            -e PGPASSWORD=parity-disposable-password --entrypoint createdb "$POSTGRES_IMAGE" -h parity-pg -U parity embedded_ref
          docker run -d --name "$RESOURCE_SCOPE-php-maintenance" --network "$RESOURCE_SCOPE" \
            --user=1000:1000 --cpus=0.25 --memory=256m --memory-swap=256m --entrypoint sh \
            -e DB_CONNECTION=pgsql -e DB_HOST=parity-pg -e DB_DATABASE=php_ref \
            -e DB_USERNAME=parity -e DB_PASSWORD=parity-disposable-password \
            -e CACHE_STORE=file -e QUEUE_CONNECTION=database -e DW_AUTH_TOKEN=parity-test-token \
            "$image" -c 'while :; do php artisan workflow:v2:repair-pass --json; php artisan schedule:evaluate --limit=100 --json; sleep 1; done'
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint php \
            -e DB_CONNECTION=pgsql -e DB_HOST=parity-pg -e DB_DATABASE=embedded_ref \
            -e DB_USERNAME=parity -e DB_PASSWORD=parity-disposable-password \
            -e CACHE_STORE=file -e QUEUE_CONNECTION=database -e DW_AUTH_TOKEN=parity-test-token \
            "$image" artisan server:bootstrap --force > parity-evidence/embedded-bootstrap.txt
          docker run -d --name "$RESOURCE_SCOPE-native-a" --network "$RESOURCE_SCOPE" --network-alias=parity-native-a \
            --user="$(id -u):$(id -g)" --cpus=1 --memory=256m --memory-swap=256m \
            -e DW_RUST_EXPERIMENTAL=1 -e DW_AUTH_TOKEN=parity-test-token -e DW_BIND_ADDRESS=0.0.0.0:8080 \
            -e DB_CONNECTION=pgsql -e DB_HOST=parity-pg -e DB_DATABASE=native_ref \
            -e DB_USERNAME=parity -e DB_PASSWORD=parity-disposable-password \
            -v "$PWD/rust-target:/target:ro" --tmpfs /state --entrypoint /target/debug/durable-workflow-server \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0
          docker run -d --name "$RESOURCE_SCOPE-native-b" --network "$RESOURCE_SCOPE" --network-alias=parity-native-b \
            --user="$(id -u):$(id -g)" --cpus=1 --memory=256m --memory-swap=256m \
            -e DW_RUST_EXPERIMENTAL=1 -e DW_AUTH_TOKEN=parity-test-token -e DW_BIND_ADDRESS=0.0.0.0:8080 \
            -e DB_CONNECTION=pgsql -e DB_HOST=parity-pg -e DB_DATABASE=native_ref \
            -e DB_USERNAME=parity -e DB_PASSWORD=parity-disposable-password \
            -v "$PWD/rust-target:/target:ro" --tmpfs /state --entrypoint /target/debug/durable-workflow-server \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0
          ready=0
          for attempt in $(seq 1 30); do
            if docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint curl "$image" \
              -fsS http://parity-native-a:8080/api/ready > parity-evidence/native-a-readiness.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint curl "$image" \
            -fsS http://parity-native-b:8080/api/ready > parity-evidence/native-b-readiness.json
          export DW_PARITY_RUNNER_REVISION=$(git rev-parse HEAD)
          mkdir -p parity-consumers
          curl --fail --location --retry 3 --output parity-consumers/dw.phar https://github.com/durable-workflow/cli/releases/download/2.2.0/dw.phar
          printf '%s  %s\n' "$(jq -r '.visibility.cli.phar_sha256' tests/Fixtures/ServerParity/visibility-current-runs.json)" parity-consumers/dw.phar | sha256sum -c > parity-evidence/cli-artifact.txt
          export DW_PARITY_CLI_PHAR=/source/parity-consumers/dw.phar
          docker run --rm --user=1000:1000 --entrypoint node --network "$RESOURCE_SCOPE" \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence" -w /source \
            -e DW_PARITY_TOKEN=parity-test-token -e DW_PARITY_RUNNER_REVISION -e DW_PARITY_CLI_PHAR "$image" scripts/conformance/server-parity.mjs record \
            --mode http --url http://parity-php:8080 --target php --output /evidence/php.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-insertion-activity-pending.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-insertion-activity-completed.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-created-activity-pending.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-created-activity-completed.json \
            --include-fixture tests/Fixtures/ServerParityPending/workflow-waiting-history-type.json \
            --include-fixture tests/Fixtures/ServerParityPending/workflow-waiting-history-message.json \
            --include-fixture tests/Fixtures/ServerParityPending/workflow-task-transient-retry.json
          docker run --rm --user=1000:1000 --entrypoint node --network "$RESOURCE_SCOPE" \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence" -w /source \
            -e DB_CONNECTION=pgsql -e DB_HOST=parity-pg -e DB_DATABASE=embedded_ref \
            -e DB_USERNAME=parity -e DB_PASSWORD=parity-disposable-password -e DW_MODE=embedded \
            -e CACHE_STORE=file -e QUEUE_CONNECTION=database -e DW_PARITY_RUNNER_REVISION "$image" scripts/conformance/server-parity.mjs record \
            --mode embedded --application-root /app --target embedded --output /evidence/embedded.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-insertion-activity-pending.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-insertion-activity-completed.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-created-activity-pending.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-created-activity-completed.json \
            --include-fixture tests/Fixtures/ServerParityPending/workflow-waiting-history-type.json \
            --include-fixture tests/Fixtures/ServerParityPending/workflow-waiting-history-message.json \
            --include-fixture tests/Fixtures/ServerParityPending/workflow-task-transient-retry.json
          native_record_status=0
          docker run --rm --user=1000:1000 --entrypoint node --network "$RESOURCE_SCOPE" \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence" -w /source \
            -e DW_PARITY_TOKEN=parity-test-token -e DW_PARITY_RUNNER_REVISION -e DW_PARITY_CLI_PHAR "$image" scripts/conformance/server-parity.mjs record \
            --mode http --url http://parity-native-a:8080 --target rust --output /evidence/rust.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-insertion-activity-pending.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-insertion-activity-completed.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-created-activity-pending.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-created-activity-completed.json \
            --include-fixture tests/Fixtures/ServerParityPending/workflow-waiting-history-type.json \
            --include-fixture tests/Fixtures/ServerParityPending/workflow-waiting-history-message.json \
            --include-fixture tests/Fixtures/ServerParityPending/workflow-task-transient-retry.json || native_record_status=$?
          compare_status=0
          docker run --rm --user=1000:1000 --entrypoint node --network=none \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence" -w /source "$image" \
            scripts/conformance/server-parity.mjs compare /evidence/php.json /evidence/rust.json /evidence/embedded.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-insertion-activity-pending.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-insertion-activity-completed.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-created-activity-pending.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-created-activity-completed.json \
            --include-fixture tests/Fixtures/ServerParityPending/workflow-waiting-history-type.json \
            --include-fixture tests/Fixtures/ServerParityPending/workflow-waiting-history-message.json \
            --include-fixture tests/Fixtures/ServerParityPending/workflow-task-transient-retry.json > parity-evidence/comparison.json || compare_status=$?
          bash scripts/conformance/server-parity/published-sdk-patch-profile.sh pgsql http://parity-php:8080 http://parity-native-a:8080
          bash scripts/conformance/server-parity/repeated-patch-profile.sh pgsql http://parity-php:8080 http://parity-native-a:8080
          bash scripts/conformance/server-parity/legacy-marker-profile.sh pgsql http://parity-php:8080 http://parity-native-a:8080
          bash scripts/conformance/server-parity/range-repair-profile.sh pgsql http://parity-native-a:8080
          bash scripts/conformance/server-parity/range-repair-profile.sh pgsql http://parity-native-a:8080 pending-native
          # Every SDK direction profile, in three concurrent lanes.
          bash scripts/conformance/server-parity/sdk-direction-lanes.sh pgsql http://parity-native-a:8080
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint sh \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence" -w /source \
            -e DW_PARITY_TOKEN=parity-test-token "$image" -ec '
              php scripts/conformance/server-parity/restart.php prepare http://parity-native-a:8080 /evidence/native-restart-receipt.json > /evidence/native-restart-prepare.json
              php scripts/conformance/server-parity/cooperative-restart.php prepare http://parity-native-a:8080 /evidence/cooperative-restart-receipt.json > /evidence/cooperative-restart-prepare.json
            '
          docker kill --signal=KILL "$RESOURCE_SCOPE-native-a"
          test "$(docker inspect --format='{{.State.ExitCode}}' "$RESOURCE_SCOPE-native-a")" = 137
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint curl "$image" \
            -fsS http://parity-native-b:8080/api/ready > parity-evidence/native-survivor-readiness.json
          docker run -d --name "$RESOURCE_SCOPE-recovered" --network "$RESOURCE_SCOPE" --network-alias=parity-recovered \
            --user="$(id -u):$(id -g)" --cpus=1 --memory=256m --memory-swap=256m \
            -e DW_RUST_EXPERIMENTAL=1 -e DW_AUTH_TOKEN=parity-test-token -e DW_BIND_ADDRESS=0.0.0.0:8080 \
            -e DB_CONNECTION=pgsql -e DB_HOST=parity-pg -e DB_DATABASE=native_ref \
            -e DB_USERNAME=parity -e DB_PASSWORD=parity-disposable-password \
            -v "$PWD/rust-target:/target:ro" --tmpfs /state --entrypoint /target/debug/durable-workflow-server \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0
          ready=0
          for attempt in $(seq 1 30); do
            if docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint curl "$image" \
              -fsS http://parity-recovered:8080/api/ready > parity-evidence/native-restart-readiness.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint sh \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence" -w /source \
            -e DW_PARITY_TOKEN=parity-test-token "$image" -ec '
              php scripts/conformance/server-parity/cooperative-restart.php finish http://parity-recovered:8080 /evidence/cooperative-restart-receipt.json > /evidence/cooperative-restart-finish.json
              php scripts/conformance/server-parity/restart.php finish http://parity-recovered:8080 /evidence/native-restart-receipt.json > /evidence/native-restart-finish.json
            '
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint php \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence" -w /source \
            -e DW_PARITY_TOKEN=parity-test-token "$image" scripts/conformance/server-parity/restart.php \
            prepare http://parity-php:8080 /evidence/php-pending-receipt.json > parity-evidence/php-pending.json
          docker stop "$RESOURCE_SCOPE-php" "$RESOURCE_SCOPE-php-maintenance"
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint php \
            -e DB_HOST=parity-pg -e DB_USERNAME=parity -e DB_PASSWORD=parity-disposable-password \
            -v "$PWD:/source:ro" -w /source "$image" scripts/conformance/server-parity/postgres-schema.php \
            snapshot php_ref > parity-evidence/php-before.json
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint php \
            -e DB_HOST=parity-pg -e DB_USERNAME=parity -e DB_PASSWORD=parity-disposable-password \
            -v "$PWD:/source:ro" -w /source "$image" scripts/conformance/server-parity/postgres-schema.php \
            catalog php_ref > parity-evidence/catalog-before.json
          if docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" \
            -e DW_RUST_EXPERIMENTAL=1 -e DB_CONNECTION=pgsql -e DB_HOST=parity-pg -e DB_DATABASE=php_ref \
            -e DB_USERNAME=parity -e DB_PASSWORD=parity-disposable-password \
            -v "$PWD/rust-target:/target:ro" --entrypoint /target/debug/durable-workflow-server \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0 \
            schema-bootstrap > parity-evidence/php-native-refusal.txt 2>&1; then
            exit 1
          fi
          grep -Fq existing_database_requires_qualified_takeover parity-evidence/php-native-refusal.txt
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint php \
            -e DB_HOST=parity-pg -e DB_USERNAME=parity -e DB_PASSWORD=parity-disposable-password \
            -v "$PWD:/source:ro" -w /source "$image" scripts/conformance/server-parity/postgres-schema.php \
            snapshot php_ref > parity-evidence/php-after.json
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint php \
            -e DB_HOST=parity-pg -e DB_USERNAME=parity -e DB_PASSWORD=parity-disposable-password \
            -v "$PWD:/source:ro" -w /source "$image" scripts/conformance/server-parity/postgres-schema.php \
            catalog php_ref > parity-evidence/catalog-after.json
          cmp parity-evidence/php-before.json parity-evidence/php-after.json
          cmp parity-evidence/catalog-before.json parity-evidence/catalog-after.json
          # A native fixture difference fails the step only after every later
          # check has run, so one difference cannot hide the rest.
          test "$native_record_status" -eq 0
          test "$compare_status" -eq 0
      - name: Compare separate configured role-token cohort
        env:
          POSTGRES_IMAGE: ${{ matrix.image }}
        run: bash scripts/conformance/server-parity/role-profile.sh pgsql
      - name: Back up, take over and resume a separate published PHP upgrade source
        timeout-minutes: 8
        run: bash scripts/conformance/server-parity/upgrade-source-profile.sh pgsql
      - name: Retire upgrade source cohort
        if: always()
        timeout-minutes: 3
        run: bash scripts/conformance/server-parity/upgrade-source-cleanup.sh pgsql
      - name: Back up, take over and resume a published PHP 2.9.7 upgrade source
        timeout-minutes: 8
        env:
          DW_PARITY_UPGRADE_LABEL: php297
          DW_PARITY_UPGRADE_EXPECTED_LAYOUT: php-2.9.7
          DW_PARITY_UPGRADE_PHP_IMAGE: ghcr.io/durable-workflow/server@sha256:30c34c5f3256a812fbccbe505a068309b58b0c14d01ffff0465d88604cb36d50
        run: bash scripts/conformance/server-parity/upgrade-source-profile.sh pgsql
      - name: Retire PHP 2.9.7 upgrade source cohort
        if: always()
        timeout-minutes: 3
        env:
          DW_PARITY_UPGRADE_LABEL: php297
          DW_PARITY_UPGRADE_EXPECTED_LAYOUT: php-2.9.7
          DW_PARITY_UPGRADE_PHP_IMAGE: ghcr.io/durable-workflow/server@sha256:30c34c5f3256a812fbccbe505a068309b58b0c14d01ffff0465d88604cb36d50
        run: bash scripts/conformance/server-parity/upgrade-source-cleanup.sh pgsql
      - name: Compare corrected markers, ranges, clocks and activity expiry
        if: ${{ !cancelled() && steps.prepare_runtime_comparison.outcome == 'success' }}
        env:
          POSTGRES_IMAGE: ${{ matrix.image }}
        # The preceding process-loss case deliberately kills native-a.
        run: bash scripts/conformance/server-parity/corrected-marker-shared-profile.sh pgsql http://parity-native-b:8080
      - name: Retire corrected cohort resources
        if: always()
        env:
          POSTGRES_IMAGE: ${{ matrix.image }}
        run: bash scripts/conformance/server-parity/corrected-marker-cleanup.sh pgsql
      - name: Compare installed local external payload consumers
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          POSTGRES_IMAGE: ${{ matrix.image }}
        run: bash scripts/conformance/server-parity/external-consumer-profile.sh pgsql
      - name: Retire local external consumer resources
        if: always()
        timeout-minutes: 5
        env:
          POSTGRES_IMAGE: ${{ matrix.image }}
        run: bash scripts/conformance/server-parity/external-consumer-cleanup.sh pgsql
      - name: Compare published query deadlines and installed Worker authority
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          POSTGRES_IMAGE: ${{ matrix.image }}
        run: bash scripts/conformance/server-parity/query-authority-cohort.sh pgsql
      - name: Retire query authority resources
        if: always()
        timeout-minutes: 5
        env:
          POSTGRES_IMAGE: ${{ matrix.image }}
        run: bash scripts/conformance/server-parity/query-authority-cleanup.sh pgsql
      - name: Compare pinned PHP, embedded and native worker-fencing source cohort
        if: ${{ !cancelled() }}
        env:
          POSTGRES_IMAGE: ${{ matrix.image }}
        run: bash scripts/conformance/server-parity/worker-fencing-profile.sh pgsql
      - name: Compare SDK temporary database pressure with declared fault limits
        if: ${{ !cancelled() }}
        env:
          POSTGRES_IMAGE: ${{ matrix.image }}
        run: bash scripts/conformance/server-parity/worker-fencing-profile.sh pgsql pressure
      - name: Verify TLS certificate trust and hostname checks
        env:
          POSTGRES_IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          docker run --rm --user="$(id -u):$(id -g)" --network=none \
            -v "$PWD/pg-state:/tls" --entrypoint openssl "$POSTGRES_IMAGE" req -x509 -newkey rsa:2048 \
            -nodes -sha256 -days 1 -keyout /tls/ca.key -out /tls/ca.crt -subj /CN=development-ca \
            -addext basicConstraints=critical,CA:TRUE > parity-evidence/tls-certificate-generation.txt 2>&1
          docker run --rm --user="$(id -u):$(id -g)" --network=none \
            -v "$PWD/pg-state:/tls" --entrypoint openssl "$POSTGRES_IMAGE" req -newkey rsa:2048 \
            -nodes -sha256 -keyout /tls/server.key -out /tls/server.csr -subj /CN=parity-pg \
            -addext subjectAltName=DNS:parity-pg -addext basicConstraints=critical,CA:FALSE \
            -addext extendedKeyUsage=serverAuth >> parity-evidence/tls-certificate-generation.txt 2>&1
          docker run --rm --user="$(id -u):$(id -g)" --network=none \
            -v "$PWD/pg-state:/tls" --entrypoint openssl "$POSTGRES_IMAGE" x509 -req \
            -in /tls/server.csr -CA /tls/ca.crt -CAkey /tls/ca.key -CAcreateserial -days 1 \
            -copy_extensions copy -out /tls/server.crt >> parity-evidence/tls-certificate-generation.txt 2>&1
          chmod 0600 pg-state/server.key
          docker run --rm --user="$(id -u):$(id -g)" --network=none \
            -v "$PWD/pg-state:/tls" --entrypoint openssl "$POSTGRES_IMAGE" req -x509 -newkey rsa:2048 \
            -nodes -sha256 -days 1 -keyout /tls/untrusted.key -out /tls/untrusted.crt -subj /CN=untrusted-development-ca \
            >> parity-evidence/tls-certificate-generation.txt 2>&1
          docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" \
            -e PGPASSWORD=parity-disposable-password --entrypoint psql "$POSTGRES_IMAGE" -h parity-pg -U parity -d native_ref \
            -c "ALTER SYSTEM SET ssl='on'" > parity-evidence/tls-configuration.txt
          docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" \
            -e PGPASSWORD=parity-disposable-password --entrypoint psql "$POSTGRES_IMAGE" -h parity-pg -U parity -d native_ref \
            -c 'SELECT pg_reload_conf()' >> parity-evidence/tls-configuration.txt
          docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" \
            -e DW_RUST_EXPERIMENTAL=1 -e DB_CONNECTION=pgsql -e DB_HOST=parity-pg -e DB_DATABASE=native_ref \
            -e DB_USERNAME=parity -e DB_PASSWORD=parity-disposable-password \
            -e DB_SSLMODE=verify-full -e DB_SSLROOTCERT=/tls/ca.crt \
            -v "$PWD/pg-state/ca.crt:/tls/ca.crt:ro" -v "$PWD/rust-target:/target:ro" \
            --entrypoint /target/debug/durable-workflow-server \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0 \
            schema-check > parity-evidence/tls-trusted.json
          if docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" \
            -e DW_RUST_EXPERIMENTAL=1 -e DB_CONNECTION=pgsql -e DB_HOST=parity-pg -e DB_DATABASE=native_ref \
            -e DB_USERNAME=parity -e DB_PASSWORD=parity-disposable-password \
            -e DB_SSLMODE=verify-full -e DB_SSLROOTCERT=/tls/untrusted.crt \
            -v "$PWD/pg-state/untrusted.crt:/tls/untrusted.crt:ro" -v "$PWD/rust-target:/target:ro" \
            --entrypoint /target/debug/durable-workflow-server \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0 \
            schema-check > parity-evidence/tls-untrusted.txt 2>&1; then
            exit 1
          fi
          if docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" \
            -e DW_RUST_EXPERIMENTAL=1 -e DB_CONNECTION=pgsql -e DB_HOST="$RESOURCE_SCOPE-db" -e DB_DATABASE=native_ref \
            -e DB_USERNAME=parity -e DB_PASSWORD=parity-disposable-password \
            -e DB_SSLMODE=verify-full -e DB_SSLROOTCERT=/tls/ca.crt \
            -v "$PWD/pg-state/ca.crt:/tls/ca.crt:ro" -v "$PWD/rust-target:/target:ro" \
            --entrypoint /target/debug/durable-workflow-server \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0 \
            schema-check > parity-evidence/tls-wrong-hostname.txt 2>&1; then
            exit 1
          fi
          grep -Fq database_tls_connection_failed parity-evidence/tls-untrusted.txt
          grep -Fq database_tls_connection_failed parity-evidence/tls-wrong-hostname.txt
      - name: Collect logs and clean owned resources
        if: always()
        run: |
          mkdir -p parity-evidence
          docker logs "$RESOURCE_SCOPE-php" > parity-evidence/php.log 2>&1 || true
          docker logs "$RESOURCE_SCOPE-php-maintenance" > parity-evidence/php-maintenance.log 2>&1 || true
          docker logs "$RESOURCE_SCOPE-native-a" > parity-evidence/native-a.log 2>&1 || true
          docker logs "$RESOURCE_SCOPE-native-b" > parity-evidence/native-b.log 2>&1 || true
          docker inspect --format '{{json .State}}' "$RESOURCE_SCOPE-native-a" > parity-evidence/native-a-state.json 2>&1 || true
          docker inspect --format '{{json .State}}' "$RESOURCE_SCOPE-native-b" > parity-evidence/native-b-state.json 2>&1 || true
          docker inspect --format '{"memory":{{json .HostConfig.Memory}},"memory_swap":{{json .HostConfig.MemorySwap}},"nano_cpus":{{json .HostConfig.NanoCpus}}}' "$RESOURCE_SCOPE-native-a" > parity-evidence/native-a-limits.json 2>&1 || true
          docker inspect --format '{"memory":{{json .HostConfig.Memory}},"memory_swap":{{json .HostConfig.MemorySwap}},"nano_cpus":{{json .HostConfig.NanoCpus}}}' "$RESOURCE_SCOPE-native-b" > parity-evidence/native-b-limits.json 2>&1 || true
          docker logs "$RESOURCE_SCOPE-recovered" > parity-evidence/native-recovered.log 2>&1 || true
          docker logs "$RESOURCE_SCOPE-db" > parity-evidence/postgres.log 2>&1 || true
          bash scripts/conformance/server-parity/range-repair-cleanup.sh pgsql
          bash scripts/conformance/server-parity/range-repair-cleanup.sh pgsql pending-native
          bash scripts/conformance/server-parity/sdk-direction-cleanup.sh pgsql
          bash scripts/conformance/server-parity/sdk-direction-cleanup.sh pgsql child
          bash scripts/conformance/server-parity/sdk-direction-cleanup.sh pgsql timer
          bash scripts/conformance/server-parity/sdk-direction-cleanup.sh pgsql signal
          bash scripts/conformance/server-parity/sdk-direction-cleanup.sh pgsql namespace-signal
          bash scripts/conformance/server-parity/sdk-direction-cleanup.sh pgsql selected-run-signal
          bash scripts/conformance/server-parity/sdk-direction-cleanup.sh pgsql query
          bash scripts/conformance/server-parity/sdk-direction-cleanup.sh pgsql update
          bash scripts/conformance/server-parity/sdk-direction-cleanup.sh pgsql update-failure
          bash scripts/conformance/server-parity/corrected-marker-cleanup.sh pgsql
          docker inspect --format '{{json .State}}' "$RESOURCE_SCOPE-db" > parity-evidence/database-state.json 2>&1 || true
          docker inspect --format '{{json .HostConfig.Memory}}' "$RESOURCE_SCOPE-db" > parity-evidence/database-memory-limit.json 2>&1 || true
          for profile in fence pressure; do
            for target in php native; do
              docker logs "$RESOURCE_SCOPE-$profile-$target" > "parity-evidence/$profile-$target.log" 2>&1 || true
              docker rm -f "$RESOURCE_SCOPE-$profile-$target" || true
            done
          done
          for target in php native; do
            docker logs "$RESOURCE_SCOPE-role-$target" > "parity-evidence/roles-$target.log" 2>&1 || true
            docker rm -f "$RESOURCE_SCOPE-role-$target" || true
          done
          docker rm -f "$RESOURCE_SCOPE-php" "$RESOURCE_SCOPE-php-maintenance" "$RESOURCE_SCOPE-native-a" "$RESOURCE_SCOPE-native-b" "$RESOURCE_SCOPE-recovered" "$RESOURCE_SCOPE-db" || true
          docker network rm "$RESOURCE_SCOPE" || true
      - name: Summarize PostgreSQL storage evidence
        if: always()
        env:
          PARITY_JOB_OUTCOME: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p parity-evidence parity-summary
          image=$(jq -r '.server.images["linux/amd64"] | sub("^durableworkflow/server@"; "ghcr.io/durable-workflow/server@")' tests/Fixtures/ServerParityBaselines/php-2.11.1.json)
          docker run --rm --user="$(id -u):$(id -g)" --network=none --cpus=1 --memory=256m --memory-swap=256m \
            --entrypoint node -e PARITY_JOB_OUTCOME -e GITHUB_SHA \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence:ro" -v "$PWD/parity-summary:/summary" \
            "$image" /source/scripts/conformance/server-parity/artifact-summary.mjs /evidence /summary
      - name: Retain PostgreSQL storage summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: postgres-storage-${{ matrix.label }}
          path: parity-summary
          retention-days: 1

  execution-and-codec:
    needs: published-sdk-adapters
    runs-on: ubuntu-latest
    # Corrected marker/range/clock coverage expands the job, and the fixture step
    # runs every later profile before failing; scenario budgets stay fixed.
    # MySQL runs take 75 to 85 minutes; PostgreSQL's jobs take about 60.
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Fetch this run's published SDK adapters
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: published-sdk-patch-adapters
          path: published-sdk-adapters
          digest-mismatch: error
      - name: Fetch this run's current query consumers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: query-authority-adapters
          path: query-authority-adapters
          digest-mismatch: error
      - name: Fetch this run's genuine legacy-marker adapters
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: legacy-marker-adapters
          path: legacy-marker-adapters
          digest-mismatch: error
      - name: Fetch this run's published SDK direction adapters
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sdk-direction-adapters
          path: sdk-direction-adapters
          digest-mismatch: error
      - name: Fetch this run's corrected cohort adapters
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: corrected-marker-adapters
          path: corrected-marker-adapters
          digest-mismatch: error
      - name: Fetch locked Rust dependencies
        # A registry or network failure belongs to this step, not to the
        # offline native builds and tests that follow.
        run: |
          set -euo pipefail
          mkdir -p cargo-home
          docker run --rm --user="$(id -u):$(id -g)" --cpus=2 --memory=2g --memory-swap=2g \
            -e CARGO_HOME=/cargo -e CARGO_NET_RETRY=10 \
            -v "$PWD:/source:ro" -v "$PWD/cargo-home:/cargo" -w /source/rust \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0 \
            cargo fetch --locked
      - name: Execute official Rust codec and cross-decode with published PHP
        run: |
          set -euo pipefail
          # Failed Rust tests are printed from their evidence files into this step's log.
          rust_test_failures() {
            bash scripts/conformance/server-parity/rust-test-failures.sh
          }
          trap rust_test_failures ERR
          mkdir -p cargo-home rust-target parity-evidence
          # Compiling the library tests with two jobs peaks near 4.2 GB; a 4 GB limit OOM-killed rustc (exit 101).
          docker run --rm --user="$(id -u):$(id -g)" --cpus=2 --memory=6g --memory-swap=6g \
            -e CARGO_HOME=/cargo -e CARGO_TARGET_DIR=/target -e CARGO_BUILD_JOBS=2 \
            -e DW_UPGRADE_TEST_WRITABLE=/evidence -e DW_UPGRADE_TEST_READONLY=/source/parity-evidence \
            -v "$PWD:/source:ro" -v "$PWD/cargo-home:/cargo" -v "$PWD/rust-target:/target" \
            -v "$PWD/parity-evidence:/evidence" -w /source/rust --entrypoint bash \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0 -c \
            'cargo test --locked --offline --all-targets > /evidence/rust-tests.txt && cargo build --locked --offline && cargo run --locked --offline --example codec-fixtures -- ../tests/Fixtures/ServerParity/Codec/v1.json > /evidence/rust-codec.json'
          image=$(jq -r '.server.images["linux/amd64"] | sub("^durableworkflow/server@"; "ghcr.io/durable-workflow/server@")' tests/Fixtures/ServerParityBaselines/php-2.11.1.json)
          docker run --rm --user="$(id -u):$(id -g)" --network=none --entrypoint php \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence" -w /source "$image" \
            scripts/conformance/server-parity/codec.php tests/Fixtures/ServerParity/Codec/v1.json \
            /evidence/rust-codec.json > parity-evidence/php-codec.json
          docker run --rm --user="$(id -u):$(id -g)" --network=none --cpus=2 --memory=2g --memory-swap=2g \
            -e CARGO_HOME=/cargo -e CARGO_TARGET_DIR=/target -e CARGO_BUILD_JOBS=2 \
            -v "$PWD:/source:ro" -v "$PWD/cargo-home:/cargo" -v "$PWD/rust-target:/target" \
            -v "$PWD/parity-evidence:/evidence" -w /source/rust \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0 \
            cargo run --locked --offline --example codec-fixtures -- \
            ../tests/Fixtures/ServerParity/Codec/v1.json /evidence/php-codec.json > parity-evidence/cross-decode.json
      - name: Execute and compare Rust, published PHP and embedded fixtures
        id: prepare_runtime_comparison
        env:
          RESOURCE_SCOPE: dw-parity-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          # Bounded container log tails make a failure in this step diagnosable from its own log.
          container_log_tails() {
            bash scripts/conformance/server-parity/container-log-tails.sh
          }
          trap container_log_tails ERR
          image=$(jq -r '.server.images["linux/amd64"] | sub("^durableworkflow/server@"; "ghcr.io/durable-workflow/server@")' tests/Fixtures/ServerParityBaselines/php-2.11.1.json)
          mkdir -p parity-state parity-evidence
          chmod 0777 parity-state parity-evidence
          touch parity-state/php.sqlite parity-state/embedded.sqlite parity-state/php-layout.sqlite
          chmod 0666 parity-state/*.sqlite
          docker run --rm --user="$(id -u):$(id -g)" --entrypoint composer \
            -e COMPOSER_HOME=/tmp/composer -v "$PWD:/source" -w /source "$image" \
            install --working-dir=scripts/conformance/server-parity --no-interaction --no-progress
          docker run --rm --user=1000:1000 --entrypoint node -v "$PWD:/source:ro" -w /source \
            "$image" --test tests/Unit/ServerParityRunnerTest.mjs tests/Unit/ServerParityCooperativeContractTest.mjs tests/Unit/ServerParityChildCancellationContractTest.mjs tests/Unit/ServerParityScheduleContractTest.mjs tests/Unit/ServerParityVisibilityContractTest.mjs tests/Unit/ServerParityAdmissionContractTest.mjs tests/Unit/ServerParityRoleTokenContractTest.mjs tests/Unit/ServerParityWorkerDeregistrationContractTest.mjs tests/Unit/ServerParitySearchAttributeContractTest.mjs tests/Unit/ServerParityWorkerListingContractTest.mjs tests/Unit/ServerParityWorkerReplacementContractTest.mjs tests/Unit/ServerParityPatchDeploymentContractTest.mjs tests/Unit/ServerParityWaitingHistoryContractTest.mjs tests/Unit/ServerParityTaskRetryContractTest.mjs tests/Unit/ServerParityPublishedPatchContractTest.mjs tests/Unit/ServerParityPublishedPatchTransportTest.mjs tests/Unit/ServerParityRecordFileTest.mjs tests/Unit/ServerParityLateWorkflowCompletionContractTest.mjs tests/Unit/ServerParityStorageTestContractTest.mjs tests/Unit/ServerParitySchedulePoliciesContractTest.mjs tests/Unit/ServerParitySignalsBeforeWorkerContractTest.mjs tests/Unit/ServerParityScheduleCatalogContractTest.mjs tests/Unit/ServerParityOperatorMetricsContractTest.mjs tests/Unit/ServerParityActivityLeaseRenewalContractTest.mjs tests/Unit/ServerParityServiceCatalogContractTest.mjs tests/Unit/ServerParitySystemMetricsContractTest.mjs tests/Unit/ServerParityOperatorDashboardTypesContractTest.mjs tests/Unit/ServerParityPrometheusMetricsContractTest.mjs tests/Unit/ServerParityPayloadCleanupContractTest.mjs tests/Unit/ServerParityRepairPassContractTest.mjs tests/Unit/ServerParityClusterInfoContractTest.mjs tests/Unit/ServerParityNamespaceDeleteContractTest.mjs > parity-evidence/comparator-tests.txt
          docker run --rm --user=1000:1000 --cpus=1 --memory=256m --memory-swap=256m \
            --network=none --entrypoint node -v "$PWD:/source:ro" -w /source \
            "$image" --test tests/Unit/ServerParityCodecDeadlineLoadTest.mjs > parity-evidence/codec-load-tests.txt
          docker run --rm --user=1000:1000 --cpus=1 --memory=256m --memory-swap=256m \
            --network=none --entrypoint node -v "$PWD:/source:ro" -w /source \
            "$image" --test tests/Unit/ServerParityArtifactSummaryTest.mjs tests/Unit/ServerParityQueryObserverTest.mjs > parity-evidence/artifact-summary-tests.txt
          docker network create "$RESOURCE_SCOPE"
          docker run -d --name "$RESOURCE_SCOPE-rust" --network "$RESOURCE_SCOPE" --network-alias=parity-rust \
            --user="$(id -u):$(id -g)" --cpus=1 --memory=256m --memory-swap=256m \
            -e DW_RUST_EXPERIMENTAL=1 -e DW_AUTH_TOKEN=parity-test-token \
            -e DB_DATABASE=/state/rust.sqlite -e DW_BIND_ADDRESS=0.0.0.0:8080 \
            -v "$PWD/rust-target:/target:ro" -v "$PWD/parity-state:/state" \
            --entrypoint /target/debug/durable-workflow-server \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0
          for target in php embedded; do
            docker run --rm --user=1000:1000 --entrypoint php \
              -v "$PWD/parity-state:/state" -e DB_CONNECTION=sqlite -e DB_DATABASE="/state/$target.sqlite" \
              -e CACHE_STORE=file -e QUEUE_CONNECTION=database -e DW_AUTH_TOKEN=parity-test-token \
              "$image" artisan server:bootstrap --force >> parity-evidence/bootstrap.txt
          done
          # The physical layout native creates stays the frozen published 2.5.14 one.
          layout=$(jq -r '.server.images["linux/amd64"] | sub("^durableworkflow/server@"; "ghcr.io/durable-workflow/server@")' tests/Fixtures/ServerParityBaselines/php-2.5.14.json)
          docker run --rm --user=1000:1000 --entrypoint php \
            -v "$PWD/parity-state:/state" -e DB_CONNECTION=sqlite -e DB_DATABASE=/state/php-layout.sqlite \
            -e CACHE_STORE=file -e QUEUE_CONNECTION=database -e DW_AUTH_TOKEN=parity-test-token \
            "$layout" artisan server:bootstrap --force >> parity-evidence/bootstrap.txt
          # The API server and the CPU-limited maintenance loop share one published PHP
          # SQLite file. Let SQLite serialize their writers instead of refusing at 5 s.
          docker run -d --name "$RESOURCE_SCOPE-server" --network "$RESOURCE_SCOPE" --network-alias=parity-server \
            --user=1000:1000 --cpus=1 --memory=512m --memory-swap=512m \
            -v "$PWD/parity-state:/state" -e DB_CONNECTION=sqlite -e DB_DATABASE=/state/php.sqlite -e DB_SQLITE_BUSY_TIMEOUT=30000 \
            -e CACHE_STORE=file -e QUEUE_CONNECTION=database -e DW_AUTH_TOKEN=parity-test-token "$image"
          for target in server rust; do
            ready=0
            for attempt in $(seq 1 30); do
              if docker run --rm --user=1000:1000 --entrypoint curl --network "$RESOURCE_SCOPE" "$image" \
                -fsS "http://parity-$target:8080/api/ready" > "parity-evidence/$target-readiness.json"; then
                ready=1
                break
              fi
              sleep 1
            done
            test "$ready" = 1
          done
          export DW_PARITY_RUNNER_REVISION=$(git rev-parse HEAD)
          mkdir -p parity-consumers
          curl --fail --location --retry 3 --output parity-consumers/dw.phar https://github.com/durable-workflow/cli/releases/download/2.2.0/dw.phar
          printf '%s  %s\n' "$(jq -r '.visibility.cli.phar_sha256' tests/Fixtures/ServerParity/visibility-current-runs.json)" parity-consumers/dw.phar | sha256sum -c > parity-evidence/cli-artifact.txt
          export DW_PARITY_CLI_PHAR=/source/parity-consumers/dw.phar
          docker run -d --name "$RESOURCE_SCOPE-php-maintenance" --network "$RESOURCE_SCOPE" \
            --user=1000:1000 --cpus=0.25 --memory=256m --memory-swap=256m --entrypoint sh \
            -v "$PWD/parity-state:/state" -e DB_CONNECTION=sqlite -e DB_DATABASE=/state/php.sqlite -e DB_SQLITE_BUSY_TIMEOUT=30000 \
            -e CACHE_STORE=file -e QUEUE_CONNECTION=database -e DW_AUTH_TOKEN=parity-test-token \
            "$image" -c 'while :; do php artisan workflow:v2:repair-pass --json; php artisan schedule:evaluate --limit=100 --json; sleep 1; done'
          docker run --rm --user=1000:1000 --entrypoint node --network "$RESOURCE_SCOPE" \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence" -w /source \
            -e DW_PARITY_TOKEN=parity-test-token -e DW_PARITY_RUNNER_REVISION -e DW_PARITY_CLI_PHAR "$image" scripts/conformance/server-parity.mjs record \
            --mode http --url http://parity-server:8080 --target php --output /evidence/php.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-insertion-activity-pending.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-insertion-activity-completed.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-created-activity-pending.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-created-activity-completed.json \
            --include-fixture tests/Fixtures/ServerParityPending/workflow-waiting-history-type.json \
            --include-fixture tests/Fixtures/ServerParityPending/workflow-waiting-history-message.json \
            --include-fixture tests/Fixtures/ServerParityPending/workflow-task-transient-retry.json
          docker run --rm --user=1000:1000 --entrypoint node \
            -v "$PWD:/source:ro" -v "$PWD/parity-state:/state" -v "$PWD/parity-evidence:/evidence" -w /source \
            -e DB_CONNECTION=sqlite -e DB_DATABASE=/state/embedded.sqlite -e DW_MODE=embedded \
            -e CACHE_STORE=file -e QUEUE_CONNECTION=database -e DW_PARITY_RUNNER_REVISION "$image" scripts/conformance/server-parity.mjs record \
            --mode embedded --application-root /app --target embedded --output /evidence/embedded.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-insertion-activity-pending.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-insertion-activity-completed.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-created-activity-pending.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-created-activity-completed.json \
            --include-fixture tests/Fixtures/ServerParityPending/workflow-waiting-history-type.json \
            --include-fixture tests/Fixtures/ServerParityPending/workflow-waiting-history-message.json \
            --include-fixture tests/Fixtures/ServerParityPending/workflow-task-transient-retry.json
          native_record_status=0
          docker run --rm --user=1000:1000 --entrypoint node --network "$RESOURCE_SCOPE" \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence" -w /source \
            -e DW_PARITY_TOKEN=parity-test-token -e DW_PARITY_RUNNER_REVISION -e DW_PARITY_CLI_PHAR "$image" scripts/conformance/server-parity.mjs record \
            --mode http --url http://parity-rust:8080 --target rust --output /evidence/rust.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-insertion-activity-pending.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-insertion-activity-completed.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-created-activity-pending.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-created-activity-completed.json \
            --include-fixture tests/Fixtures/ServerParityPending/workflow-waiting-history-type.json \
            --include-fixture tests/Fixtures/ServerParityPending/workflow-waiting-history-message.json \
            --include-fixture tests/Fixtures/ServerParityPending/workflow-task-transient-retry.json || native_record_status=$?
          compare_status=0
          docker run --rm --user=1000:1000 --entrypoint node \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence" -w /source "$image" \
            scripts/conformance/server-parity.mjs compare /evidence/php.json /evidence/rust.json /evidence/embedded.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-insertion-activity-pending.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-insertion-activity-completed.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-created-activity-pending.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-created-activity-completed.json \
            --include-fixture tests/Fixtures/ServerParityPending/workflow-waiting-history-type.json \
            --include-fixture tests/Fixtures/ServerParityPending/workflow-waiting-history-message.json \
            --include-fixture tests/Fixtures/ServerParityPending/workflow-task-transient-retry.json > parity-evidence/comparison.json || compare_status=$?
          bash scripts/conformance/server-parity/published-sdk-patch-profile.sh sqlite http://parity-server:8080 http://parity-rust:8080
          bash scripts/conformance/server-parity/repeated-patch-profile.sh sqlite http://parity-server:8080 http://parity-rust:8080
          bash scripts/conformance/server-parity/legacy-marker-profile.sh sqlite http://parity-server:8080 http://parity-rust:8080
          bash scripts/conformance/server-parity/range-repair-profile.sh sqlite http://parity-rust:8080
          bash scripts/conformance/server-parity/range-repair-profile.sh sqlite http://parity-rust:8080 pending-native
          # Every SDK direction profile, in three concurrent lanes.
          bash scripts/conformance/server-parity/sdk-direction-lanes.sh sqlite http://parity-rust:8080
          docker run --rm --user=1000:1000 --entrypoint php --network "$RESOURCE_SCOPE" \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence" -w /source \
            -e DW_PARITY_TOKEN=parity-test-token "$image" scripts/conformance/server-parity/restart.php \
            prepare http://parity-rust:8080 /evidence/restart-receipt.json > parity-evidence/restart-prepare.json
          docker run --rm --user=1000:1000 --entrypoint php --network "$RESOURCE_SCOPE" \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence" -w /source \
            -e DW_PARITY_TOKEN=parity-test-token "$image" scripts/conformance/server-parity/restart.php \
            prepare http://parity-server:8080 /evidence/php-refusal-receipt.json > parity-evidence/php-refusal-prepare.json
          docker run --rm --user=1000:1000 --entrypoint php --network "$RESOURCE_SCOPE" \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence" -w /source \
            -e DW_PARITY_TOKEN=parity-test-token "$image" scripts/conformance/server-parity/cooperative-restart.php \
            prepare http://parity-rust:8080 /evidence/cooperative-restart-receipt.json > parity-evidence/cooperative-restart-prepare.json
          docker kill --signal=KILL "$RESOURCE_SCOPE-rust"
          test "$(docker inspect --format='{{.State.ExitCode}}' "$RESOURCE_SCOPE-rust")" = 137
          docker stop "$RESOURCE_SCOPE-server" "$RESOURCE_SCOPE-php-maintenance"
          docker run --rm --user=1000:1000 --network=none --entrypoint php \
            -v "$PWD:/source:ro" -v "$PWD/parity-state:/state:ro" -w /source "$image" \
            scripts/conformance/server-parity/snapshot.php /state/php.sqlite > parity-evidence/php-before-native-preflight.json
          # A real published PHP database has acknowledged and pending work.
          # Native startup must refuse it before WAL setup or migration writes.
          if docker run --rm --user="$(id -u):$(id -g)" --network=none \
            -e DW_RUST_EXPERIMENTAL=1 -e DW_AUTH_TOKEN=parity-test-token -e DB_DATABASE=/state/php.sqlite \
            -v "$PWD/rust-target:/target:ro" -v "$PWD/parity-state:/state" \
            --entrypoint /target/debug/durable-workflow-server \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0 \
            > parity-evidence/php-native-refusal.log 2>&1; then
            exit 1
          fi
          grep -Fq 'existing_database_requires_qualified_takeover' parity-evidence/php-native-refusal.log
          docker run --rm --user=1000:1000 --network=none --entrypoint php \
            -v "$PWD:/source:ro" -v "$PWD/parity-state:/state:ro" \
            -v "$PWD/parity-evidence:/evidence:ro" -w /source "$image" \
            scripts/conformance/server-parity/snapshot.php /state/php.sqlite \
            /evidence/php-before-native-preflight.json > parity-evidence/php-after-native-preflight.json
          # Both engines are now stopped. PDO opens mode=ro and checks original
          # database/WAL/journal hashes. The disposable fixture directory stays
          # writable so SQLite can manage its shared-memory cache; use Rust's UID.
          docker run --rm --user="$(id -u):$(id -g)" --network=none --entrypoint php \
            -v "$PWD:/source:ro" -v "$PWD/parity-state:/state" -w /source "$image" \
            scripts/conformance/server-parity/schema.php /state/php-layout.sqlite /state/rust.sqlite > parity-evidence/schema-comparison.json
          docker logs "$RESOURCE_SCOPE-rust" > parity-evidence/rust-killed.log 2>&1
          docker run -d --name "$RESOURCE_SCOPE-recovered" --network "$RESOURCE_SCOPE" --network-alias=parity-recovered \
            --user="$(id -u):$(id -g)" --cpus=1 --memory=256m --memory-swap=256m \
            -e DW_RUST_EXPERIMENTAL=1 -e DW_AUTH_TOKEN=parity-test-token \
            -e DB_DATABASE=/state/rust.sqlite -e DW_BIND_ADDRESS=0.0.0.0:8080 \
            -v "$PWD/rust-target:/target:ro" -v "$PWD/parity-state:/state" \
            --entrypoint /target/debug/durable-workflow-server \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0
          ready=0
          for attempt in $(seq 1 30); do
            if docker run --rm --user=1000:1000 --entrypoint curl --network "$RESOURCE_SCOPE" "$image" \
              -fsS http://parity-recovered:8080/api/ready > parity-evidence/restart-readiness.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          docker run --rm --user=1000:1000 --entrypoint sh --network "$RESOURCE_SCOPE" \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence" -w /source \
            -e DW_PARITY_TOKEN=parity-test-token "$image" -ec '
              php scripts/conformance/server-parity/cooperative-restart.php finish http://parity-recovered:8080 /evidence/cooperative-restart-receipt.json > /evidence/cooperative-restart-finish.json
              php scripts/conformance/server-parity/restart.php finish http://parity-recovered:8080 /evidence/restart-receipt.json > /evidence/restart-finish.json
            '
          # A native fixture difference fails the step only after every later
          # check has run, so one difference cannot hide the rest.
          test "$native_record_status" -eq 0
          test "$compare_status" -eq 0
      - name: Compare separate configured role-token cohort
        env:
          RESOURCE_SCOPE: dw-parity-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: bash scripts/conformance/server-parity/role-profile.sh sqlite
      - name: Back up, take over and resume a separate published PHP upgrade source
        timeout-minutes: 8
        env:
          RESOURCE_SCOPE: dw-parity-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: bash scripts/conformance/server-parity/upgrade-source-profile.sh sqlite
      - name: Retire upgrade source cohort
        if: always()
        timeout-minutes: 3
        env:
          RESOURCE_SCOPE: dw-parity-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: bash scripts/conformance/server-parity/upgrade-source-cleanup.sh sqlite
      - name: Back up, take over and resume a published PHP 2.9.7 upgrade source
        timeout-minutes: 8
        env:
          RESOURCE_SCOPE: dw-parity-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          DW_PARITY_UPGRADE_LABEL: php297
          DW_PARITY_UPGRADE_EXPECTED_LAYOUT: php-2.9.7
          DW_PARITY_UPGRADE_PHP_IMAGE: ghcr.io/durable-workflow/server@sha256:30c34c5f3256a812fbccbe505a068309b58b0c14d01ffff0465d88604cb36d50
        run: bash scripts/conformance/server-parity/upgrade-source-profile.sh sqlite
      - name: Retire PHP 2.9.7 upgrade source cohort
        if: always()
        timeout-minutes: 3
        env:
          RESOURCE_SCOPE: dw-parity-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          DW_PARITY_UPGRADE_LABEL: php297
          DW_PARITY_UPGRADE_EXPECTED_LAYOUT: php-2.9.7
          DW_PARITY_UPGRADE_PHP_IMAGE: ghcr.io/durable-workflow/server@sha256:30c34c5f3256a812fbccbe505a068309b58b0c14d01ffff0465d88604cb36d50
        run: bash scripts/conformance/server-parity/upgrade-source-cleanup.sh sqlite
      - name: Compare corrected markers, ranges, clocks and activity expiry
        if: ${{ !cancelled() && steps.prepare_runtime_comparison.outcome == 'success' }}
        env:
          RESOURCE_SCOPE: dw-parity-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: bash scripts/conformance/server-parity/corrected-marker-shared-profile.sh sqlite http://parity-recovered:8080
      - name: Retire corrected cohort resources
        if: always()
        env:
          RESOURCE_SCOPE: dw-parity-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: bash scripts/conformance/server-parity/corrected-marker-cleanup.sh sqlite
      - name: Compare installed local external payload consumers
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          RESOURCE_SCOPE: dw-parity-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: bash scripts/conformance/server-parity/external-consumer-profile.sh sqlite
      - name: Retire local external consumer resources
        if: always()
        timeout-minutes: 5
        env:
          RESOURCE_SCOPE: dw-parity-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: bash scripts/conformance/server-parity/external-consumer-cleanup.sh sqlite
      - name: Compare published query deadlines and installed Worker authority
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          RESOURCE_SCOPE: dw-parity-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: bash scripts/conformance/server-parity/query-authority-cohort.sh sqlite
      - name: Retire query authority resources
        if: always()
        timeout-minutes: 5
        env:
          RESOURCE_SCOPE: dw-parity-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: bash scripts/conformance/server-parity/query-authority-cleanup.sh sqlite
      - name: Compare pinned PHP, embedded and native worker-fencing source cohort
        if: ${{ !cancelled() }}
        env:
          RESOURCE_SCOPE: dw-parity-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: bash scripts/conformance/server-parity/worker-fencing-profile.sh sqlite
      - name: Compare SDK temporary database pressure with declared fault limits
        if: ${{ !cancelled() }}
        env:
          RESOURCE_SCOPE: dw-parity-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: bash scripts/conformance/server-parity/worker-fencing-profile.sh sqlite pressure
      - name: Collect Server logs and clean resources
        if: always()
        env:
          RESOURCE_SCOPE: dw-parity-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          docker logs "$RESOURCE_SCOPE-server" > parity-evidence/server.log 2>&1 || true
          docker logs "$RESOURCE_SCOPE-php-maintenance" > parity-evidence/php-maintenance.log 2>&1 || true
          docker logs "$RESOURCE_SCOPE-rust" > parity-evidence/rust.log 2>&1 || true
          docker logs "$RESOURCE_SCOPE-recovered" > parity-evidence/rust-recovered.log 2>&1 || true
          docker inspect --format '{{json .State}}' "$RESOURCE_SCOPE-rust" > parity-evidence/rust-state.json 2>&1 || true
          docker inspect --format '{{json .State}}' "$RESOURCE_SCOPE-recovered" > parity-evidence/rust-recovered-state.json 2>&1 || true
          docker inspect --format '{"memory":{{json .HostConfig.Memory}},"memory_swap":{{json .HostConfig.MemorySwap}},"nano_cpus":{{json .HostConfig.NanoCpus}}}' "$RESOURCE_SCOPE-rust" > parity-evidence/rust-limits.json 2>&1 || true
          docker inspect --format '{"memory":{{json .HostConfig.Memory}},"memory_swap":{{json .HostConfig.MemorySwap}},"nano_cpus":{{json .HostConfig.NanoCpus}}}' "$RESOURCE_SCOPE-recovered" > parity-evidence/rust-recovered-limits.json 2>&1 || true
          bash scripts/conformance/server-parity/range-repair-cleanup.sh sqlite
          bash scripts/conformance/server-parity/range-repair-cleanup.sh sqlite pending-native
