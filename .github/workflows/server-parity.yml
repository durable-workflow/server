name: Shared Server fixtures

on:
  pull_request:
    paths:
      - .github/workflows/server-parity.yml
      - scripts/conformance/server-parity*
      - scripts/conformance/server-parity/**
      - tests/Fixtures/ServerParity/**
      - tests/Unit/ServerParityRunnerTest.mjs
      - tests/Unit/ServerParityCooperativeContractTest.mjs
      - rust/**
  push:
    branches: [main]
    paths:
      - .github/workflows/server-parity.yml
      - scripts/conformance/server-parity*
      - scripts/conformance/server-parity/**
      - tests/Fixtures/ServerParity/**
      - tests/Unit/ServerParityRunnerTest.mjs
      - tests/Unit/ServerParityCooperativeContractTest.mjs
      - rust/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: mysql-8.0
            image: mirror.gcr.io/library/mysql@sha256:62fb722c78b24245ddff1796a0fcee4a49cc5b87e0aaaf20c92d1da9e0a2497b
            memory: 768m
          - label: existing-php-mysql-matrix
            image: mirror.gcr.io/library/mysql@sha256:679e7e924f38a3cbb62a3d7df32924b83f7321a602d3f9f967c01b3df18495d6
            memory: 768m
          - label: mariadb-10.11
            image: mirror.gcr.io/library/mariadb@sha256:7db29378d4fdab73f8123bbc2b48905c90d1a4b00cf848b028f1e81e623257f2
            memory: 512m
    env:
      RESOURCE_SCOPE: dw-mysql-parity-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.label }}
      MYSQL_IMAGE: ${{ matrix.image }}
      DB_MEMORY: ${{ matrix.memory }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Create TLS fixture certificates
        run: |
          set -euo pipefail
          image=$(jq -r '.server.images["linux/amd64"] | sub("^durableworkflow/server@"; "ghcr.io/durable-workflow/server@")' tests/Fixtures/ServerParity/php-baseline.json)
          mkdir -p mysql-tls parity-evidence
          chmod 0777 parity-evidence
          docker run --rm --user="$(id -u):$(id -g)" --network=none \
            -v "$PWD/mysql-tls:/tls" --entrypoint openssl "$image" req -x509 -newkey rsa:2048 \
            -nodes -sha256 -days 1 -keyout /tls/ca.key -out /tls/ca.crt -subj /CN=development-ca \
            -addext basicConstraints=critical,CA:TRUE > parity-evidence/tls-certificate-generation.txt 2>&1
          docker run --rm --user="$(id -u):$(id -g)" --network=none \
            -v "$PWD/mysql-tls:/tls" --entrypoint openssl "$image" req -newkey rsa:2048 \
            -nodes -sha256 -keyout /tls/server.key -out /tls/server.csr -subj /CN=parity-mysql \
            -addext subjectAltName=DNS:parity-mysql -addext basicConstraints=critical,CA:FALSE \
            -addext extendedKeyUsage=serverAuth >> parity-evidence/tls-certificate-generation.txt 2>&1
          docker run --rm --user="$(id -u):$(id -g)" --network=none \
            -v "$PWD/mysql-tls:/tls" --entrypoint openssl "$image" x509 -req \
            -in /tls/server.csr -CA /tls/ca.crt -CAkey /tls/ca.key -CAcreateserial -days 1 \
            -copy_extensions copy -out /tls/server.crt >> parity-evidence/tls-certificate-generation.txt 2>&1
          chmod 0600 mysql-tls/server.key
          docker run --rm --user="$(id -u):$(id -g)" --network=none \
            -v "$PWD/mysql-tls:/tls" --entrypoint openssl "$image" req -x509 -newkey rsa:2048 \
            -nodes -sha256 -days 1 -keyout /tls/untrusted.key -out /tls/untrusted.crt -subj /CN=untrusted-development-ca \
            >> parity-evidence/tls-certificate-generation.txt 2>&1
      - name: Bootstrap independent published PHP and native MySQL databases
        run: |
          set -euo pipefail
          mkdir -p cargo-home rust-target parity-evidence mysql-state
          chmod 0777 parity-evidence
          docker network create "$RESOURCE_SCOPE"
          docker run -d --name "$RESOURCE_SCOPE-db" --network "$RESOURCE_SCOPE" --network-alias=parity-mysql \
            --user="$(id -u):$(id -g)" --cpus=1 --memory="$DB_MEMORY" --memory-swap="$DB_MEMORY" \
            -e MYSQL_ROOT_PASSWORD=parity-disposable-password -e MYSQL_ROOT_HOST=% -e MYSQL_DATABASE=php_ref \
            -v "$PWD/mysql-state:/var/lib/mysql" -v "$PWD/mysql-tls:/tls:ro" "$MYSQL_IMAGE" \
            --skip-log-bin --innodb-buffer-pool-size=128M --performance-schema=OFF \
            --ssl-ca=/tls/ca.crt --ssl-cert=/tls/server.crt --ssl-key=/tls/server.key
          ready=0
          for attempt in $(seq 1 60); do
            if docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" --entrypoint mysql \
              "$MYSQL_IMAGE" -h parity-mysql -uroot -pparity-disposable-password -e 'SELECT 1'; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" --entrypoint mysql \
            "$MYSQL_IMAGE" -h parity-mysql -uroot -pparity-disposable-password -N -e 'SELECT VERSION()' > parity-evidence/database-version.txt
          docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" --entrypoint mysql \
            "$MYSQL_IMAGE" -h parity-mysql -uroot -pparity-disposable-password \
            -e 'CREATE DATABASE native_ref CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          image=$(jq -r '.server.images["linux/amd64"] | sub("^durableworkflow/server@"; "ghcr.io/durable-workflow/server@")' tests/Fixtures/ServerParity/php-baseline.json)
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint php \
            -e DB_CONNECTION=mysql -e DB_HOST=parity-mysql -e DB_DATABASE=php_ref \
            -e DB_USERNAME=root -e DB_PASSWORD=parity-disposable-password \
            -e CACHE_STORE=file -e QUEUE_CONNECTION=database -e DW_AUTH_TOKEN=parity-test-token \
            "$image" artisan server:bootstrap --force > parity-evidence/published-bootstrap.txt
          docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" --cpus=2 --memory=2g --memory-swap=2g \
            -e CARGO_HOME=/cargo -e CARGO_TARGET_DIR=/target -e CARGO_BUILD_JOBS=2 \
            -e DW_TEST_MYSQL_URL=mysql://root:parity-disposable-password@parity-mysql:3306/php_ref \
            -e DW_EXECUTION_MYSQL_URL=mysql://root:parity-disposable-password@parity-mysql:3306/php_ref \
            -v "$PWD:/source:ro" -v "$PWD/cargo-home:/cargo" -v "$PWD/rust-target:/target" \
            -v "$PWD/parity-evidence:/evidence" -w /source/rust --entrypoint bash \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0 -c \
            'cargo test --locked --lib runtime::mysql::tests::qualification_ -- --ignored --nocapture --test-threads=2 > /evidence/mysql-tests.txt && cargo test --locked --test execution -- --nocapture --test-threads=2 > /evidence/mysql-execution-tests.txt && cargo build --locked'
          docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" \
            -e DW_RUST_EXPERIMENTAL=1 -e DB_CONNECTION=mysql -e DB_HOST=parity-mysql -e DB_DATABASE=native_ref \
            -e DB_USERNAME=root -e DB_PASSWORD=parity-disposable-password \
            -v "$PWD/rust-target:/target:ro" --entrypoint /target/debug/durable-workflow-server \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0 \
            schema-bootstrap > parity-evidence/native-bootstrap.json
          docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" \
            -e DW_RUST_EXPERIMENTAL=1 -e DB_CONNECTION=mysql -e DB_HOST=parity-mysql -e DB_DATABASE=native_ref \
            -e DB_USERNAME=root -e DB_PASSWORD=parity-disposable-password \
            -v "$PWD/rust-target:/target:ro" --entrypoint /target/debug/durable-workflow-server \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0 \
            schema-check > parity-evidence/native-check.json
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint php \
            -e DB_HOST=parity-mysql -e DB_USERNAME=root -e DB_PASSWORD=parity-disposable-password \
            -v "$PWD:/source:ro" -w /source "$image" \
            scripts/conformance/server-parity/mysql-schema.php compare php_ref native_ref > parity-evidence/catalog-comparison.json
      - name: Compare three runtimes, recover killed native nodes and refuse published PHP takeover
        run: |
          set -euo pipefail
          image=$(jq -r '.server.images["linux/amd64"] | sub("^durableworkflow/server@"; "ghcr.io/durable-workflow/server@")' tests/Fixtures/ServerParity/php-baseline.json)
          docker run --rm --user="$(id -u):$(id -g)" --entrypoint composer \
            -e COMPOSER_HOME=/tmp/composer -v "$PWD:/source" -w /source "$image" \
            install --working-dir=scripts/conformance/server-parity --no-interaction --no-progress
          docker run -d --name "$RESOURCE_SCOPE-php" --network "$RESOURCE_SCOPE" --network-alias=parity-php \
            --user=1000:1000 --cpus=1 --memory=512m --memory-swap=512m \
            -e DB_CONNECTION=mysql -e DB_HOST=parity-mysql -e DB_DATABASE=php_ref \
            -e DB_USERNAME=root -e DB_PASSWORD=parity-disposable-password \
            -e CACHE_STORE=file -e QUEUE_CONNECTION=database -e DW_AUTH_TOKEN=parity-test-token "$image"
          ready=0
          for attempt in $(seq 1 30); do
            if docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint curl "$image" \
              -fsS http://parity-php:8080/api/ready > parity-evidence/php-readiness.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" --entrypoint mysql \
            "$MYSQL_IMAGE" -h parity-mysql -uroot -pparity-disposable-password \
            -e 'CREATE DATABASE embedded_ref CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint php \
            -e DB_CONNECTION=mysql -e DB_HOST=parity-mysql -e DB_DATABASE=embedded_ref \
            -e DB_USERNAME=root -e DB_PASSWORD=parity-disposable-password \
            -e CACHE_STORE=file -e QUEUE_CONNECTION=database -e DW_AUTH_TOKEN=parity-test-token \
            "$image" artisan server:bootstrap --force > parity-evidence/embedded-bootstrap.txt
          docker run -d --name "$RESOURCE_SCOPE-native-a" --network "$RESOURCE_SCOPE" --network-alias=parity-native-a \
            --user="$(id -u):$(id -g)" --cpus=1 --memory=256m --memory-swap=256m \
            -e DW_RUST_EXPERIMENTAL=1 -e DW_AUTH_TOKEN=parity-test-token -e DW_BIND_ADDRESS=0.0.0.0:8080 \
            -e DB_CONNECTION=mysql -e DB_HOST=parity-mysql -e DB_DATABASE=native_ref \
            -e DB_USERNAME=root -e DB_PASSWORD=parity-disposable-password \
            -v "$PWD/rust-target:/target:ro" --entrypoint /target/debug/durable-workflow-server \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0
          docker run -d --name "$RESOURCE_SCOPE-native-b" --network "$RESOURCE_SCOPE" --network-alias=parity-native-b \
            --user="$(id -u):$(id -g)" --cpus=1 --memory=256m --memory-swap=256m \
            -e DW_RUST_EXPERIMENTAL=1 -e DW_AUTH_TOKEN=parity-test-token -e DW_BIND_ADDRESS=0.0.0.0:8080 \
            -e DB_CONNECTION=mysql -e DB_HOST=parity-mysql -e DB_DATABASE=native_ref \
            -e DB_USERNAME=root -e DB_PASSWORD=parity-disposable-password \
            -v "$PWD/rust-target:/target:ro" --entrypoint /target/debug/durable-workflow-server \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0
          ready=0
          for attempt in $(seq 1 30); do
            if docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint curl "$image" \
              -fsS http://parity-native-a:8080/api/ready > parity-evidence/native-a-readiness.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint curl "$image" \
            -fsS http://parity-native-b:8080/api/ready > parity-evidence/native-b-readiness.json
          export DW_PARITY_RUNNER_REVISION=$(git rev-parse HEAD)
          docker run --rm --user=1000:1000 --entrypoint node --network "$RESOURCE_SCOPE" \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence" -w /source \
            -e DW_PARITY_TOKEN=parity-test-token -e DW_PARITY_RUNNER_REVISION "$image" scripts/conformance/server-parity.mjs record \
            --mode http --url http://parity-php:8080 --target php --output /evidence/php.json
          docker run --rm --user=1000:1000 --entrypoint node --network "$RESOURCE_SCOPE" \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence" -w /source \
            -e DW_PARITY_TOKEN=parity-test-token -e DW_PARITY_RUNNER_REVISION "$image" scripts/conformance/server-parity.mjs record \
            --mode http --url http://parity-native-a:8080 --target rust --output /evidence/rust.json
          docker run --rm --user=1000:1000 --entrypoint node --network "$RESOURCE_SCOPE" \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence" -w /source \
            -e DB_CONNECTION=mysql -e DB_HOST=parity-mysql -e DB_DATABASE=embedded_ref \
            -e DB_USERNAME=root -e DB_PASSWORD=parity-disposable-password -e DW_MODE=embedded \
            -e CACHE_STORE=file -e QUEUE_CONNECTION=database -e DW_PARITY_RUNNER_REVISION "$image" scripts/conformance/server-parity.mjs record \
            --mode embedded --application-root /app --target embedded --output /evidence/embedded.json
          docker run --rm --user=1000:1000 --entrypoint node --network=none \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence" -w /source "$image" \
            scripts/conformance/server-parity.mjs compare /evidence/php.json /evidence/rust.json /evidence/embedded.json > parity-evidence/comparison.json
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint php \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence" -w /source \
            -e DW_PARITY_TOKEN=parity-test-token "$image" scripts/conformance/server-parity/restart.php \
            prepare http://parity-native-a:8080 /evidence/native-restart-receipt.json > parity-evidence/native-restart-prepare.json
          docker kill --signal=KILL "$RESOURCE_SCOPE-native-a"
          test "$(docker inspect --format='{{.State.ExitCode}}' "$RESOURCE_SCOPE-native-a")" = 137
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint curl "$image" \
            -fsS http://parity-native-b:8080/api/ready > parity-evidence/native-survivor-readiness.json
          docker run -d --name "$RESOURCE_SCOPE-recovered" --network "$RESOURCE_SCOPE" --network-alias=parity-recovered \
            --user="$(id -u):$(id -g)" --cpus=1 --memory=256m --memory-swap=256m \
            -e DW_RUST_EXPERIMENTAL=1 -e DW_AUTH_TOKEN=parity-test-token -e DW_BIND_ADDRESS=0.0.0.0:8080 \
            -e DB_CONNECTION=mysql -e DB_HOST=parity-mysql -e DB_DATABASE=native_ref \
            -e DB_USERNAME=root -e DB_PASSWORD=parity-disposable-password \
            -v "$PWD/rust-target:/target:ro" --entrypoint /target/debug/durable-workflow-server \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0
          ready=0
          for attempt in $(seq 1 30); do
            if docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint curl "$image" \
              -fsS http://parity-recovered:8080/api/ready > parity-evidence/native-restart-readiness.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint php \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence" -w /source \
            -e DW_PARITY_TOKEN=parity-test-token "$image" scripts/conformance/server-parity/restart.php \
            finish http://parity-recovered:8080 /evidence/native-restart-receipt.json > parity-evidence/native-restart-finish.json
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint php \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence" -w /source \
            -e DW_PARITY_TOKEN=parity-test-token "$image" scripts/conformance/server-parity/restart.php \
            prepare http://parity-php:8080 /evidence/php-pending-receipt.json > parity-evidence/php-pending.json
          docker stop "$RESOURCE_SCOPE-php"
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint php \
            -e DB_HOST=parity-mysql -e DB_USERNAME=root -e DB_PASSWORD=parity-disposable-password \
            -v "$PWD:/source:ro" -w /source "$image" scripts/conformance/server-parity/mysql-schema.php \
            snapshot php_ref > parity-evidence/php-before.json
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint php \
            -e DB_HOST=parity-mysql -e DB_USERNAME=root -e DB_PASSWORD=parity-disposable-password \
            -v "$PWD:/source:ro" -w /source "$image" scripts/conformance/server-parity/mysql-schema.php \
            catalog php_ref > parity-evidence/catalog-before.json
          if docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" \
            -e DW_RUST_EXPERIMENTAL=1 -e DB_CONNECTION=mysql -e DB_HOST=parity-mysql -e DB_DATABASE=php_ref \
            -e DB_USERNAME=root -e DB_PASSWORD=parity-disposable-password \
            -v "$PWD/rust-target:/target:ro" --entrypoint /target/debug/durable-workflow-server \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0 \
            schema-bootstrap > parity-evidence/php-native-refusal.txt 2>&1; then
            exit 1
          fi
          grep -Fq existing_database_requires_qualified_takeover parity-evidence/php-native-refusal.txt
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint php \
            -e DB_HOST=parity-mysql -e DB_USERNAME=root -e DB_PASSWORD=parity-disposable-password \
            -v "$PWD:/source:ro" -w /source "$image" scripts/conformance/server-parity/mysql-schema.php \
            snapshot php_ref > parity-evidence/php-after.json
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint php \
            -e DB_HOST=parity-mysql -e DB_USERNAME=root -e DB_PASSWORD=parity-disposable-password \
            -v "$PWD:/source:ro" -w /source "$image" scripts/conformance/server-parity/mysql-schema.php \
            catalog php_ref > parity-evidence/catalog-after.json
          cmp parity-evidence/php-before.json parity-evidence/php-after.json
          cmp parity-evidence/catalog-before.json parity-evidence/catalog-after.json
      - name: Verify TLS certificate trust and hostname checks
        run: |
          set -euo pipefail
          docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" \
            -e DW_RUST_EXPERIMENTAL=1 -e DB_CONNECTION=mysql -e DB_HOST=parity-mysql -e DB_DATABASE=native_ref \
            -e DB_USERNAME=root -e DB_PASSWORD=parity-disposable-password \
            -e DB_SSLMODE=verify_identity -e DB_SSLROOTCERT=/tls/ca.crt \
            -v "$PWD/mysql-tls/ca.crt:/tls/ca.crt:ro" -v "$PWD/rust-target:/target:ro" \
            --entrypoint /target/debug/durable-workflow-server \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0 \
            schema-check > parity-evidence/tls-trusted.json
          if docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" \
            -e DW_RUST_EXPERIMENTAL=1 -e DB_CONNECTION=mysql -e DB_HOST=parity-mysql -e DB_DATABASE=native_ref \
            -e DB_USERNAME=root -e DB_PASSWORD=parity-disposable-password \
            -e DB_SSLMODE=verify_identity -e DB_SSLROOTCERT=/tls/untrusted.crt \
            -v "$PWD/mysql-tls/untrusted.crt:/tls/untrusted.crt:ro" -v "$PWD/rust-target:/target:ro" \
            --entrypoint /target/debug/durable-workflow-server \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0 \
            schema-check > parity-evidence/tls-untrusted.txt 2>&1; then
            exit 1
          fi
          if docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" \
            -e DW_RUST_EXPERIMENTAL=1 -e DB_CONNECTION=mysql -e DB_HOST="$RESOURCE_SCOPE-db" -e DB_DATABASE=native_ref \
            -e DB_USERNAME=root -e DB_PASSWORD=parity-disposable-password \
            -e DB_SSLMODE=verify_identity -e DB_SSLROOTCERT=/tls/ca.crt \
            -v "$PWD/mysql-tls/ca.crt:/tls/ca.crt:ro" -v "$PWD/rust-target:/target:ro" \
            --entrypoint /target/debug/durable-workflow-server \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0 \
            schema-check > parity-evidence/tls-wrong-hostname.txt 2>&1; then
            exit 1
          fi
          grep -Fq storage_unavailable parity-evidence/tls-untrusted.txt
          grep -Fq storage_unavailable parity-evidence/tls-wrong-hostname.txt
      - name: Collect logs and clean owned resources
        if: always()
        run: |
          mkdir -p parity-evidence
          docker logs "$RESOURCE_SCOPE-php" > parity-evidence/php.log 2>&1 || true
          docker logs "$RESOURCE_SCOPE-native-a" > parity-evidence/native-a.log 2>&1 || true
          docker logs "$RESOURCE_SCOPE-native-b" > parity-evidence/native-b.log 2>&1 || true
          docker logs "$RESOURCE_SCOPE-recovered" > parity-evidence/native-recovered.log 2>&1 || true
          docker logs "$RESOURCE_SCOPE-db" > parity-evidence/database.log 2>&1 || true
          docker rm -f "$RESOURCE_SCOPE-php" "$RESOURCE_SCOPE-native-a" "$RESOURCE_SCOPE-native-b" "$RESOURCE_SCOPE-recovered" "$RESOURCE_SCOPE-db" || true
          docker network rm "$RESOURCE_SCOPE" || true
      - name: Retain MySQL execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mysql-execution-${{ matrix.label }}
          path: parity-evidence
          retention-days: 90

  postgres-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: existing-php-matrix
            image: mirror.gcr.io/library/postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
          - label: postgres-17
            image: mirror.gcr.io/library/postgres@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    env:
      RESOURCE_SCOPE: dw-pg-parity-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.label }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Bootstrap independent published PHP and native PostgreSQL databases
        env:
          POSTGRES_IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          mkdir -p cargo-home rust-target parity-evidence pg-state
          chmod 0777 parity-evidence
          docker network create "$RESOURCE_SCOPE"
          docker run -d --name "$RESOURCE_SCOPE-db" --network "$RESOURCE_SCOPE" --network-alias=parity-pg \
            --user="$(id -u):$(id -g)" --cpus=1 --memory=512m --memory-swap=512m \
            -e POSTGRES_USER=parity -e POSTGRES_PASSWORD=parity-disposable-password -e POSTGRES_DB=php_ref \
            -v "$PWD/pg-state:/var/lib/postgresql/data" "$POSTGRES_IMAGE"
          ready=0
          for attempt in $(seq 1 30); do
            if docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" \
              --entrypoint pg_isready "$POSTGRES_IMAGE" -h parity-pg -U parity -d php_ref; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          docker run --rm --user="$(id -u):$(id -g)" --network=none --entrypoint postgres \
            "$POSTGRES_IMAGE" --version > parity-evidence/postgres-version.txt
          docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" \
            -e PGPASSWORD=parity-disposable-password --entrypoint createdb "$POSTGRES_IMAGE" -h parity-pg -U parity native_ref
          image=$(jq -r '.server.images["linux/amd64"] | sub("^durableworkflow/server@"; "ghcr.io/durable-workflow/server@")' tests/Fixtures/ServerParity/php-baseline.json)
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint php \
            -e DB_CONNECTION=pgsql -e DB_HOST=parity-pg -e DB_DATABASE=php_ref \
            -e DB_USERNAME=parity -e DB_PASSWORD=parity-disposable-password \
            -e CACHE_STORE=file -e QUEUE_CONNECTION=database -e DW_AUTH_TOKEN=parity-test-token \
            "$image" artisan server:bootstrap --force > parity-evidence/published-bootstrap.txt
          docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" --cpus=2 --memory=2g --memory-swap=2g \
            -e CARGO_HOME=/cargo -e CARGO_TARGET_DIR=/target -e CARGO_BUILD_JOBS=2 \
            -e DW_TEST_POSTGRES_URL=postgres://parity:parity-disposable-password@parity-pg:5432/php_ref \
            -e DW_EXECUTION_POSTGRES_URL=postgres://parity:parity-disposable-password@parity-pg:5432/php_ref \
            -v "$PWD:/source:ro" -v "$PWD/cargo-home:/cargo" -v "$PWD/rust-target:/target" \
            -v "$PWD/parity-evidence:/evidence" -w /source/rust --entrypoint bash \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0 -c \
            'cargo test --locked --lib runtime::postgres::tests::qualification_ -- --ignored --nocapture > /evidence/postgres-tests.txt && cargo test --locked --test execution -- --nocapture > /evidence/postgres-execution-tests.txt && cargo build --locked'
          docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" \
            -e DW_RUST_EXPERIMENTAL=1 -e DB_CONNECTION=pgsql -e DB_HOST=parity-pg -e DB_DATABASE=native_ref \
            -e DB_USERNAME=parity -e DB_PASSWORD=parity-disposable-password \
            -v "$PWD/rust-target:/target:ro" --entrypoint /target/debug/durable-workflow-server \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0 \
            schema-bootstrap > parity-evidence/native-bootstrap.json
          docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" \
            -e DW_RUST_EXPERIMENTAL=1 -e DB_CONNECTION=pgsql -e DB_HOST=parity-pg -e DB_DATABASE=native_ref \
            -e DB_USERNAME=parity -e DB_PASSWORD=parity-disposable-password \
            -v "$PWD/rust-target:/target:ro" --entrypoint /target/debug/durable-workflow-server \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0 \
            schema-check > parity-evidence/native-check.json
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint php \
            -e DB_HOST=parity-pg -e DB_USERNAME=parity -e DB_PASSWORD=parity-disposable-password \
            -v "$PWD:/source:ro" -w /source "$image" \
            scripts/conformance/server-parity/postgres-schema.php compare php_ref native_ref > parity-evidence/catalog-comparison.json
      - name: Compare three runtimes, recover killed native nodes and refuse published PHP takeover
        env:
          POSTGRES_IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          image=$(jq -r '.server.images["linux/amd64"] | sub("^durableworkflow/server@"; "ghcr.io/durable-workflow/server@")' tests/Fixtures/ServerParity/php-baseline.json)
          docker run --rm --user="$(id -u):$(id -g)" --entrypoint composer \
            -e COMPOSER_HOME=/tmp/composer -v "$PWD:/source" -w /source "$image" \
            install --working-dir=scripts/conformance/server-parity --no-interaction --no-progress
          docker run -d --name "$RESOURCE_SCOPE-php" --network "$RESOURCE_SCOPE" --network-alias=parity-php \
            --user=1000:1000 --cpus=1 --memory=512m --memory-swap=512m \
            -e DB_CONNECTION=pgsql -e DB_HOST=parity-pg -e DB_DATABASE=php_ref \
            -e DB_USERNAME=parity -e DB_PASSWORD=parity-disposable-password \
            -e CACHE_STORE=file -e QUEUE_CONNECTION=database -e DW_AUTH_TOKEN=parity-test-token "$image"
          ready=0
          for attempt in $(seq 1 30); do
            if docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint curl "$image" \
              -fsS http://parity-php:8080/api/ready > parity-evidence/php-readiness.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" \
            -e PGPASSWORD=parity-disposable-password --entrypoint createdb "$POSTGRES_IMAGE" -h parity-pg -U parity embedded_ref
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint php \
            -e DB_CONNECTION=pgsql -e DB_HOST=parity-pg -e DB_DATABASE=embedded_ref \
            -e DB_USERNAME=parity -e DB_PASSWORD=parity-disposable-password \
            -e CACHE_STORE=file -e QUEUE_CONNECTION=database -e DW_AUTH_TOKEN=parity-test-token \
            "$image" artisan server:bootstrap --force > parity-evidence/embedded-bootstrap.txt
          docker run -d --name "$RESOURCE_SCOPE-native-a" --network "$RESOURCE_SCOPE" --network-alias=parity-native-a \
            --user="$(id -u):$(id -g)" --cpus=1 --memory=256m --memory-swap=256m \
            -e DW_RUST_EXPERIMENTAL=1 -e DW_AUTH_TOKEN=parity-test-token -e DW_BIND_ADDRESS=0.0.0.0:8080 \
            -e DB_CONNECTION=pgsql -e DB_HOST=parity-pg -e DB_DATABASE=native_ref \
            -e DB_USERNAME=parity -e DB_PASSWORD=parity-disposable-password \
            -v "$PWD/rust-target:/target:ro" --entrypoint /target/debug/durable-workflow-server \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0
          docker run -d --name "$RESOURCE_SCOPE-native-b" --network "$RESOURCE_SCOPE" --network-alias=parity-native-b \
            --user="$(id -u):$(id -g)" --cpus=1 --memory=256m --memory-swap=256m \
            -e DW_RUST_EXPERIMENTAL=1 -e DW_AUTH_TOKEN=parity-test-token -e DW_BIND_ADDRESS=0.0.0.0:8080 \
            -e DB_CONNECTION=pgsql -e DB_HOST=parity-pg -e DB_DATABASE=native_ref \
            -e DB_USERNAME=parity -e DB_PASSWORD=parity-disposable-password \
            -v "$PWD/rust-target:/target:ro" --entrypoint /target/debug/durable-workflow-server \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0
          ready=0
          for attempt in $(seq 1 30); do
            if docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint curl "$image" \
              -fsS http://parity-native-a:8080/api/ready > parity-evidence/native-a-readiness.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint curl "$image" \
            -fsS http://parity-native-b:8080/api/ready > parity-evidence/native-b-readiness.json
          export DW_PARITY_RUNNER_REVISION=$(git rev-parse HEAD)
          docker run --rm --user=1000:1000 --entrypoint node --network "$RESOURCE_SCOPE" \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence" -w /source \
            -e DW_PARITY_TOKEN=parity-test-token -e DW_PARITY_RUNNER_REVISION "$image" scripts/conformance/server-parity.mjs record \
            --mode http --url http://parity-php:8080 --target php --output /evidence/php.json
          docker run --rm --user=1000:1000 --entrypoint node --network "$RESOURCE_SCOPE" \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence" -w /source \
            -e DW_PARITY_TOKEN=parity-test-token -e DW_PARITY_RUNNER_REVISION "$image" scripts/conformance/server-parity.mjs record \
            --mode http --url http://parity-native-a:8080 --target rust --output /evidence/rust.json
          docker run --rm --user=1000:1000 --entrypoint node --network "$RESOURCE_SCOPE" \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence" -w /source \
            -e DB_CONNECTION=pgsql -e DB_HOST=parity-pg -e DB_DATABASE=embedded_ref \
            -e DB_USERNAME=parity -e DB_PASSWORD=parity-disposable-password -e DW_MODE=embedded \
            -e CACHE_STORE=file -e QUEUE_CONNECTION=database -e DW_PARITY_RUNNER_REVISION "$image" scripts/conformance/server-parity.mjs record \
            --mode embedded --application-root /app --target embedded --output /evidence/embedded.json
          docker run --rm --user=1000:1000 --entrypoint node --network=none \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence" -w /source "$image" \
            scripts/conformance/server-parity.mjs compare /evidence/php.json /evidence/rust.json /evidence/embedded.json > parity-evidence/comparison.json
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint php \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence" -w /source \
            -e DW_PARITY_TOKEN=parity-test-token "$image" scripts/conformance/server-parity/restart.php \
            prepare http://parity-native-a:8080 /evidence/native-restart-receipt.json > parity-evidence/native-restart-prepare.json
          docker kill --signal=KILL "$RESOURCE_SCOPE-native-a"
          test "$(docker inspect --format='{{.State.ExitCode}}' "$RESOURCE_SCOPE-native-a")" = 137
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint curl "$image" \
            -fsS http://parity-native-b:8080/api/ready > parity-evidence/native-survivor-readiness.json
          docker run -d --name "$RESOURCE_SCOPE-recovered" --network "$RESOURCE_SCOPE" --network-alias=parity-recovered \
            --user="$(id -u):$(id -g)" --cpus=1 --memory=256m --memory-swap=256m \
            -e DW_RUST_EXPERIMENTAL=1 -e DW_AUTH_TOKEN=parity-test-token -e DW_BIND_ADDRESS=0.0.0.0:8080 \
            -e DB_CONNECTION=pgsql -e DB_HOST=parity-pg -e DB_DATABASE=native_ref \
            -e DB_USERNAME=parity -e DB_PASSWORD=parity-disposable-password \
            -v "$PWD/rust-target:/target:ro" --entrypoint /target/debug/durable-workflow-server \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0
          ready=0
          for attempt in $(seq 1 30); do
            if docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint curl "$image" \
              -fsS http://parity-recovered:8080/api/ready > parity-evidence/native-restart-readiness.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint php \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence" -w /source \
            -e DW_PARITY_TOKEN=parity-test-token "$image" scripts/conformance/server-parity/restart.php \
            finish http://parity-recovered:8080 /evidence/native-restart-receipt.json > parity-evidence/native-restart-finish.json
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint php \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence" -w /source \
            -e DW_PARITY_TOKEN=parity-test-token "$image" scripts/conformance/server-parity/restart.php \
            prepare http://parity-php:8080 /evidence/php-pending-receipt.json > parity-evidence/php-pending.json
          docker stop "$RESOURCE_SCOPE-php"
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint php \
            -e DB_HOST=parity-pg -e DB_USERNAME=parity -e DB_PASSWORD=parity-disposable-password \
            -v "$PWD:/source:ro" -w /source "$image" scripts/conformance/server-parity/postgres-schema.php \
            snapshot php_ref > parity-evidence/php-before.json
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint php \
            -e DB_HOST=parity-pg -e DB_USERNAME=parity -e DB_PASSWORD=parity-disposable-password \
            -v "$PWD:/source:ro" -w /source "$image" scripts/conformance/server-parity/postgres-schema.php \
            catalog php_ref > parity-evidence/catalog-before.json
          if docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" \
            -e DW_RUST_EXPERIMENTAL=1 -e DB_CONNECTION=pgsql -e DB_HOST=parity-pg -e DB_DATABASE=php_ref \
            -e DB_USERNAME=parity -e DB_PASSWORD=parity-disposable-password \
            -v "$PWD/rust-target:/target:ro" --entrypoint /target/debug/durable-workflow-server \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0 \
            schema-bootstrap > parity-evidence/php-native-refusal.txt 2>&1; then
            exit 1
          fi
          grep -Fq existing_database_requires_qualified_takeover parity-evidence/php-native-refusal.txt
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint php \
            -e DB_HOST=parity-pg -e DB_USERNAME=parity -e DB_PASSWORD=parity-disposable-password \
            -v "$PWD:/source:ro" -w /source "$image" scripts/conformance/server-parity/postgres-schema.php \
            snapshot php_ref > parity-evidence/php-after.json
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint php \
            -e DB_HOST=parity-pg -e DB_USERNAME=parity -e DB_PASSWORD=parity-disposable-password \
            -v "$PWD:/source:ro" -w /source "$image" scripts/conformance/server-parity/postgres-schema.php \
            catalog php_ref > parity-evidence/catalog-after.json
          cmp parity-evidence/php-before.json parity-evidence/php-after.json
          cmp parity-evidence/catalog-before.json parity-evidence/catalog-after.json
      - name: Verify TLS certificate trust and hostname checks
        env:
          POSTGRES_IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          docker run --rm --user="$(id -u):$(id -g)" --network=none \
            -v "$PWD/pg-state:/tls" --entrypoint openssl "$POSTGRES_IMAGE" req -x509 -newkey rsa:2048 \
            -nodes -sha256 -days 1 -keyout /tls/ca.key -out /tls/ca.crt -subj /CN=development-ca \
            -addext basicConstraints=critical,CA:TRUE > parity-evidence/tls-certificate-generation.txt 2>&1
          docker run --rm --user="$(id -u):$(id -g)" --network=none \
            -v "$PWD/pg-state:/tls" --entrypoint openssl "$POSTGRES_IMAGE" req -newkey rsa:2048 \
            -nodes -sha256 -keyout /tls/server.key -out /tls/server.csr -subj /CN=parity-pg \
            -addext subjectAltName=DNS:parity-pg -addext basicConstraints=critical,CA:FALSE \
            -addext extendedKeyUsage=serverAuth >> parity-evidence/tls-certificate-generation.txt 2>&1
          docker run --rm --user="$(id -u):$(id -g)" --network=none \
            -v "$PWD/pg-state:/tls" --entrypoint openssl "$POSTGRES_IMAGE" x509 -req \
            -in /tls/server.csr -CA /tls/ca.crt -CAkey /tls/ca.key -CAcreateserial -days 1 \
            -copy_extensions copy -out /tls/server.crt >> parity-evidence/tls-certificate-generation.txt 2>&1
          chmod 0600 pg-state/server.key
          docker run --rm --user="$(id -u):$(id -g)" --network=none \
            -v "$PWD/pg-state:/tls" --entrypoint openssl "$POSTGRES_IMAGE" req -x509 -newkey rsa:2048 \
            -nodes -sha256 -days 1 -keyout /tls/untrusted.key -out /tls/untrusted.crt -subj /CN=untrusted-development-ca \
            >> parity-evidence/tls-certificate-generation.txt 2>&1
          docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" \
            -e PGPASSWORD=parity-disposable-password --entrypoint psql "$POSTGRES_IMAGE" -h parity-pg -U parity -d native_ref \
            -c "ALTER SYSTEM SET ssl='on'" > parity-evidence/tls-configuration.txt
          docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" \
            -e PGPASSWORD=parity-disposable-password --entrypoint psql "$POSTGRES_IMAGE" -h parity-pg -U parity -d native_ref \
            -c 'SELECT pg_reload_conf()' >> parity-evidence/tls-configuration.txt
          docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" \
            -e DW_RUST_EXPERIMENTAL=1 -e DB_CONNECTION=pgsql -e DB_HOST=parity-pg -e DB_DATABASE=native_ref \
            -e DB_USERNAME=parity -e DB_PASSWORD=parity-disposable-password \
            -e DB_SSLMODE=verify-full -e DB_SSLROOTCERT=/tls/ca.crt \
            -v "$PWD/pg-state/ca.crt:/tls/ca.crt:ro" -v "$PWD/rust-target:/target:ro" \
            --entrypoint /target/debug/durable-workflow-server \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0 \
            schema-check > parity-evidence/tls-trusted.json
          if docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" \
            -e DW_RUST_EXPERIMENTAL=1 -e DB_CONNECTION=pgsql -e DB_HOST=parity-pg -e DB_DATABASE=native_ref \
            -e DB_USERNAME=parity -e DB_PASSWORD=parity-disposable-password \
            -e DB_SSLMODE=verify-full -e DB_SSLROOTCERT=/tls/untrusted.crt \
            -v "$PWD/pg-state/untrusted.crt:/tls/untrusted.crt:ro" -v "$PWD/rust-target:/target:ro" \
            --entrypoint /target/debug/durable-workflow-server \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0 \
            schema-check > parity-evidence/tls-untrusted.txt 2>&1; then
            exit 1
          fi
          if docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" \
            -e DW_RUST_EXPERIMENTAL=1 -e DB_CONNECTION=pgsql -e DB_HOST="$RESOURCE_SCOPE-db" -e DB_DATABASE=native_ref \
            -e DB_USERNAME=parity -e DB_PASSWORD=parity-disposable-password \
            -e DB_SSLMODE=verify-full -e DB_SSLROOTCERT=/tls/ca.crt \
            -v "$PWD/pg-state/ca.crt:/tls/ca.crt:ro" -v "$PWD/rust-target:/target:ro" \
            --entrypoint /target/debug/durable-workflow-server \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0 \
            schema-check > parity-evidence/tls-wrong-hostname.txt 2>&1; then
            exit 1
          fi
          grep -Fq storage_unavailable parity-evidence/tls-untrusted.txt
          grep -Fq storage_unavailable parity-evidence/tls-wrong-hostname.txt
      - name: Collect logs and clean owned resources
        if: always()
        run: |
          mkdir -p parity-evidence
          docker logs "$RESOURCE_SCOPE-php" > parity-evidence/php.log 2>&1 || true
          docker logs "$RESOURCE_SCOPE-native-a" > parity-evidence/native-a.log 2>&1 || true
          docker logs "$RESOURCE_SCOPE-native-b" > parity-evidence/native-b.log 2>&1 || true
          docker logs "$RESOURCE_SCOPE-recovered" > parity-evidence/native-recovered.log 2>&1 || true
          docker logs "$RESOURCE_SCOPE-db" > parity-evidence/postgres.log 2>&1 || true
          docker rm -f "$RESOURCE_SCOPE-php" "$RESOURCE_SCOPE-native-a" "$RESOURCE_SCOPE-native-b" "$RESOURCE_SCOPE-recovered" "$RESOURCE_SCOPE-db" || true
          docker network rm "$RESOURCE_SCOPE" || true
      - name: Retain PostgreSQL storage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: postgres-storage-${{ matrix.label }}
          path: parity-evidence
          retention-days: 90

  execution-and-codec:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Execute official Rust codec and cross-decode with published PHP
        run: |
          set -euo pipefail
          mkdir -p cargo-home rust-target parity-evidence
          docker run --rm --user="$(id -u):$(id -g)" --cpus=2 --memory=2g --memory-swap=2g \
            -e CARGO_HOME=/cargo -e CARGO_TARGET_DIR=/target -e CARGO_BUILD_JOBS=2 \
            -v "$PWD:/source:ro" -v "$PWD/cargo-home:/cargo" -v "$PWD/rust-target:/target" \
            -v "$PWD/parity-evidence:/evidence" -w /source/rust --entrypoint bash \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0 -c \
            'cargo test --locked --all-targets > /evidence/rust-tests.txt && cargo build --locked && cargo run --locked --example codec-fixtures -- ../tests/Fixtures/ServerParity/Codec/v1.json > /evidence/rust-codec.json'
          image=$(jq -r '.server.images["linux/amd64"] | sub("^durableworkflow/server@"; "ghcr.io/durable-workflow/server@")' tests/Fixtures/ServerParity/php-baseline.json)
          docker run --rm --user="$(id -u):$(id -g)" --network=none --entrypoint php \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence" -w /source "$image" \
            scripts/conformance/server-parity/codec.php tests/Fixtures/ServerParity/Codec/v1.json \
            /evidence/rust-codec.json > parity-evidence/php-codec.json
          docker run --rm --user="$(id -u):$(id -g)" --network=none --cpus=2 --memory=2g --memory-swap=2g \
            -e CARGO_HOME=/cargo -e CARGO_TARGET_DIR=/target -e CARGO_BUILD_JOBS=2 \
            -v "$PWD:/source:ro" -v "$PWD/cargo-home:/cargo" -v "$PWD/rust-target:/target" \
            -v "$PWD/parity-evidence:/evidence" -w /source/rust \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0 \
            cargo run --locked --offline --example codec-fixtures -- \
            ../tests/Fixtures/ServerParity/Codec/v1.json /evidence/php-codec.json > parity-evidence/cross-decode.json
      - name: Execute and compare Rust, published PHP and embedded fixtures
        env:
          RESOURCE_SCOPE: dw-parity-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          image=$(jq -r '.server.images["linux/amd64"] | sub("^durableworkflow/server@"; "ghcr.io/durable-workflow/server@")' tests/Fixtures/ServerParity/php-baseline.json)
          mkdir -p parity-state parity-evidence
          chmod 0777 parity-state parity-evidence
          touch parity-state/php.sqlite parity-state/embedded.sqlite
          chmod 0666 parity-state/*.sqlite
          docker run --rm --user="$(id -u):$(id -g)" --entrypoint composer \
            -e COMPOSER_HOME=/tmp/composer -v "$PWD:/source" -w /source "$image" \
            install --working-dir=scripts/conformance/server-parity --no-interaction --no-progress
          docker run --rm --user=1000:1000 --entrypoint node -v "$PWD:/source:ro" -w /source \
            "$image" --test tests/Unit/ServerParityRunnerTest.mjs tests/Unit/ServerParityCooperativeContractTest.mjs > parity-evidence/comparator-tests.txt
          docker network create "$RESOURCE_SCOPE"
          docker run -d --name "$RESOURCE_SCOPE-rust" --network "$RESOURCE_SCOPE" --network-alias=parity-rust \
            --user="$(id -u):$(id -g)" --cpus=1 --memory=256m --memory-swap=256m \
            -e DW_RUST_EXPERIMENTAL=1 -e DW_AUTH_TOKEN=parity-test-token \
            -e DB_DATABASE=/state/rust.sqlite -e DW_BIND_ADDRESS=0.0.0.0:8080 \
            -v "$PWD/rust-target:/target:ro" -v "$PWD/parity-state:/state" \
            --entrypoint /target/debug/durable-workflow-server \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0
          for target in php embedded; do
            docker run --rm --user=1000:1000 --entrypoint php \
              -v "$PWD/parity-state:/state" -e DB_CONNECTION=sqlite -e DB_DATABASE="/state/$target.sqlite" \
              -e CACHE_STORE=file -e QUEUE_CONNECTION=database -e DW_AUTH_TOKEN=parity-test-token \
              "$image" artisan server:bootstrap --force >> parity-evidence/bootstrap.txt
          done
          docker run -d --name "$RESOURCE_SCOPE-server" --network "$RESOURCE_SCOPE" --network-alias=parity-server \
            --user=1000:1000 --cpus=1 --memory=512m --memory-swap=512m \
            -v "$PWD/parity-state:/state" -e DB_CONNECTION=sqlite -e DB_DATABASE=/state/php.sqlite \
            -e CACHE_STORE=file -e QUEUE_CONNECTION=database -e DW_AUTH_TOKEN=parity-test-token "$image"
          for target in server rust; do
            ready=0
            for attempt in $(seq 1 30); do
              if docker run --rm --user=1000:1000 --entrypoint curl --network "$RESOURCE_SCOPE" "$image" \
                -fsS "http://parity-$target:8080/api/ready" > "parity-evidence/$target-readiness.json"; then
                ready=1
                break
              fi
              sleep 1
            done
            test "$ready" = 1
          done
          export DW_PARITY_RUNNER_REVISION=$(git rev-parse HEAD)
          docker run --rm --user=1000:1000 --entrypoint node --network "$RESOURCE_SCOPE" \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence" -w /source \
            -e DW_PARITY_TOKEN=parity-test-token -e DW_PARITY_RUNNER_REVISION "$image" scripts/conformance/server-parity.mjs record \
            --mode http --url http://parity-server:8080 --target php --output /evidence/php.json
          docker run --rm --user=1000:1000 --entrypoint node --network "$RESOURCE_SCOPE" \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence" -w /source \
            -e DW_PARITY_TOKEN=parity-test-token -e DW_PARITY_RUNNER_REVISION "$image" scripts/conformance/server-parity.mjs record \
            --mode http --url http://parity-rust:8080 --target rust --output /evidence/rust.json
          docker run --rm --user=1000:1000 --entrypoint node \
            -v "$PWD:/source:ro" -v "$PWD/parity-state:/state" -v "$PWD/parity-evidence:/evidence" -w /source \
            -e DB_CONNECTION=sqlite -e DB_DATABASE=/state/embedded.sqlite -e DW_MODE=embedded \
            -e CACHE_STORE=file -e QUEUE_CONNECTION=database -e DW_PARITY_RUNNER_REVISION "$image" scripts/conformance/server-parity.mjs record \
            --mode embedded --application-root /app --target embedded --output /evidence/embedded.json
          docker run --rm --user=1000:1000 --entrypoint node \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence" -w /source "$image" \
            scripts/conformance/server-parity.mjs compare /evidence/php.json /evidence/rust.json /evidence/embedded.json > parity-evidence/comparison.json
          docker run --rm --user=1000:1000 --entrypoint php --network "$RESOURCE_SCOPE" \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence" -w /source \
            -e DW_PARITY_TOKEN=parity-test-token "$image" scripts/conformance/server-parity/restart.php \
            prepare http://parity-rust:8080 /evidence/restart-receipt.json > parity-evidence/restart-prepare.json
          docker run --rm --user=1000:1000 --entrypoint php --network "$RESOURCE_SCOPE" \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence" -w /source \
            -e DW_PARITY_TOKEN=parity-test-token "$image" scripts/conformance/server-parity/restart.php \
            prepare http://parity-server:8080 /evidence/php-refusal-receipt.json > parity-evidence/php-refusal-prepare.json
          docker kill --signal=KILL "$RESOURCE_SCOPE-rust"
          test "$(docker inspect --format='{{.State.ExitCode}}' "$RESOURCE_SCOPE-rust")" = 137
          docker stop "$RESOURCE_SCOPE-server"
          docker run --rm --user=1000:1000 --network=none --entrypoint php \
            -v "$PWD:/source:ro" -v "$PWD/parity-state:/state:ro" -w /source "$image" \
            scripts/conformance/server-parity/snapshot.php /state/php.sqlite > parity-evidence/php-before-native-preflight.json
          # A real published PHP database has acknowledged and pending work.
          # Native startup must refuse it before WAL setup or migration writes.
          if docker run --rm --user="$(id -u):$(id -g)" --network=none \
            -e DW_RUST_EXPERIMENTAL=1 -e DW_AUTH_TOKEN=parity-test-token -e DB_DATABASE=/state/php.sqlite \
            -v "$PWD/rust-target:/target:ro" -v "$PWD/parity-state:/state" \
            --entrypoint /target/debug/durable-workflow-server \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0 \
            > parity-evidence/php-native-refusal.log 2>&1; then
            exit 1
          fi
          grep -Fq 'existing_database_requires_qualified_takeover' parity-evidence/php-native-refusal.log
          docker run --rm --user=1000:1000 --network=none --entrypoint php \
            -v "$PWD:/source:ro" -v "$PWD/parity-state:/state:ro" \
            -v "$PWD/parity-evidence:/evidence:ro" -w /source "$image" \
            scripts/conformance/server-parity/snapshot.php /state/php.sqlite \
            /evidence/php-before-native-preflight.json > parity-evidence/php-after-native-preflight.json
          # Both engines are now stopped. PDO opens mode=ro and checks original
          # database/WAL/journal hashes. The disposable fixture directory stays
          # writable so SQLite can manage its shared-memory cache; use Rust's UID.
          docker run --rm --user="$(id -u):$(id -g)" --network=none --entrypoint php \
            -v "$PWD:/source:ro" -v "$PWD/parity-state:/state" -w /source "$image" \
            scripts/conformance/server-parity/schema.php /state/php.sqlite /state/rust.sqlite > parity-evidence/schema-comparison.json
          docker logs "$RESOURCE_SCOPE-rust" > parity-evidence/rust-killed.log 2>&1
          docker run -d --name "$RESOURCE_SCOPE-recovered" --network "$RESOURCE_SCOPE" --network-alias=parity-recovered \
            --user="$(id -u):$(id -g)" --cpus=1 --memory=256m --memory-swap=256m \
            -e DW_RUST_EXPERIMENTAL=1 -e DW_AUTH_TOKEN=parity-test-token \
            -e DB_DATABASE=/state/rust.sqlite -e DW_BIND_ADDRESS=0.0.0.0:8080 \
            -v "$PWD/rust-target:/target:ro" -v "$PWD/parity-state:/state" \
            --entrypoint /target/debug/durable-workflow-server \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0
          ready=0
          for attempt in $(seq 1 30); do
            if docker run --rm --user=1000:1000 --entrypoint curl --network "$RESOURCE_SCOPE" "$image" \
              -fsS http://parity-recovered:8080/api/ready > parity-evidence/restart-readiness.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          docker run --rm --user=1000:1000 --entrypoint php --network "$RESOURCE_SCOPE" \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence" -w /source \
            -e DW_PARITY_TOKEN=parity-test-token "$image" scripts/conformance/server-parity/restart.php \
            finish http://parity-recovered:8080 /evidence/restart-receipt.json > parity-evidence/restart-finish.json
      - name: Collect Server logs and clean resources
        if: always()
        env:
          RESOURCE_SCOPE: dw-parity-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          docker logs "$RESOURCE_SCOPE-server" > parity-evidence/server.log 2>&1 || true
          docker logs "$RESOURCE_SCOPE-rust" > parity-evidence/rust.log 2>&1 || true
          docker logs "$RESOURCE_SCOPE-recovered" > parity-evidence/rust-recovered.log 2>&1 || true
          docker rm -f "$RESOURCE_SCOPE-server" || true
          docker rm -f "$RESOURCE_SCOPE-rust" || true
          docker rm -f "$RESOURCE_SCOPE-recovered" || true
          docker network rm "$RESOURCE_SCOPE" || true
      - name: Retain fixture evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shared-server-fixtures
          path: parity-evidence
          retention-days: 90
          if-no-files-found: error
