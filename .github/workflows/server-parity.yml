          docker run --rm --user="$(id -u):$(id -g)" --network=none --cpus=1 --memory=256m --memory-swap=256m \
            --entrypoint node -e PARITY_JOB_OUTCOME -e GITHUB_SHA \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence:ro" -v "$PWD/parity-summary:/summary" \
            "$image" /source/scripts/conformance/server-parity/artifact-summary.mjs /evidence /summary
