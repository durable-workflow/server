name: Server 1204 original MariaDB context (diagnostic branch only)

# Temporary replacement on the diagnostic branch, never a main-branch change.
on:
  workflow_dispatch:
    inputs:
      expected_profile_commit:
        description: Exact independently reviewed diagnostic profile commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: server1204-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    if: github.ref == 'refs/heads/investigate/server-1204-hosted-context' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: capture
    env:
      EXPECTED_PROFILE_COMMIT: ${{ inputs.expected_profile_commit }}
      RESOURCE_SCOPE: dw-server1204-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - name: Checkout the capture profile
        id: profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: capture
          persist-credentials: false
      - name: Checkout the fixed observer source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 688c1cddb1783529f8fc097ece08bebaeded3706
          path: observer
          persist-credentials: false
      - name: Check the profile without Docker effects
        run: python3 -I -B scripts/ci/server_1204_capture.py check --source "$GITHUB_WORKSPACE/observer" --evidence "$GITHUB_WORKSPACE/evidence"
      - name: One original-context capture
        timeout-minutes: 50
        run: python3 -I -B scripts/ci/server_1204_capture.py run --source "$GITHUB_WORKSPACE/observer" --evidence "$GITHUB_WORKSPACE/evidence"
      - name: Reconcile only this invocation's resources
        if: always()
        timeout-minutes: 3
        run: python3 -I -B scripts/ci/server_1204_capture.py cleanup --source "$GITHUB_WORKSPACE/observer" --evidence "$GITHUB_WORKSPACE/evidence"
      - name: Keep the diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: server1204-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: warn
          retention-days: 7
