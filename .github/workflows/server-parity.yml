      - tests/Support/ServerParityAdmissionObservation.mjs
      - tests/Support/ServerParityVisibilityObservation.mjs
      - rust/**
  workflow_dispatch:

permissions:
  contents: read

env:
  DW_PARITY_MEMO_FIXTURE_ID: memo-activity-replay
  DW_PARITY_MEMO_PYTHON: '1'
  DW_PARITY_MEMO_RUST: '1'
  DW_PARITY_CONTINUE_MEMO_UPSERTS: '1'

jobs:
  published-sdk-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RESOURCE_SCOPE: dw-codec-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build the locked published SDK adapter once
        run: |
          set -euo pipefail
          mkdir -p sdk-cargo sdk-target published-sdk-adapters/python-packages
          docker run --rm --user="$(id -u):$(id -g)" --cpus=2 --memory=2g --memory-swap=2g \
            -e CARGO_HOME=/cargo -e CARGO_TARGET_DIR=/target -e CARGO_BUILD_JOBS=2 \
            -e CARGO_INCREMENTAL=0 -e CARGO_PROFILE_DEV_DEBUG=0 \
            -v "$PWD:/source:ro" -v "$PWD/sdk-cargo:/cargo" -v "$PWD/sdk-target:/target" \
            -w /source/scripts/conformance/server-parity/published-sdk-patch/rust \
            mirror.gcr.io/library/rust@sha256:300ec56abce8cc9448ddea2172747d048ed902a3090e6b57babb2bf19f754081 \
            cargo build --locked > published-sdk-adapters/rust-sdk-build.txt 2>&1
          cp sdk-target/debug/server-parity-published-rust-patch published-sdk-adapters/rust-worker
          cp scripts/conformance/server-parity/published-sdk-patch/rust/Cargo.lock published-sdk-adapters/Cargo.lock
          docker run --rm --user="$(id -u):$(id -g)" --cpus=1 --memory=512m --memory-swap=512m \
            -v "$PWD:/source:ro" -v "$PWD/published-sdk-adapters:/adapters" \
            mirror.gcr.io/library/python@sha256:bf44cdfcb76cd3b41e879bc058fc37ec5872002ccfde7fcb765e218cde0cd79c \
            python -m pip install --disable-pip-version-check --no-cache-dir --no-compile --only-binary=:all: --require-hashes \
            --target /adapters/python-packages --report /adapters/python-install-report.json \
            -r /source/scripts/conformance/server-parity/published-sdk-patch/requirements.txt \
            > published-sdk-adapters/python-install.txt 2>&1
          image=$(jq -r '.server.images["linux/amd64"] | sub("^durableworkflow/server@"; "ghcr.io/durable-workflow/server@")' tests/Fixtures/ServerParityProfiles/published-sdk-patch-replay/artifacts.json)
          docker run --rm --user="$(id -u):$(id -g)" --network=none --entrypoint node \
            -v "$PWD:/source:ro" -v "$PWD/published-sdk-adapters:/adapters" -w /source "$image" \
            scripts/conformance/server-parity/published-sdk-patch/identity.mjs /adapters \
            tests/Fixtures/ServerParityProfiles/published-sdk-patch-replay/artifacts.json
          printf '%s\n' "$GITHUB_SHA" > published-sdk-adapters/runner-revision.txt
          sha256sum scripts/conformance/server-parity/published-sdk-patch/rust/{Cargo.toml,Cargo.lock,src/main.rs} \
            scripts/conformance/server-parity/published-sdk-patch/{python.py,requirements.txt} > published-sdk-adapters/source-hashes.sha256
          cd published-sdk-adapters
          find . -type f ! -path ./SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS >/dev/null
      - name: Build genuine legacy-marker adapters with the existing cache
        run: bash scripts/conformance/server-parity/legacy-marker-adapters.sh
      - name: Build fresh published SDK direction adapters with the existing cache
        run: bash scripts/conformance/server-parity/sdk-direction-adapters.sh
      - name: Build the separate corrected cohort with the existing SDK cache
        env:
          DW_PARITY_CORRECTED_ARTIFACTS: tests/Fixtures/ServerParityProfiles/corrected-markers/artifacts-workflow-2.5.16.json
          DW_PARITY_CORRECTED_CARGO: sdk-cargo
          DW_PARITY_CORRECTED_TARGET: sdk-target
        run: bash scripts/conformance/server-parity/corrected-marker-adapters.sh
      - name: Build the separate current query consumers once
        run: bash scripts/conformance/server-parity/query-authority-adapters.sh
      - name: Share current query consumers without compiler caches
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: query-authority-adapters
          path: query-authority-adapters
          retention-days: 1
          if-no-files-found: error
      - name: Share the corrected cohort without compiler caches or target trees
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: corrected-marker-adapters
          path: corrected-marker-adapters
          retention-days: 1
          if-no-files-found: error
      - name: Build one bounded optimized native artifact for deadline health
        run: bash scripts/conformance/server-parity/codec-operations-build.sh codec-native-build
      - name: Share the optimized binary without compiler caches
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codec-native-build
          path: |
            codec-native-build/server
            codec-native-build/build.json
            codec-native-build/SHA256SUMS
          retention-days: 1
          if-no-files-found: error
      - name: Retire the owned optimized build container
        if: always()
        run: |
          build_container="$RESOURCE_SCOPE-build"
          docker rm -f "$build_container" >/dev/null 2>&1 || true
      - name: Share thin published SDK direction adapters
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdk-direction-adapters
          path: sdk-direction-adapters
          retention-days: 1
          if-no-files-found: error
      - name: Share genuine legacy-marker adapters without build trees or caches
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: legacy-marker-adapters
          path: legacy-marker-adapters
          retention-days: 1
          if-no-files-found: error
      - name: Share thin adapters without build trees or caches
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: published-sdk-patch-adapters
          path: published-sdk-adapters
          retention-days: 1
          if-no-files-found: error

      - name: Keep small failed SDK setup diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: failed-sdk-setup-diagnostics
          path: |
            published-sdk-adapters/*-build.txt
            published-sdk-adapters/*-install.txt
            legacy-marker-adapters/*-build.txt
            legacy-marker-adapters/*-install.txt
            sdk-direction-adapters/*-build.txt
            sdk-direction-adapters/*-install.txt
            corrected-marker-adapters/*-build.txt
            corrected-marker-adapters/*-install.txt
            codec-native-build/build.txt
            query-authority-adapters/*-build.txt
            query-authority-adapters/*-install.txt
          retention-days: 1
          if-no-files-found: ignore

  codec-deadline-health:
    needs: published-sdk-adapters
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres-16, postgres-17, mysql-8.0, mysql-8.4, mariadb-10.11]
    env:
      RESOURCE_SCOPE: dw-codec-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.database }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Fetch this run's optimized native binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: codec-native-build
          path: codec-native-build
          digest-mismatch: error
      - name: Fetch this run's normally installed corrected PHP SDK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: corrected-marker-adapters
          path: corrected-marker-adapters
          digest-mismatch: error
      - name: Check exact binary provenance and execute one fresh original per family
        run: |
          set -euo pipefail
          (cd codec-native-build; sha256sum -c SHA256SUMS)
          chmod +x codec-native-build/server
          bash scripts/conformance/server-parity/codec-operations-cell.sh \
            '${{ matrix.database }}' cpu-cell codec-native-build corrected-marker-adapters/php codec-evidence
      - name: Retire this cell's exact owned resources
        if: always()
        run: |
          scope="$RESOURCE_SCOPE"
          native_server="$scope-native"
          db="$scope-db"
          probe="$scope-ready"
          observer="$RESOURCE_SCOPE-native-codec-observer"
          docker rm -f "$observer" "$probe" "$native_server" >/dev/null 2>&1 || true
          docker stop --time 10 "$db" >/dev/null 2>&1 || true
          docker rm "$db" >/dev/null 2>&1 || true
          docker network rm "$scope" >/dev/null 2>&1 || true
          if test -d codec-evidence/state; then rm -r -- codec-evidence/state; fi
      - name: Publish the bounded outcome
        if: always()
        run: |
          if test -f codec-evidence/database-audit.json; then
            printf 'Database: %s\n\n' '${{ matrix.database }}' >> "$GITHUB_STEP_SUMMARY"
            cat codec-evidence/database-audit.json >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'CPU/deadline original did not qualify. See this job diagnostics.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep small outcomes and failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codec-deadline-health-${{ matrix.database }}
          path: |
            codec-evidence/build.json
            codec-evidence/database*.json
            codec-evidence/database-version.txt
            codec-evidence/codec-*-contract.txt
            codec-evidence/codec-*-controls.txt
            codec-evidence/limits.json
            codec-evidence/*state.json
            codec-evidence/server-log.txt
            codec-evidence/server-ready-errors.txt
            codec-evidence/profile.txt
            codec-evidence/failed.json
          retention-days: 1
          if-no-files-found: warn

  mysql-execution:
    needs: published-sdk-adapters
    runs-on: ubuntu-latest
    # Corrected marker/range/clock coverage expands the job, and the fixture step
    # runs every later profile before failing; scenario budgets stay fixed.
    # MySQL runs take 75 to 85 minutes; PostgreSQL's jobs take about 60.
    timeout-minutes: 105
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: mysql-8.0
            image: mirror.gcr.io/library/mysql@sha256:62fb722c78b24245ddff1796a0fcee4a49cc5b87e0aaaf20c92d1da9e0a2497b
            # The expanded original was OOM-killed at 1 GiB during native pressure.
            memory: 2g
          - label: existing-php-mysql-matrix
            image: mirror.gcr.io/library/mysql@sha256:679e7e924f38a3cbb62a3d7df32924b83f7321a602d3f9f967c01b3df18495d6
            # The expanded shared database was OOM-killed at 1 GiB before TLS checks.
            memory: 2g
          - label: mariadb-10.11
            image: mirror.gcr.io/library/mariadb@sha256:7db29378d4fdab73f8123bbc2b48905c90d1a4b00cf848b028f1e81e623257f2
            # Both expanded originals exhausted the 512 MiB DB fixture ceiling.
            memory: 1g
    env:
      RESOURCE_SCOPE: dw-mysql-parity-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.label }}
      MYSQL_IMAGE: ${{ matrix.image }}
      DB_MEMORY: ${{ matrix.memory }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Fetch this run's published SDK adapters
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: published-sdk-patch-adapters
          path: published-sdk-adapters
          digest-mismatch: error
      - name: Fetch this run's current query consumers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: query-authority-adapters
          path: query-authority-adapters
          digest-mismatch: error
      - name: Fetch this run's genuine legacy-marker adapters
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: legacy-marker-adapters
          path: legacy-marker-adapters
          digest-mismatch: error
      - name: Fetch this run's published SDK direction adapters
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sdk-direction-adapters
          path: sdk-direction-adapters
          digest-mismatch: error
      - name: Fetch this run's corrected cohort adapters
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: corrected-marker-adapters
          path: corrected-marker-adapters
          digest-mismatch: error
      - name: Create TLS fixture certificates
        run: |
          set -euo pipefail
          image=$(jq -r '.server.images["linux/amd64"] | sub("^durableworkflow/server@"; "ghcr.io/durable-workflow/server@")' tests/Fixtures/ServerParityBaselines/php-2.11.1.json)
          mkdir -p mysql-tls parity-evidence
          chmod 0777 parity-evidence
          docker run --rm --user="$(id -u):$(id -g)" --network=none \
            -v "$PWD/mysql-tls:/tls" --entrypoint openssl "$image" req -x509 -newkey rsa:2048 \
            -nodes -sha256 -days 1 -keyout /tls/ca.key -out /tls/ca.crt -subj /CN=development-ca \
            -addext basicConstraints=critical,CA:TRUE > parity-evidence/tls-certificate-generation.txt 2>&1
          docker run --rm --user="$(id -u):$(id -g)" --network=none \
            -v "$PWD/mysql-tls:/tls" --entrypoint openssl "$image" req -newkey rsa:2048 \
            -nodes -sha256 -keyout /tls/server.key -out /tls/server.csr -subj /CN=parity-mysql \
            -addext subjectAltName=DNS:parity-mysql -addext basicConstraints=critical,CA:FALSE \
            -addext extendedKeyUsage=serverAuth >> parity-evidence/tls-certificate-generation.txt 2>&1
          docker run --rm --user="$(id -u):$(id -g)" --network=none \
            -v "$PWD/mysql-tls:/tls" --entrypoint openssl "$image" x509 -req \
            -in /tls/server.csr -CA /tls/ca.crt -CAkey /tls/ca.key -CAcreateserial -days 1 \
            -copy_extensions copy -out /tls/server.crt >> parity-evidence/tls-certificate-generation.txt 2>&1
          chmod 0600 mysql-tls/server.key
          docker run --rm --user="$(id -u):$(id -g)" --network=none \
            -v "$PWD/mysql-tls:/tls" --entrypoint openssl "$image" req -x509 -newkey rsa:2048 \
            -nodes -sha256 -days 1 -keyout /tls/untrusted.key -out /tls/untrusted.crt -subj /CN=untrusted-development-ca \
            >> parity-evidence/tls-certificate-generation.txt 2>&1
      - name: Fetch locked Rust dependencies
        # A registry or network failure belongs to this step, not to the
        # offline native builds and tests that follow.
        run: |
          set -euo pipefail
          mkdir -p cargo-home
          docker run --rm --user="$(id -u):$(id -g)" --cpus=2 --memory=2g --memory-swap=2g \
            -e CARGO_HOME=/cargo -e CARGO_NET_RETRY=10 \
            -v "$PWD:/source:ro" -v "$PWD/cargo-home:/cargo" -w /source/rust \
            mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0 \
            cargo fetch --locked
      - name: Bootstrap independent published PHP and native MySQL databases
        run: |
          set -euo pipefail
          # Failed Rust tests are printed from their evidence files into this step's log.
          rust_test_failures() {
            bash scripts/conformance/server-parity/rust-test-failures.sh
          }
          trap rust_test_failures ERR
          mkdir -p cargo-home rust-target parity-evidence mysql-state
          chmod 0777 parity-evidence
          docker network create "$RESOURCE_SCOPE"
          docker run -d --name "$RESOURCE_SCOPE-db" --network "$RESOURCE_SCOPE" --network-alias=parity-mysql \
            --user="$(id -u):$(id -g)" --cpus=1 --memory="$DB_MEMORY" --memory-swap="$DB_MEMORY" \
            -e MYSQL_ROOT_PASSWORD=parity-disposable-password -e MYSQL_ROOT_HOST=% -e MYSQL_DATABASE=php_ref \
            -v "$PWD/mysql-state:/var/lib/mysql" -v "$PWD/mysql-tls:/tls:ro" "$MYSQL_IMAGE" \
            --skip-log-bin --innodb-buffer-pool-size=128M --performance-schema=OFF \
            --ssl-ca=/tls/ca.crt --ssl-cert=/tls/server.crt --ssl-key=/tls/server.key
          ready=0
          for attempt in $(seq 1 60); do
            if docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" --entrypoint mysql \
              "$MYSQL_IMAGE" -h parity-mysql -uroot -pparity-disposable-password -e 'SELECT 1'; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" --entrypoint mysql \
            "$MYSQL_IMAGE" -h parity-mysql -uroot -pparity-disposable-password -N -e 'SELECT VERSION()' > parity-evidence/database-version.txt
          docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" --entrypoint mysql \
            "$MYSQL_IMAGE" -h parity-mysql -uroot -pparity-disposable-password \
            -e 'CREATE DATABASE native_ref CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          image=$(jq -r '.server.images["linux/amd64"] | sub("^durableworkflow/server@"; "ghcr.io/durable-workflow/server@")' tests/Fixtures/ServerParityBaselines/php-2.11.1.json)
          # The physical layout stays the frozen published 2.5.14 one; behavior
          # runs on the current reference after migrating that database forward.
