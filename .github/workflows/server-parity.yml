          path: parity-summary
          retention-days: 1
          if-no-files-found: error
      - name: Remove current workspace outputs before caching dependencies
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.part == 'native-tests' && steps.native_cargo.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          mkdir -p cargo-home rust-target
          docker run --rm --init --user="$(id -u):$(id -g)" --network=none --cpus=2 --memory=2g --memory-swap=2g \
            -e CARGO_HOME=/cargo -e CARGO_TARGET_DIR=/target \
            -v "$PWD:/source:ro" -v "$PWD/cargo-home:/cargo" -v "$PWD/rust-target:/target" -w /source/rust \
            "${NATIVE_RUST_IMAGE}" cargo clean --locked --offline --package durable-workflow-server
      - name: Save native Cargo dependencies from successful main native tests
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.part == 'native-tests' && steps.native_cargo.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            cargo-home/registry
            cargo-home/git
            rust-target
          key: native-cargo-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.NATIVE_RUST_IMAGE }}-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml', 'rust/vendor/**', 'rust/.cargo/**') }}


  # The one Shared Server fixtures result. It always runs, including after a
  # failure or cancellation, and passes only when every fixture job passed, or
  # when no fixture input changed and every fixture job was skipped for that
  # reason.
  result:
    name: Shared Server fixtures result
    needs:
      - changes
      - published-sdk-adapters
      - codec-native-build
      - native-debug-build
      - codec-deadline-health
      - mysql-execution
      - postgres-storage
      - execution-and-codec
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: |
            scripts/conformance/server-parity/aggregate.sh
            scripts/conformance/server-parity/aggregate.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Require every fixture job to pass, or every one to be skipped for unchanged inputs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: bash scripts/conformance/server-parity/aggregate.sh
