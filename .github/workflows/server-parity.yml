      - tests/Unit/ServerParityPublishedPatchTransportTest.mjs
      - tests/Unit/ServerParityLegacyMarkerContractTest.mjs
      - tests/Unit/ServerParityRangeRepairContractTest.mjs
      - tests/Unit/ServerParitySdkDirectionContractTest.mjs
      - tests/Unit/ServerParitySdkChildDirectionContractTest.mjs
      - tests/Unit/ServerParitySdkTimerAuthorContractTest.mjs
      - tests/Unit/ServerParitySdkSignalDirectionContractTest.mjs
      - tests/Support/ServerParityAdmissionObservation.mjs
      - tests/Support/ServerParityVisibilityObservation.mjs
      - rust/**
      - tests/Fixtures/ActivityResultInspection/**
      - tests/Fixtures/ServerParityReaders/**
      - tests/Conformance/ServerParity*.mjs
      - benchmarks/capacity/v1/bindings/php/**
      - benchmarks/server-port/v2/matched.json
  merge_group:
  workflow_dispatch:

# A newer push to the same pull request supersedes the run in progress, so a
# replaced head does not keep holding the organization's shared runners.
# Manual dispatches always finish.
concurrency:
  group: shared-server-fixtures-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Share the actual compiler pin with dependency cache keys. Fixture,
  # comparator and job-list edits must not invalidate native dependencies.
  NATIVE_RUST_IMAGE: mirror.gcr.io/library/rust@sha256:ba81bc3eaa4422af576c0262515d96b0111a628a6ccc2c86557cf55c9a4bbee0
  DW_PARITY_MEMO_FIXTURE_ID: memo-activity-replay
  DW_PARITY_MEMO_PYTHON: '1'
  DW_PARITY_MEMO_RUST: '1'
  DW_PARITY_CONTINUE_MEMO_UPSERTS: '1'

jobs:
  changes:
    name: Shared Server fixture inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Reading this workflow's own runs lets a push to main that the merge queue
    # already qualified skip repeating that qualification.
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.classify.outputs.run }}
      full: ${{ steps.classify.outputs.full }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Decide whether fixture inputs changed
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          RUNS_TOKEN: ${{ github.event_name == 'push' && github.token || '' }}
        run: bash scripts/conformance/server-parity/changes.sh >> "$GITHUB_OUTPUT"

  # Only the server executable is shared. Native test parts retain their
  # Cargo builds, full test commands and the trusted-main dependency writer.
  native-debug-build:
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' && needs.changes.outputs.full != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RESOURCE_SCOPE: dw-native-debug-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
      producer_attempt: ${{ steps.artifact.outputs.attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Pull the pinned compiler, retrying registry errors
        run: bash scripts/ci/pull-images.sh "${NATIVE_RUST_IMAGE}"
      - name: Validate native debug artifact and cleanup controls
        run: node --test tests/Unit/NativeDebugArtifactTest.mjs
      - name: Bind the artifact name to this producer attempt
        id: artifact
        run: |
          printf 'name=native-debug-build-%s-%s\nattempt=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Restore native Cargo dependencies from trusted main
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            cargo-home/registry
            cargo-home/git
            rust-target
          key: native-cargo-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.NATIVE_RUST_IMAGE }}-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml', 'rust/vendor/**', 'rust/.cargo/**') }}
      - name: Fetch locked Rust dependencies
        run: |
          set -euo pipefail
          mkdir -p cargo-home
          docker run --rm --init --user="$(id -u):$(id -g)" --cpus=2 --memory=2g --memory-swap=2g \
            -e CARGO_HOME=/cargo -e CARGO_NET_RETRY=10 \
            -v "$PWD:/source:ro" -v "$PWD/cargo-home:/cargo" -w /source/rust \
            "${NATIVE_RUST_IMAGE}" cargo fetch --locked
      - name: Build one run-bound native debug server
        run: bash scripts/ci/native-debug-build.sh native-debug-build
      - name: Verify the thin artifact before sharing
        run: node scripts/ci/native-debug-artifact.mjs verify native-debug-build
      - name: Share this attempt's server without compiler caches
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            native-debug-build/server
            native-debug-build/build.json
            native-debug-build/SHA256SUMS
          retention-days: 1
          if-no-files-found: error
      - name: Retire the owned debug build containers
        if: always()
        run: |
          docker rm -f "$RESOURCE_SCOPE-clean" "$RESOURCE_SCOPE-build" >/dev/null 2>&1 || true

  published-sdk-adapters:
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RESOURCE_SCOPE: dw-codec-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # A registry briefly answering "unknown blob" once failed every job at its
      # first container; pull this job's common images with bounded retries.
      - name: Pull the pinned images, retrying registry errors
        run: |
          set -euo pipefail
          baseline() {
            jq -r '.server.images["linux/amd64"] | sub("^durableworkflow/server@"; "ghcr.io/durable-workflow/server@")' \
              "tests/Fixtures/ServerParityBaselines/$1.json"
          }
          bash scripts/ci/pull-images.sh \
            mirror.gcr.io/library/rust@sha256:300ec56abce8cc9448ddea2172747d048ed902a3090e6b57babb2bf19f754081 \
            mirror.gcr.io/library/python@sha256:bf44cdfcb76cd3b41e879bc058fc37ec5872002ccfde7fcb765e218cde0cd79c \
            "$(baseline php-2.11.8)"
      # The adapters' pinned, --locked dependencies build the same way every
      # run. Restore their public Cargo registry data and build tree, keyed
      # by the toolchain image, the runner and every tracked adapter input.
      # Only successful pushes to main save them, so no pull request or merge
      # group writes what a later run reads. Every run still builds, stamps
      # and hashes its own adapters, and the final adapters are never cached.
      - name: Key the adapters' Cargo cache by every tracked adapter input
        id: adapter_key
        run: bash scripts/ci/sdk-adapter-cache-key.sh
      - name: Restore the adapters' Cargo registry and build tree
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        id: adapter_cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            sdk-cargo/registry
            sdk-cargo/git
            sdk-target
          key: ${{ steps.adapter_key.outputs.key }}
      - name: Build the locked published SDK adapter once
        run: bash scripts/conformance/server-parity/published-sdk-patch-adapters.sh
      - name: Build genuine legacy-marker adapters with the existing cache
        run: bash scripts/conformance/server-parity/legacy-marker-adapters.sh
      - name: Build fresh published SDK direction adapters with the existing cache
        run: bash scripts/conformance/server-parity/sdk-direction-adapters.sh
      - name: Build the separate corrected cohort with the existing SDK cache
        env:
          DW_PARITY_CORRECTED_ARTIFACTS: tests/Fixtures/ServerParityProfiles/corrected-markers/artifacts-workflow-2.5.16.json
          DW_PARITY_CORRECTED_CARGO: sdk-cargo
          DW_PARITY_CORRECTED_TARGET: sdk-target
        run: bash scripts/conformance/server-parity/corrected-marker-adapters.sh
      - name: Build the separate current query consumers once
        run: bash scripts/conformance/server-parity/query-authority-adapters.sh
      - name: Save the adapters' Cargo registry and build tree from main
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.adapter_cargo.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            sdk-cargo/registry
            sdk-cargo/git
            sdk-target
          key: ${{ steps.adapter_key.outputs.key }}
      - name: Share current query consumers without compiler caches
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: query-authority-adapters
          path: query-authority-adapters
          retention-days: 1
          if-no-files-found: error
      - name: Share the corrected cohort without compiler caches or target trees
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: corrected-marker-adapters
          path: corrected-marker-adapters
          retention-days: 1
          if-no-files-found: error
      - name: Share thin published SDK direction adapters
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdk-direction-adapters
          path: sdk-direction-adapters
          retention-days: 1
          if-no-files-found: error
      - name: Share genuine legacy-marker adapters without build trees or caches
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: legacy-marker-adapters
          path: legacy-marker-adapters
          retention-days: 1
          if-no-files-found: error
      - name: Share thin adapters without build trees or caches
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: published-sdk-patch-adapters
          path: published-sdk-adapters
          retention-days: 1
          if-no-files-found: error

      - name: Keep small failed SDK setup diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: failed-sdk-setup-diagnostics
          path: |
            published-sdk-adapters/*-build.txt
            published-sdk-adapters/*-install.txt
            legacy-marker-adapters/*-build.txt
            legacy-marker-adapters/*-install.txt
            sdk-direction-adapters/*-build.txt
            sdk-direction-adapters/*-install.txt
            corrected-marker-adapters/*-build.txt
            corrected-marker-adapters/*-install.txt
            codec-native-build/build.txt
            query-authority-adapters/*-build.txt
            query-authority-adapters/*-install.txt
          retention-days: 1
          if-no-files-found: ignore

  # The optimized native build only the deadline-health cells use. It runs
  # beside the SDK adapters, so the database jobs, which need only the
  # adapters, no longer wait for it.
  codec-native-build:
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' && needs.changes.outputs.full != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RESOURCE_SCOPE: dw-codec-native-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build one bounded optimized native artifact for deadline health
        run: bash scripts/conformance/server-parity/codec-operations-build.sh codec-native-build
      - name: Share the optimized binary without compiler caches
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codec-native-build
          path: |
            codec-native-build/server
            codec-native-build/build.json
            codec-native-build/SHA256SUMS
          retention-days: 1
          if-no-files-found: error
      - name: Retire the owned optimized build container
        if: always()
        run: |
          build_container="$RESOURCE_SCOPE-build"
          docker rm -f "$build_container" >/dev/null 2>&1 || true

  # The six deadline-health cells take about a minute each, beside database
  # parts that take half an hour, so one runner runs them in turn: a failed
  # cell still lets the others run, and the job fails after all of them.
  codec-deadline-health:
    needs: [published-sdk-adapters, codec-native-build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RESOURCE_SCOPE: dw-codec-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Fetch this run's optimized native binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: codec-native-build
          path: codec-native-build
          digest-mismatch: error
      - name: Fetch this run's normally installed corrected PHP SDK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: corrected-marker-adapters
          path: corrected-marker-adapters
          digest-mismatch: error
      - name: Check exact binary provenance and execute one fresh original per family
        run: |
          set -euo pipefail
          (cd codec-native-build; sha256sum -c SHA256SUMS)
          chmod +x codec-native-build/server
          bash scripts/conformance/server-parity/codec-deadline-cells.sh
      - name: Retire every cell's exact owned resources
        if: always()
        run: |
          for database in sqlite postgres-16 postgres-17 mysql-8.0 mysql-8.4 mariadb-10.11; do
            scope="$RESOURCE_SCOPE-$database"
            docker rm -f "$scope-native-codec-observer" "$scope-ready" "$scope-native" >/dev/null 2>&1 || true
            docker stop --time 10 "$scope-db" >/dev/null 2>&1 || true
            docker rm "$scope-db" >/dev/null 2>&1 || true
            docker network rm "$scope" >/dev/null 2>&1 || true
          done
      - name: Publish the bounded outcomes
        if: always()
        run: |
          for database in sqlite postgres-16 postgres-17 mysql-8.0 mysql-8.4 mariadb-10.11; do
            if test -f "codec-evidence/$database/database-audit.json"; then
              printf 'Database: %s\n\n' "$database" >> "$GITHUB_STEP_SUMMARY"
              cat "codec-evidence/$database/database-audit.json" >> "$GITHUB_STEP_SUMMARY"
            else
              printf 'Database: %s: the CPU/deadline original did not qualify. See this job diagnostics.\n\n' "$database" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Keep small outcomes and failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codec-deadline-health
          path: |
            codec-evidence/*.status
            codec-evidence/*/build.json
            codec-evidence/*/database*.json
            codec-evidence/*/database-version.txt
            codec-evidence/*/codec-*-contract.txt
            codec-evidence/*/codec-*-controls.txt
            codec-evidence/*/limits.json
            codec-evidence/*/*state.json
            codec-evidence/*/server-log.txt
            codec-evidence/*/server-ready-errors.txt
            codec-evidence/*/profile.txt
            codec-evidence/*/failed.json
          retention-days: 1
          if-no-files-found: warn

  mysql-execution:
    # Named explicitly so the added native-tests-b combinations read like the
    # others instead of listing every matrix value.
    name: mysql-execution (${{ matrix.label }}, ${{ matrix.part }})
    needs: [changes, published-sdk-adapters, native-debug-build]
    if: ${{ !cancelled() && needs.published-sdk-adapters.result == 'success' && needs.changes.outputs.full != 'false' }}
    runs-on: ubuntu-latest
    # Each part takes about 20 to 35 minutes; the fixture step runs every
    # later profile before failing, and scenario budgets stay fixed.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Each database runs in six parts on separate runners: the native
      # database suites and TLS checks, the shared corpus, its profiles and
      # restart cases, the published-SDK direction profiles, the corrected
      # marker cohort, and the other cohorts. The two MySQL 8 labels add a
      # seventh, native-tests-b, for half their execution tests. Every part
      # bootstraps the same database and native build; no part depends on
      # another.
      matrix:
        label: [mysql-8.0, existing-php-mysql-matrix, mariadb-10.11]
        part: [native-tests, corpus, restarts, cohorts, sdk-directions, corrected-markers]
        include:
          - label: mysql-8.0
            image: mirror.gcr.io/library/mysql@sha256:62fb722c78b24245ddff1796a0fcee4a49cc5b87e0aaaf20c92d1da9e0a2497b
            # The expanded original was OOM-killed at 1 GiB during native pressure.
            memory: 2g
            # The two MySQL 8 labels' native suites were the slowest parts
            # (about 21 min each, most of it the execution tests), so their
            # execution tests run in two halves: native-tests runs the first
            # and native-tests-b the second. The bytewise-sorted test list is
            # dealt round-robin, so each listed test runs in exactly one half
            # and a new test joins one.
            execution_shards: 2
          - label: mysql-8.0
            part: native-tests-b
            image: mirror.gcr.io/library/mysql@sha256:62fb722c78b24245ddff1796a0fcee4a49cc5b87e0aaaf20c92d1da9e0a2497b
            memory: 2g
            execution_shards: 2
          - label: existing-php-mysql-matrix
            image: mirror.gcr.io/library/mysql@sha256:679e7e924f38a3cbb62a3d7df32924b83f7321a602d3f9f967c01b3df18495d6
            # The expanded shared database was OOM-killed at 1 GiB before TLS checks.
            memory: 2g
            execution_shards: 2
          - label: existing-php-mysql-matrix
            part: native-tests-b
            image: mirror.gcr.io/library/mysql@sha256:679e7e924f38a3cbb62a3d7df32924b83f7321a602d3f9f967c01b3df18495d6
            memory: 2g
            execution_shards: 2
          - label: mariadb-10.11
            image: mirror.gcr.io/library/mariadb@sha256:7db29378d4fdab73f8123bbc2b48905c90d1a4b00cf848b028f1e81e623257f2
            # Both expanded originals exhausted the 512 MiB DB fixture ceiling.
            memory: 1g
    env:
      DW_PARITY_PART: ${{ matrix.part }}
      DW_EXECUTION_SHARDS: ${{ matrix.execution_shards || 1 }}
      RESOURCE_SCOPE: dw-mysql-parity-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.label }}
      MYSQL_IMAGE: ${{ matrix.image }}
      DB_MEMORY: ${{ matrix.memory }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # A registry briefly answering "unknown blob" once failed every job at its
      # first container; pull this job's common images with bounded retries.
      - name: Pull the pinned images, retrying registry errors
        run: |
          set -euo pipefail
          baseline() {
            jq -r '.server.images["linux/amd64"] | sub("^durableworkflow/server@"; "ghcr.io/durable-workflow/server@")' \
              "tests/Fixtures/ServerParityBaselines/$1.json"
          }
          bash scripts/ci/pull-images.sh \
            "${NATIVE_RUST_IMAGE}" \
            "$MYSQL_IMAGE" \
            "$(baseline php-2.11.8)" \
            "$(baseline php-2.5.14)" \
            composer:2.10.3@sha256:da624c2c705d54e2f5a9bb77a5dc6c7d091711433ebefd7035672e84c2010fee
      - name: Fetch this run's published SDK adapters
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: published-sdk-patch-adapters
          path: published-sdk-adapters
          digest-mismatch: error
      - name: Fetch this run's current query consumers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: query-authority-adapters
          path: query-authority-adapters
          digest-mismatch: error
      - name: Fetch this run's genuine legacy-marker adapters
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: legacy-marker-adapters
          path: legacy-marker-adapters
          digest-mismatch: error
      - name: Fetch this run's published SDK direction adapters
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sdk-direction-adapters
          path: sdk-direction-adapters
          digest-mismatch: error
      - name: Fetch this run's corrected cohort adapters
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: corrected-marker-adapters
          path: corrected-marker-adapters
          digest-mismatch: error
      - name: Create TLS fixture certificates
        run: |
          set -euo pipefail
          image=$(jq -r '.server.images["linux/amd64"] | sub("^durableworkflow/server@"; "ghcr.io/durable-workflow/server@")' tests/Fixtures/ServerParityBaselines/php-2.11.8.json)
          mkdir -p mysql-tls parity-evidence
          chmod 0777 parity-evidence
          docker run --rm --user="$(id -u):$(id -g)" --network=none \
            -v "$PWD/mysql-tls:/tls" --entrypoint openssl "$image" req -x509 -newkey rsa:2048 \
            -nodes -sha256 -days 1 -keyout /tls/ca.key -out /tls/ca.crt -subj /CN=development-ca \
            -addext basicConstraints=critical,CA:TRUE > parity-evidence/tls-certificate-generation.txt 2>&1
          docker run --rm --user="$(id -u):$(id -g)" --network=none \
            -v "$PWD/mysql-tls:/tls" --entrypoint openssl "$image" req -newkey rsa:2048 \
            -nodes -sha256 -keyout /tls/server.key -out /tls/server.csr -subj /CN=parity-mysql \
            -addext subjectAltName=DNS:parity-mysql -addext basicConstraints=critical,CA:FALSE \
            -addext extendedKeyUsage=serverAuth >> parity-evidence/tls-certificate-generation.txt 2>&1
          docker run --rm --user="$(id -u):$(id -g)" --network=none \
            -v "$PWD/mysql-tls:/tls" --entrypoint openssl "$image" x509 -req \
            -in /tls/server.csr -CA /tls/ca.crt -CAkey /tls/ca.key -CAcreateserial -days 1 \
            -copy_extensions copy -out /tls/server.crt >> parity-evidence/tls-certificate-generation.txt 2>&1
          chmod 0600 mysql-tls/server.key
          docker run --rm --user="$(id -u):$(id -g)" --network=none \
            -v "$PWD/mysql-tls:/tls" --entrypoint openssl "$image" req -x509 -newkey rsa:2048 \
            -nodes -sha256 -days 1 -keyout /tls/untrusted.key -out /tls/untrusted.crt -subj /CN=untrusted-development-ca \
            >> parity-evidence/tls-certificate-generation.txt 2>&1
      # Exact dependency keys include the actual compiler pin, Cargo configuration
      # and vendored crates. Server outputs are discarded before rebuilding.
      - name: Restore native Cargo dependencies from trusted main
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        id: native_cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            cargo-home/registry
            cargo-home/git
            rust-target
          key: native-cargo-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.NATIVE_RUST_IMAGE }}-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml', 'rust/vendor/**', 'rust/.cargo/**') }}
      - name: Fetch locked Rust dependencies
        # A registry or network failure belongs to this step, not to the
        # offline native builds and tests that follow.
        run: |
          set -euo pipefail
          mkdir -p cargo-home
          docker run --rm --user="$(id -u):$(id -g)" --cpus=2 --memory=2g --memory-swap=2g \
            -e CARGO_HOME=/cargo -e CARGO_NET_RETRY=10 \
            -v "$PWD:/source:ro" -v "$PWD/cargo-home:/cargo" -w /source/rust \
            "${NATIVE_RUST_IMAGE}" \
            cargo fetch --locked
      - name: Discard restored native workspace outputs before rebuilding
        run: |
          set -euo pipefail
          mkdir -p cargo-home rust-target
          docker run --rm --init --user="$(id -u):$(id -g)" --network=none --cpus=2 --memory=2g --memory-swap=2g \
            -e CARGO_HOME=/cargo -e CARGO_TARGET_DIR=/target \
            -v "$PWD:/source:ro" -v "$PWD/cargo-home:/cargo" -v "$PWD/rust-target:/target" -w /source/rust \
            "${NATIVE_RUST_IMAGE}" cargo clean --locked --offline --package durable-workflow-server
      - name: Require a successful native debug producer
        if: ${{ matrix.part != 'native-tests' && matrix.part != 'native-tests-b' }}
        env:
          NATIVE_BUILD_RESULT: ${{ needs.native-debug-build.result }}
          NATIVE_BUILD_ARTIFACT: ${{ needs.native-debug-build.outputs.artifact_name }}
          NATIVE_BUILD_RUN_ATTEMPT: ${{ needs.native-debug-build.outputs.producer_attempt }}
        run: |
          set -euo pipefail
          test "$NATIVE_BUILD_RESULT" = success
          [[ "$NATIVE_BUILD_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,9}$ ]]
          (( NATIVE_BUILD_RUN_ATTEMPT <= GITHUB_RUN_ATTEMPT ))
          test "$NATIVE_BUILD_ARTIFACT" = "native-debug-build-$GITHUB_RUN_ID-$NATIVE_BUILD_RUN_ATTEMPT"
      - name: Fetch this run's native debug server
        if: ${{ matrix.part != 'native-tests' && matrix.part != 'native-tests-b' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.native-debug-build.outputs.artifact_name }}
          path: native-debug-build
          digest-mismatch: error
      - name: Verify and install this run's native debug server
        if: ${{ matrix.part != 'native-tests' && matrix.part != 'native-tests-b' }}
        env:
          NATIVE_BUILD_RUN_ATTEMPT: ${{ needs.native-debug-build.outputs.producer_attempt }}
        run: |
          set -euo pipefail
          mkdir -p parity-evidence rust-target/debug
          node scripts/ci/native-debug-artifact.mjs verify native-debug-build > parity-evidence/native-debug-build.json
          install -m 0755 native-debug-build/server rust-target/debug/durable-workflow-server
      - name: Bootstrap published PHP and native MySQL databases and run the native tests
        run: |
          set -euo pipefail
          # Failed Rust tests are printed from their evidence files into this step's log.
          rust_test_failures() {
            bash scripts/conformance/server-parity/rust-test-failures.sh
          }
          trap rust_test_failures ERR
          mkdir -p cargo-home rust-target parity-evidence mysql-state
          chmod 0777 parity-evidence
          docker network create "$RESOURCE_SCOPE"
          docker run -d --name "$RESOURCE_SCOPE-db" --network "$RESOURCE_SCOPE" --network-alias=parity-mysql \
            --user="$(id -u):$(id -g)" --cpus=1 --memory="$DB_MEMORY" --memory-swap="$DB_MEMORY" \
            -e MYSQL_ROOT_PASSWORD=parity-disposable-password -e MYSQL_ROOT_HOST=% -e MYSQL_DATABASE=php_ref \
            -v "$PWD/mysql-state:/var/lib/mysql" -v "$PWD/mysql-tls:/tls:ro" "$MYSQL_IMAGE" \
            --skip-log-bin --innodb-buffer-pool-size=128M --performance-schema=OFF \
            --ssl-ca=/tls/ca.crt --ssl-cert=/tls/server.crt --ssl-key=/tls/server.key
          ready=0
          for attempt in $(seq 1 60); do
            if docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" --entrypoint mysql \
              "$MYSQL_IMAGE" -h parity-mysql -uroot -pparity-disposable-password -e 'SELECT 1'; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" --entrypoint mysql \
            "$MYSQL_IMAGE" -h parity-mysql -uroot -pparity-disposable-password -N -e 'SELECT VERSION()' > parity-evidence/database-version.txt
          docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" --entrypoint mysql \
            "$MYSQL_IMAGE" -h parity-mysql -uroot -pparity-disposable-password \
            -e 'CREATE DATABASE native_ref CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          image=$(jq -r '.server.images["linux/amd64"] | sub("^durableworkflow/server@"; "ghcr.io/durable-workflow/server@")' tests/Fixtures/ServerParityBaselines/php-2.11.8.json)
          # The physical layout stays the frozen published 2.5.14 one; behavior
          # runs on the current reference after migrating that database forward.
          layout=$(jq -r '.server.images["linux/amd64"] | sub("^durableworkflow/server@"; "ghcr.io/durable-workflow/server@")' tests/Fixtures/ServerParityBaselines/php-2.5.14.json)
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint php \
            -e DB_CONNECTION=mysql -e DB_HOST=parity-mysql -e DB_DATABASE=php_ref \
            -e DB_USERNAME=root -e DB_PASSWORD=parity-disposable-password \
            -e CACHE_STORE=file -e QUEUE_CONNECTION=database -e DW_AUTH_TOKEN=parity-test-token \
            "$layout" artisan server:bootstrap --force > parity-evidence/published-bootstrap.txt
          # Compiling the test targets with two jobs peaked at 6.8 GB cold (cgroup memory.peak, October 27); a 6 GB limit OOM-killed rustc (signal 9, PR #801).
          docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" --cpus=2 --memory=8g --memory-swap=8g \
            -e CARGO_HOME=/cargo -e CARGO_TARGET_DIR=/target -e CARGO_BUILD_JOBS=2 -e DW_PARITY_PART -e DW_EXECUTION_SHARDS \
            -e DW_TEST_MYSQL_URL=mysql://root:parity-disposable-password@parity-mysql:3306/php_ref \
            -e DW_EXECUTION_MYSQL_URL=mysql://root:parity-disposable-password@parity-mysql:3306/php_ref \
            -v "$PWD:/source:ro" -v "$PWD/cargo-home:/cargo" -v "$PWD/rust-target:/target" \
            -v "$PWD/parity-evidence:/evidence" -w /source/rust --entrypoint bash \
            "${NATIVE_RUST_IMAGE}" -c \
            'case "$DW_PARITY_PART" in native-tests) shard=1 suffix= ;; native-tests-b) shard=2 suffix=-b ;; *) shard= ;; esac; if [ "$DW_PARITY_PART" = native-tests ]; then cargo test --locked --offline --lib runtime::mysql:: -- --ignored --skip runtime::mysql::tests::bootstrap_child --nocapture --test-threads=2 > /evidence/mysql-tests.txt || exit 1; fi; if [ -n "$shard" ]; then cargo test --locked --offline --test execution -- --list --format terse | sed -n "s/: test\$//p" | LC_ALL=C sort | awk -v count="$DW_EXECUTION_SHARDS" -v shard="$shard" "(NR - 1) % count == shard - 1" > /evidence/execution-shard$suffix.txt && test -s /evidence/execution-shard$suffix.txt && cargo test --locked --offline --test execution -- --exact --nocapture --test-threads=2 $(cat /evidence/execution-shard$suffix.txt) > /evidence/mysql-execution-tests$suffix.txt || exit 1; fi; case "$DW_PARITY_PART" in native-tests|native-tests-b) cargo build --locked --offline ;; *) test -x /target/debug/durable-workflow-server ;; esac'
          docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" \
            -e DW_RUST_EXPERIMENTAL=1 -e DB_CONNECTION=mysql -e DB_HOST=parity-mysql -e DB_DATABASE=native_ref \
            -e DB_USERNAME=root -e DB_PASSWORD=parity-disposable-password \
            -v "$PWD/rust-target:/target:ro" --entrypoint /target/debug/durable-workflow-server \
            "${NATIVE_RUST_IMAGE}" \
            schema-bootstrap > parity-evidence/native-bootstrap.json
          docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" \
            -e DW_RUST_EXPERIMENTAL=1 -e DB_CONNECTION=mysql -e DB_HOST=parity-mysql -e DB_DATABASE=native_ref \
            -e DB_USERNAME=root -e DB_PASSWORD=parity-disposable-password \
            -v "$PWD/rust-target:/target:ro" --entrypoint /target/debug/durable-workflow-server \
            "${NATIVE_RUST_IMAGE}" \
            schema-check > parity-evidence/native-check.json
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint php \
            -e DB_HOST=parity-mysql -e DB_USERNAME=root -e DB_PASSWORD=parity-disposable-password \
            -v "$PWD:/source:ro" -w /source "$image" \
            scripts/conformance/server-parity/mysql-schema.php compare php_ref native_ref > parity-evidence/catalog-comparison.json
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint php \
            -e DB_CONNECTION=mysql -e DB_HOST=parity-mysql -e DB_DATABASE=php_ref \
            -e DB_USERNAME=root -e DB_PASSWORD=parity-disposable-password \
            -e CACHE_STORE=file -e QUEUE_CONNECTION=database -e DW_AUTH_TOKEN=parity-test-token \
            "$image" artisan server:bootstrap --force > parity-evidence/published-upgrade-bootstrap.txt
      - name: Start the published PHP and native nodes the corpus parts share
        if: ${{ matrix.part == 'corpus' || matrix.part == 'restarts' }}
        id: prepare_runtime_comparison
        run: |
          set -euo pipefail
          # Bounded container log tails make a failure in this step diagnosable from its own log.
          container_log_tails() {
            bash scripts/conformance/server-parity/container-log-tails.sh
          }
          trap container_log_tails ERR
          image=$(jq -r '.server.images["linux/amd64"] | sub("^durableworkflow/server@"; "ghcr.io/durable-workflow/server@")' tests/Fixtures/ServerParityBaselines/php-2.11.8.json)
          # Composer runs confined in the pinned image, never in the published image under test.
          bash scripts/ci/run-composer.sh --rm -v "$PWD:/source" -w /source -- \
            install --working-dir=scripts/conformance/server-parity --no-interaction --no-progress
          docker run -d --name "$RESOURCE_SCOPE-php" --network "$RESOURCE_SCOPE" --network-alias=parity-php \
            --user=1000:1000 --cpus=1 --memory=512m --memory-swap=512m --tmpfs /state \
            -e DB_CONNECTION=mysql -e DB_HOST=parity-mysql -e DB_DATABASE=php_ref \
            -e DB_USERNAME=root -e DB_PASSWORD=parity-disposable-password \
            -e CACHE_STORE=file -e QUEUE_CONNECTION=database -e DW_AUTH_TOKEN=parity-test-token "$image"
          ready=0
          for attempt in $(seq 1 30); do
            if docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint curl "$image" \
              -fsS --connect-timeout 2 --max-time 5 http://parity-php:8080/api/ready > parity-evidence/php-readiness.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          docker run --rm --user="$(id -u):$(id -g)" --network "$RESOURCE_SCOPE" --entrypoint mysql \
            "$MYSQL_IMAGE" -h parity-mysql -uroot -pparity-disposable-password \
            -e 'CREATE DATABASE embedded_ref CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          docker run -d --name "$RESOURCE_SCOPE-php-maintenance" --network "$RESOURCE_SCOPE" \
            --user=1000:1000 --cpus=0.25 --memory=256m --memory-swap=256m --entrypoint sh \
            -e DB_CONNECTION=mysql -e DB_HOST=parity-mysql -e DB_DATABASE=php_ref \
            -e DB_USERNAME=root -e DB_PASSWORD=parity-disposable-password \
            -e CACHE_STORE=file -e QUEUE_CONNECTION=database -e DW_AUTH_TOKEN=parity-test-token \
            "$image" -c 'while :; do php artisan workflow:v2:repair-pass --json; php artisan schedule:evaluate --limit=100 --json; sleep 1; done'
          docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint php \
            -e DB_CONNECTION=mysql -e DB_HOST=parity-mysql -e DB_DATABASE=embedded_ref \
            -e DB_USERNAME=root -e DB_PASSWORD=parity-disposable-password \
            -e CACHE_STORE=file -e QUEUE_CONNECTION=database -e DW_AUTH_TOKEN=parity-test-token \
            "$image" artisan server:bootstrap --force > parity-evidence/embedded-bootstrap.txt
          docker run -d --name "$RESOURCE_SCOPE-native-a" --network "$RESOURCE_SCOPE" --network-alias=parity-native-a \
            --user="$(id -u):$(id -g)" --cpus=1 --memory=256m --memory-swap=256m \
            -e DW_RUST_EXPERIMENTAL=1 -e DW_AUTH_TOKEN=parity-test-token -e DW_BIND_ADDRESS=0.0.0.0:8080 \
            -e DB_CONNECTION=mysql -e DB_HOST=parity-mysql -e DB_DATABASE=native_ref \
            -e DB_USERNAME=root -e DB_PASSWORD=parity-disposable-password \
            -v "$PWD/rust-target:/target:ro" --tmpfs /state --entrypoint /target/debug/durable-workflow-server \
            "${NATIVE_RUST_IMAGE}"
          docker run -d --name "$RESOURCE_SCOPE-native-b" --network "$RESOURCE_SCOPE" --network-alias=parity-native-b \
            --user="$(id -u):$(id -g)" --cpus=1 --memory=256m --memory-swap=256m \
            -e DW_RUST_EXPERIMENTAL=1 -e DW_AUTH_TOKEN=parity-test-token -e DW_BIND_ADDRESS=0.0.0.0:8080 \
            -e DB_CONNECTION=mysql -e DB_HOST=parity-mysql -e DB_DATABASE=native_ref \
            -e DB_USERNAME=root -e DB_PASSWORD=parity-disposable-password \
            -v "$PWD/rust-target:/target:ro" --tmpfs /state --entrypoint /target/debug/durable-workflow-server \
            "${NATIVE_RUST_IMAGE}"
          ready=0
          for attempt in $(seq 1 30); do
            if docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint curl "$image" \
              -fsS --connect-timeout 2 --max-time 5 http://parity-native-a:8080/api/ready > parity-evidence/native-a-readiness.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          # native-b starts with native-a but may still be binding its port.
          ready=0
          for attempt in $(seq 1 30); do
            if docker run --rm --user=1000:1000 --network "$RESOURCE_SCOPE" --entrypoint curl "$image" \
              -fsS --connect-timeout 2 --max-time 5 http://parity-native-b:8080/api/ready > parity-evidence/native-b-readiness.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
      - name: Compare three runtimes over the shared fixture corpus
        if: ${{ matrix.part == 'corpus' }}
        run: |
          set -euo pipefail
          # Bounded container log tails make a failure in this step diagnosable from its own log.
          container_log_tails() {
            bash scripts/conformance/server-parity/container-log-tails.sh
          }
          trap container_log_tails ERR
          image=$(jq -r '.server.images["linux/amd64"] | sub("^durableworkflow/server@"; "ghcr.io/durable-workflow/server@")' tests/Fixtures/ServerParityBaselines/php-2.11.8.json)
          export DW_PARITY_RUNNER_REVISION=$(git rev-parse HEAD)
          mkdir -p parity-consumers
          curl --fail --location --retry 3 --output parity-consumers/dw.phar https://github.com/durable-workflow/cli/releases/download/2.2.0/dw.phar
          printf '%s  %s\n' "$(jq -r '.visibility.cli.phar_sha256' tests/Fixtures/ServerParity/visibility-current-runs.json)" parity-consumers/dw.phar | sha256sum -c > parity-evidence/cli-artifact.txt
          export DW_PARITY_CLI_PHAR=/source/parity-consumers/dw.phar
          docker run --rm --user=1000:1000 --entrypoint node --network "$RESOURCE_SCOPE" \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence" -w /source \
            -e DW_PARITY_TOKEN=parity-test-token -e DW_PARITY_RUNNER_REVISION -e DW_PARITY_CLI_PHAR -e MYSQL_IMAGE "$image" scripts/conformance/server-parity.mjs record \
            --mode http --url http://parity-php:8080 --target php --output /evidence/php.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-insertion-activity-pending.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-insertion-activity-completed.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-created-activity-pending.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-created-activity-completed.json \
            --include-fixture tests/Fixtures/ServerParityPending/workflow-waiting-history-type.json \
            --include-fixture tests/Fixtures/ServerParityPending/workflow-waiting-history-message.json \
            --include-fixture tests/Fixtures/ServerParityPending/workflow-task-transient-retry.json
          docker run --rm --user=1000:1000 --entrypoint node --network "$RESOURCE_SCOPE" \
            -v "$PWD:/source:ro" -v "$PWD/parity-evidence:/evidence" -w /source \
            -e DB_CONNECTION=mysql -e DB_HOST=parity-mysql -e DB_DATABASE=embedded_ref \
            -e DB_USERNAME=root -e DB_PASSWORD=parity-disposable-password -e DW_MODE=embedded \
            -e CACHE_STORE=file -e QUEUE_CONNECTION=database -e DW_PARITY_RUNNER_REVISION "$image" scripts/conformance/server-parity.mjs record \
            --mode embedded --application-root /app --target embedded --output /evidence/embedded.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-insertion-activity-pending.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-insertion-activity-completed.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-created-activity-pending.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-created-activity-completed.json \
            --include-fixture tests/Fixtures/ServerParityPending/workflow-waiting-history-type.json \
            --include-fixture tests/Fixtures/ServerParityPending/workflow-waiting-history-message.json \
            --include-fixture tests/Fixtures/ServerParityPending/workflow-task-transient-retry.json
          native_record_status=0
          docker run --rm --user=1000:1000 --entrypoint node --network "$RESOURCE_SCOPE" \
