            --include-fixture tests/Fixtures/ServerParityPending/patch-created-activity-pending.json \
            --include-fixture tests/Fixtures/ServerParityPending/patch-created-activity-completed.json \
            --include-fixture tests/Fixtures/ServerParityPending/workflow-waiting-history-type.json \
