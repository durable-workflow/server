name: Published workflow lifecycle

on:
  workflow_dispatch:
    inputs:
      server_version:
        description: Exact published Server version
        required: true
        type: string
      server_image:
        description: Exact published Server image digest
        required: true
        type: string
      workflow_php_version:
        description: Exact published Workflow package version
        required: true
        type: string
      php_sdk_version:
        description: Exact published PHP SDK version
        required: true
        type: string
      python_sdk_version:
        description: Exact published Python SDK version
        required: true
        type: string
      rust_sdk_version:
        description: Exact published Rust SDK version
        required: true
        type: string
      cli_version:
        description: Exact published CLI version
        required: true
        type: string
      waterline_version:
        description: Exact published Waterline version
        required: true
        type: string

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DW_SERVER_VERSION: ${{ inputs.server_version }}
      DW_SERVER_IMAGE: ${{ inputs.server_image }}
      DW_WORKFLOW_PHP_VERSION: ${{ inputs.workflow_php_version }}
      DW_PHP_SDK_VERSION: ${{ inputs.php_sdk_version }}
      DW_PYTHON_SDK_VERSION: ${{ inputs.python_sdk_version }}
      DW_RUST_SDK_VERSION: ${{ inputs.rust_sdk_version }}
      DW_CLI_VERSION: ${{ inputs.cli_version }}
      DW_WATERLINE_VERSION: ${{ inputs.waterline_version }}
      DW_JOB_RESOURCE_PREFIX: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      DW_WORKFLOW_LIFECYCLE_MYSQL_IMAGE: mysql@sha256:679e7e924f38a3cbb62a3d7df32924b83f7321a602d3f9f967c01b3df18495d6
      DW_WORKFLOW_LIFECYCLE_REDIS_IMAGE: redis@sha256:0637954999d01b7c9ce9167db2da50656e2590d3b884f1c600c5f63bb6e6773c
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate immutable artifact pins
        id: validate
        run: |
          set -euo pipefail
          [[ "$DW_SERVER_IMAGE" =~ ^(docker.io/)?durableworkflow/server@sha256:[0-9a-f]{64}$ ]]
          for variable in \
            DW_SERVER_VERSION DW_WORKFLOW_PHP_VERSION DW_PHP_SDK_VERSION \
            DW_PYTHON_SDK_VERSION DW_RUST_SDK_VERSION DW_CLI_VERSION DW_WATERLINE_VERSION; do
            [[ "${!variable}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          done

      - name: Run exact published-artifact lifecycle matrix
        if: ${{ always() && steps.validate.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/published-workflow-lifecycle"
          bash scripts/conformance/workflow-lifecycle-host-published-artifacts.sh \
            --result-dir "$RUNNER_TEMP/published-workflow-lifecycle"

      - name: Remove job-owned lifecycle containers and network
        if: always()
        run: |
          docker rm -f "dw-lifecycle-mysql-${DW_JOB_RESOURCE_PREFIX}" >/dev/null 2>&1 || true
          docker rm -f "dw-lifecycle-redis-${DW_JOB_RESOURCE_PREFIX}" >/dev/null 2>&1 || true
          docker rm -f "dw-lifecycle-server-${DW_JOB_RESOURCE_PREFIX}" >/dev/null 2>&1 || true
          docker rm -f "dw-lifecycle-scheduler-${DW_JOB_RESOURCE_PREFIX}" >/dev/null 2>&1 || true
          docker rm -f "dw-lifecycle-extract-${DW_JOB_RESOURCE_PREFIX}" >/dev/null 2>&1 || true
          docker network rm "dw-lifecycle-${DW_JOB_RESOURCE_PREFIX}" >/dev/null 2>&1 || true

      - name: Make lifecycle evidence readable
        if: ${{ always() && steps.validate.outcome == 'success' }}
        run: |
          result_dir="$RUNNER_TEMP/published-workflow-lifecycle"
          if [[ -d "$result_dir" ]]; then
            docker run --rm --name "dw-lifecycle-evidence-${DW_JOB_RESOURCE_PREFIX}" \
              --volume "$result_dir:/result" --entrypoint find "$DW_SERVER_IMAGE" \
              /result -maxdepth 1 -type f -exec chmod a+r {} +
          fi

      - name: Retain lifecycle results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: published-workflow-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/published-workflow-lifecycle/*.json
            ${{ runner.temp }}/published-workflow-lifecycle/*.jsonl
            ${{ runner.temp }}/published-workflow-lifecycle/*.log
            ${{ runner.temp }}/published-workflow-lifecycle/*.txt
            ${{ runner.temp }}/published-workflow-lifecycle/*.csv
            ${{ runner.temp }}/published-workflow-lifecycle/*.tsv
            ${{ runner.temp }}/published-workflow-lifecycle/*.sqlite
          if-no-files-found: error
          retention-days: 30

      - name: Remove job-owned evidence container
        if: always()
        run: docker rm -f "dw-lifecycle-evidence-${DW_JOB_RESOURCE_PREFIX}" >/dev/null 2>&1 || true
