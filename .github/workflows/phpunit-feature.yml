name: PHPUnit Feature

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feature:
    name: PHPUnit feature suite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout server
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout workflow package from GitHub
        if: github.server_url == 'https://github.com'
        uses: actions/checkout@v6
        with:
          repository: durable-workflow/workflow
          ref: 2.0.0-alpha.279
          path: workflow-package
          persist-credentials: false

      - name: Checkout workflow package from current Actions server
        if: github.server_url != 'https://github.com'
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/workflow
          ref: 2.0.0-alpha.279
          path: workflow-package
          token: ${{ secrets.CROSS_REPO_READ_TOKEN }}
          github-server-url: ${{ github.server_url }}
          persist-credentials: false

      - name: Verify workflow package source provenance
        shell: bash
        env:
          WORKFLOW_PACKAGE_REF: 2.0.0-alpha.279
          WORKFLOW_PACKAGE_COMMIT: f9a00e18fa21196bcb3505710489025ff93cf5e1
        run: |
          set -euo pipefail
          resolved_commit="$(git -C workflow-package rev-parse HEAD)"
          if [[ "$resolved_commit" != "$WORKFLOW_PACKAGE_COMMIT" ]]; then
            echo "Resolved Workflow commit $resolved_commit does not match $WORKFLOW_PACKAGE_COMMIT" >&2
            exit 1
          fi
          printf '%s\n' \
            'https://github.com/durable-workflow/workflow.git' \
            "$WORKFLOW_PACKAGE_REF" \
            "$resolved_commit" \
            > workflow-package/.package-provenance
          rm -rf workflow-package/.git

      - name: Run feature suite
        shell: bash
        run: |
          set -euo pipefail
          docker build --target base -t durable-workflow-server-phpunit-base .
          tar \
            --exclude=.git \
            --exclude='*/.git' \
            --exclude=vendor \
            --exclude='*/vendor' \
            --exclude=build \
            --exclude='*/build' \
            -cf - . \
            | docker run --rm -i -w /app --entrypoint sh durable-workflow-server-phpunit-base \
                -lc 'tar -xf - -C /app && cp -a /app/workflow-package /workflow && composer install --no-interaction --no-progress --prefer-dist && vendor/bin/phpunit tests/Feature --no-progress --colors=never'
