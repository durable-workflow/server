name: Version Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-validation:
    name: Test CLI and SDK version validation
    runs-on: ubuntu-latest
    env:
      SERVER_VERSION: 2.0.0-rc.38
      PYTHON_SDK_VERSION: 2.0.0rc1
      COMPOSE_PROJECT_NAME: version-validation-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

    steps:
      - name: Checkout server
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4

      - name: Generate APP_KEY
        id: app-key
        run: |
          # Generate a 32-character base64 key for Laravel
          KEY=$(openssl rand -base64 32)
          echo "key=base64:$KEY" >> $GITHUB_OUTPUT

      - name: Create collision-free Compose override
        run: |
          cat > docker-compose.override.yml << 'EOF'
          services:
            server:
              ports: !override
                - "0:8080"
            mysql:
              ports: !override []
            redis:
              ports: !override []
          EOF

      # Test 1: rc.2 server with compatible rc.1 clients - CLI success
      - name: Start rc.2 server
        env:
          APP_KEY: ${{ steps.app-key.outputs.key }}
          DW_AUTH_TOKEN: test-token-123
          APP_VERSION: ${{ env.SERVER_VERSION }}
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" up -d --wait
          published_port="$(docker compose -p "$COMPOSE_PROJECT_NAME" port server 8080 | awk -F: 'END {print $NF}')"
          test -n "$published_port"
          SERVER_BASE_URL="http://127.0.0.1:${published_port}"
          echo "SERVER_BASE_URL=$SERVER_BASE_URL" >> "$GITHUB_ENV"
          sleep 5

          # Verify server is healthy
          curl -f "$SERVER_BASE_URL/api/health" || exit 1

          # Verify the version endpoint returns the pinned server identity.
          VERSION=$(curl -fsS -H "Authorization: Bearer ${DW_AUTH_TOKEN}" "$SERVER_BASE_URL/api/cluster/info" | jq -r '.version')
          echo "Server version: $VERSION"
          if [ "$VERSION" != "${SERVER_VERSION}" ]; then
            echo "ERROR: Expected version ${SERVER_VERSION}, got $VERSION"
            exit 1
          fi

      - name: Install CLI
        run: |
          install_dir="/tmp/dw-bin"
          installer_url="$(node scripts/ci/sync-cli-readme-release.mjs --print installer-url)"
          curl -fsSL "$installer_url" -o /tmp/dw-install.sh
          DURABLE_WORKFLOW_INSTALL_DIR="$install_dir" sh /tmp/dw-install.sh
          reported_version="$("$install_dir/dw" --version)"
          cli_version="${reported_version#dw }"
          cli_version="${cli_version%% *}"
          if [[ ! "$cli_version" =~ ^2\.0\.0-rc\.(0|[1-9][0-9]*)$ ]]; then
            echo "ERROR: Supported CLI channel installed an invalid release: $reported_version"
            exit 1
          fi
          echo "$install_dir" >> $GITHUB_PATH

      - name: Test CLI with compatible server (should succeed)
        env:
          DURABLE_WORKFLOW_AUTH_TOKEN: test-token-123
          DURABLE_WORKFLOW_NAMESPACE: default
        run: |
          # CLI should connect successfully to the rc.2 server.
          DURABLE_WORKFLOW_SERVER_URL="$SERVER_BASE_URL" dw server:info || exit 1
          echo "✅ CLI successfully connected to compatible server"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.10'

      - name: Install Python SDK
        run: |
          pip install "durable-workflow==${PYTHON_SDK_VERSION}"
          python - <<'PY'
          import os
          from importlib.metadata import version

          expected = os.environ["PYTHON_SDK_VERSION"]
          installed = version("durable-workflow")
          if installed != expected:
              raise SystemExit(f"Expected durable-workflow {expected}, got {installed}")
          PY

      - name: Test Python SDK with compatible server (should succeed)
        run: |
          cat > /tmp/test_worker.py << 'EOF'
          import asyncio
          import os
          from durable_workflow import Client, Worker, workflow, activity

          @activity.defn(name="test_activity")
          def test_activity() -> str:
              return "ok"

          @workflow.defn(name="test_workflow")
          class TestWorkflow:
              def run(self, ctx):
                  return "ok"

          async def main():
              client = Client(os.environ["SERVER_BASE_URL"], token="test-token-123", namespace="default")

              # This should succeed because the rc.2 server supports the rc.1 SDK.
              worker = Worker(
                  client,
                  task_queue="test-queue",
                  workflows=[TestWorkflow],
                  activities=[test_activity],
                  worker_id="test-worker-compat",
              )

              # Worker registration validates version in _register()
              # We'll just call _register() directly to test validation
              try:
                  await worker._register()
                  print("✅ Python SDK successfully connected to compatible server")
              finally:
                  await client.aclose()

          asyncio.run(main())
          EOF
          python /tmp/test_worker.py

      - name: Stop server
        if: always()
        run: docker compose -p "$COMPOSE_PROJECT_NAME" down -v --remove-orphans >/dev/null 2>&1 || true

      # Test 2: Top-level APP_VERSION is build identity only. Protocol
      # manifests remain authoritative for client compatibility.
      - name: Create docker-compose override for version 3.0.0
        run: |
          cat > docker-compose.override.yml << 'EOF'
          services:
            bootstrap:
              environment:
                APP_VERSION: "3.0.0"
            server:
              ports: !override
                - "0:8080"
              environment:
                APP_VERSION: "3.0.0"
            worker:
              environment:
                APP_VERSION: "3.0.0"
            scheduler:
              environment:
                APP_VERSION: "3.0.0"
            mysql:
              ports: !override []
            redis:
              ports: !override []
          EOF

      - name: Start server (version 3.0.0)
        env:
          APP_KEY: ${{ steps.app-key.outputs.key }}
          DW_AUTH_TOKEN: test-token-123
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" up -d --wait
          published_port="$(docker compose -p "$COMPOSE_PROJECT_NAME" port server 8080 | awk -F: 'END {print $NF}')"
          test -n "$published_port"
          SERVER_BASE_URL="http://127.0.0.1:${published_port}"
          echo "SERVER_BASE_URL=$SERVER_BASE_URL" >> "$GITHUB_ENV"
          sleep 5

          # Verify server reports version 3.0.0
          VERSION=$(curl -fsS -H "Authorization: Bearer ${DW_AUTH_TOKEN}" "$SERVER_BASE_URL/api/cluster/info" | jq -r '.version')
          echo "Server version: $VERSION"
          if [ "$VERSION" != "3.0.0" ]; then
            echo "ERROR: Expected version 3.0.0, got $VERSION"
            exit 1
          fi

      - name: Test CLI with informational top-level version (should succeed)
        env:
          DURABLE_WORKFLOW_AUTH_TOKEN: test-token-123
          DURABLE_WORKFLOW_NAMESPACE: default
        run: |
          DURABLE_WORKFLOW_SERVER_URL="$SERVER_BASE_URL" dw server:info || exit 1
          echo "✅ CLI accepted compatible protocol manifests despite APP_VERSION=3.0.0"

      - name: Test Python SDK with informational top-level version (should succeed)
        run: |
          cat > /tmp/test_worker_app_version.py << 'EOF'
          import asyncio
          import os
          from durable_workflow import Client, Worker, workflow, activity

          @activity.defn(name="test_activity")
          def test_activity() -> str:
              return "ok"

          @workflow.defn(name="test_workflow")
          class TestWorkflow:
              def run(self, ctx):
                  return "ok"

          async def main():
              client = Client(os.environ["SERVER_BASE_URL"], token="test-token-123", namespace="default")

              worker = Worker(
                  client,
                  task_queue="test-queue",
                  workflows=[TestWorkflow],
                  activities=[test_activity],
                  worker_id="test-worker-incompat",
              )

              try:
                  await worker._register()
                  print("✅ Python SDK accepted compatible protocol manifests despite APP_VERSION=3.0.0")
              finally:
                  await client.aclose()

          asyncio.run(main())
          EOF
          python /tmp/test_worker_app_version.py

      - name: Stop server
        if: always()
        run: docker compose -p "$COMPOSE_PROJECT_NAME" down -v --remove-orphans >/dev/null 2>&1 || true

      # Test 3: Incompatible worker protocol manifest. The CLI only uses the
      # control plane and should still succeed; the Python worker validates the
      # worker protocol and must fail closed.
      - name: Create docker-compose override with incompatible worker protocol
        run: |
          cat > docker-compose.override.yml << 'EOF'
          services:
            bootstrap:
              environment:
                DW_WORKER_PROTOCOL_VERSION: "2.0"
            server:
              ports: !override
                - "0:8080"
              environment:
                DW_WORKER_PROTOCOL_VERSION: "2.0"
            worker:
              environment:
                DW_WORKER_PROTOCOL_VERSION: "2.0"
            scheduler:
              environment:
                DW_WORKER_PROTOCOL_VERSION: "2.0"
            mysql:
              ports: !override []
            redis:
              ports: !override []
          EOF

      - name: Start server (worker protocol 2.0)
        env:
          APP_KEY: ${{ steps.app-key.outputs.key }}
          DW_AUTH_TOKEN: test-token-123
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" up -d --wait
          published_port="$(docker compose -p "$COMPOSE_PROJECT_NAME" port server 8080 | awk -F: 'END {print $NF}')"
          test -n "$published_port"
          SERVER_BASE_URL="http://127.0.0.1:${published_port}"
          echo "SERVER_BASE_URL=$SERVER_BASE_URL" >> "$GITHUB_ENV"
          sleep 5

          VERSION=$(curl -fsS -H "Authorization: Bearer ${DW_AUTH_TOKEN}" "$SERVER_BASE_URL/api/cluster/info" | jq -r '.worker_protocol.version')
          echo "Worker protocol version: $VERSION"
          if [ "$VERSION" != "2.0" ]; then
            echo "ERROR: Expected worker protocol 2.0, got $VERSION"
            exit 1
          fi

      - name: Test CLI with incompatible worker protocol (should succeed)
        env:
          DURABLE_WORKFLOW_AUTH_TOKEN: test-token-123
          DURABLE_WORKFLOW_NAMESPACE: default
        run: |
          DURABLE_WORKFLOW_SERVER_URL="$SERVER_BASE_URL" dw server:info || exit 1
          echo "✅ CLI ignored worker-protocol-only incompatibility"

      - name: Test Python SDK with incompatible worker protocol (should fail with clear error)
        run: |
          cat > /tmp/test_worker_incompatible.py << 'EOF'
          import asyncio
          import os
          from durable_workflow import Client, Worker, workflow, activity

          @activity.defn(name="test_activity")
          def test_activity() -> str:
              return "ok"

          @workflow.defn(name="test_workflow")
          class TestWorkflow:
              def run(self, ctx):
                  return "ok"

          async def main():
              client = Client(os.environ["SERVER_BASE_URL"], token="test-token-123", namespace="default")

              worker = Worker(
                  client,
                  task_queue="test-queue",
                  workflows=[TestWorkflow],
                  activities=[test_activity],
                  worker_id="test-worker-incompat",
              )

              try:
                  await worker._register()
                  print("❌ ERROR: Worker registration should have failed with incompatible worker protocol")
                  await client.aclose()
                  exit(1)
              except RuntimeError as e:
                  error_msg = str(e)
                  print(f"Worker registration error: {error_msg}")

                  if (
                      "incompatible worker_protocol.version" in error_msg
                      and "sdk-python requires major-equal" in error_msg
                      and "minor>='1.1'" in error_msg
                  ):
                      print("✅ Python SDK failed with correct worker protocol error message")
                  else:
                      print("❌ ERROR: Python SDK error message doesn't match expected format")
                      print("Expected beta.14 SDK worker-protocol incompatibility details")
                      print(f"Got: {error_msg}")
                      await client.aclose()
                      exit(1)
              finally:
                  await client.aclose()

          asyncio.run(main())
          EOF
          python /tmp/test_worker_incompatible.py

      - name: Stop server
        if: always()
        run: docker compose -p "$COMPOSE_PROJECT_NAME" down -v --remove-orphans >/dev/null 2>&1 || true

      # Test 4: Unknown top-level version remains informational.
      - name: Create docker-compose override with no version
        run: |
          cat > docker-compose.override.yml << 'EOF'
          services:
            bootstrap:
              environment:
                APP_VERSION: "unknown"
            server:
              ports: !override
                - "0:8080"
              environment:
                APP_VERSION: "unknown"
            worker:
              environment:
                APP_VERSION: "unknown"
            scheduler:
              environment:
                APP_VERSION: "unknown"
            mysql:
              ports: !override []
            redis:
              ports: !override []
          EOF

      - name: Start server (version unknown)
        env:
          APP_KEY: ${{ steps.app-key.outputs.key }}
          DW_AUTH_TOKEN: test-token-123
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" up -d --wait
          published_port="$(docker compose -p "$COMPOSE_PROJECT_NAME" port server 8080 | awk -F: 'END {print $NF}')"
          test -n "$published_port"
          SERVER_BASE_URL="http://127.0.0.1:${published_port}"
          echo "SERVER_BASE_URL=$SERVER_BASE_URL" >> "$GITHUB_ENV"
          sleep 5

      - name: Test CLI with unknown top-level version (should succeed)
        env:
          DURABLE_WORKFLOW_AUTH_TOKEN: test-token-123
          DURABLE_WORKFLOW_NAMESPACE: default
        run: |
          DURABLE_WORKFLOW_SERVER_URL="$SERVER_BASE_URL" dw server:info || exit 1
          echo "✅ CLI accepted compatible protocol manifests despite APP_VERSION=unknown"

      - name: Test Python SDK with unknown top-level version (should succeed)
        run: |
          cat > /tmp/test_worker_unknown.py << 'EOF'
          import asyncio
          import os
          from durable_workflow import Client, Worker, workflow, activity

          @activity.defn(name="test_activity")
          def test_activity() -> str:
              return "ok"

          @workflow.defn(name="test_workflow")
          class TestWorkflow:
              def run(self, ctx):
                  return "ok"

          async def main():
              client = Client(os.environ["SERVER_BASE_URL"], token="test-token-123", namespace="default")

              worker = Worker(
                  client,
                  task_queue="test-queue",
                  workflows=[TestWorkflow],
                  activities=[test_activity],
                  worker_id="test-worker-unknown",
              )

              # Should succeed because protocol manifests are valid.
              try:
                  await worker._register()
                  print("✅ Python SDK accepted compatible protocol manifests despite APP_VERSION=unknown")
              finally:
                  await client.aclose()

          asyncio.run(main())
          EOF
          python /tmp/test_worker_unknown.py

      - name: Stop server
        if: always()
        run: docker compose -p "$COMPOSE_PROJECT_NAME" down -v --remove-orphans >/dev/null 2>&1 || true
