name: Server Perf

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/server-perf.yml"
      - "Dockerfile"
      - "bootstrap/app.php"
      - "docker-compose.yml"
      - "app/Support/ActivityRuntimeResultGate.php"
      - "app/Support/HistoryRetentionEnforcer.php"
      - "app/Support/BoundedMetricPolicy.php"
      - "app/Support/BoundedRedisReadinessProbe.php"
      - "app/Support/LongPollSignalStore.php"
      - "app/Support/LongPoller.php"
      - "app/Support/LongPollCapacityExhaustedException.php"
      - "app/Support/LongPollWaitSlotStore.php"
      - "app/Support/WorkerPollBackpressure.php"
      - "app/Support/ProjectionDriftMetrics.php"
      - "app/Support/ServerReadiness.php"
      - "app/Support/RemoteScheduleStarter.php"
      - "app/Support/ServerPollingCache.php"
      - "app/Support/TaskQueueAdmission.php"
      - "app/Support/WorkerPollClaimGate.php"
      - "app/Support/WorkflowQueryTaskBroker.php"
      - "app/Support/WorkflowTaskFailureMetrics.php"
      - "app/Support/WorkflowTaskPoller.php"
      - "app/Support/WorkerCompatibilityHeartbeatRecorder.php"
      - "app/Support/ActivityTaskPollRequestStore.php"
      - "app/Support/QueryTaskPollRequestStore.php"
      - "app/Support/WorkflowTaskPollRequestStore.php"
      - "app/Http/Controllers/Api/SystemController.php"
      - "app/Http/Controllers/Api/ActivityTaskController.php"
      - "app/Http/Controllers/Api/WorkerController.php"
      - "app/Http/Middleware/RequireWorkflowBootstrapReady.php"
      - "app/Services/PrometheusMetricsSummary.php"
      - "config/dw-bounded-growth.php"
      - "config/server.php"
      - "docs/bounded-growth.md"
      - "routes/api.php"
      - "scripts/perf/**"
      - "tests/Unit/BoundedGrowthPolicyTest.php"
      - "tests/Unit/BoundedMetricPolicyTest.php"
      - "tests/Unit/ServerPerfHarnessContractTest.php"
      - "tests/Unit/Support/server_soak_test.py"
      - "tests/Feature/SystemMetricsTest.php"
      - "tests/Feature/HealthControllerTest.php"
      - "tests/Feature/WorkerPollBackpressureTest.php"
  push:
    branches: [main]
    paths:
      - ".github/workflows/server-perf.yml"
      - "Dockerfile"
      - "bootstrap/app.php"
      - "docker-compose.yml"
      - "app/Support/ActivityRuntimeResultGate.php"
      - "app/Support/HistoryRetentionEnforcer.php"
      - "app/Support/BoundedMetricPolicy.php"
      - "app/Support/BoundedRedisReadinessProbe.php"
      - "app/Support/LongPollSignalStore.php"
      - "app/Support/LongPoller.php"
      - "app/Support/LongPollCapacityExhaustedException.php"
      - "app/Support/LongPollWaitSlotStore.php"
      - "app/Support/WorkerPollBackpressure.php"
      - "app/Support/ProjectionDriftMetrics.php"
      - "app/Support/ServerReadiness.php"
      - "app/Support/RemoteScheduleStarter.php"
      - "app/Support/ServerPollingCache.php"
      - "app/Support/TaskQueueAdmission.php"
      - "app/Support/WorkerPollClaimGate.php"
      - "app/Support/WorkflowQueryTaskBroker.php"
      - "app/Support/WorkflowTaskFailureMetrics.php"
      - "app/Support/WorkflowTaskPoller.php"
      - "app/Support/WorkerCompatibilityHeartbeatRecorder.php"
      - "app/Support/ActivityTaskPollRequestStore.php"
      - "app/Support/QueryTaskPollRequestStore.php"
      - "app/Support/WorkflowTaskPollRequestStore.php"
      - "app/Http/Controllers/Api/SystemController.php"
      - "app/Http/Controllers/Api/ActivityTaskController.php"
      - "app/Http/Controllers/Api/WorkerController.php"
      - "app/Http/Middleware/RequireWorkflowBootstrapReady.php"
      - "app/Services/PrometheusMetricsSummary.php"
      - "config/dw-bounded-growth.php"
      - "config/server.php"
      - "docs/bounded-growth.md"
      - "routes/api.php"
      - "scripts/perf/**"
      - "tests/Unit/BoundedGrowthPolicyTest.php"
      - "tests/Unit/BoundedMetricPolicyTest.php"
      - "tests/Unit/ServerPerfHarnessContractTest.php"
      - "tests/Unit/Support/server_soak_test.py"
      - "tests/Feature/SystemMetricsTest.php"
      - "tests/Feature/HealthControllerTest.php"
      - "tests/Feature/WorkerPollBackpressureTest.php"
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: server-perf-${{ github.event_name }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  contract:
    name: Bounded-growth contract
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20

    steps:
      - name: Checkout server
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Checkout workflow package
        run: |
          git init workflow-package
          git -C workflow-package remote add origin https://github.com/durable-workflow/workflow.git
          git -C workflow-package fetch --depth=1 origin 864cd6f2e11a60ddbd221548019df8ef0cd8f812
          git -C workflow-package checkout --detach FETCH_HEAD
          test "$(git -C workflow-package rev-parse HEAD)" = "864cd6f2e11a60ddbd221548019df8ef0cd8f812"

      - name: Run perf harness result-gate tests
        run: |
          python3 -m py_compile scripts/perf/server_soak.py tests/Unit/Support/server_soak_test.py
          python3 -m unittest tests/Unit/Support/server_soak_test.py

      - name: Run bounded-growth contract tests
        run: |
          # Stream sources into the test container so containerized runners avoid host bind-path assumptions.
          tar --exclude=.git --exclude=vendor --exclude=build -cf - . \
            | docker run --rm -i -w /app composer:2 \
                sh -lc 'tar -xf - -C /app && cp -a /app/workflow-package /workflow && composer install --no-interaction --no-progress --prefer-dist && vendor/bin/phpunit tests/Unit/BoundedGrowthPolicyTest.php tests/Unit/ServerPerfHarnessContractTest.php --colors=never'

  smoke:
    name: Polling cache bounded-growth smoke
    runs-on: ubuntu-latest
    if: ${{ github.server_url == 'https://github.com' }}
    timeout-minutes: 45

    steps:
      - name: Checkout server
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4

      - name: Run short perf smoke
        env:
          DW_PERF_DURATION_SECONDS: "120"
          DW_PERF_CONCURRENCY: "8"
          DW_PERF_NAMESPACES: "4"
          DW_PERF_TASK_QUEUES: "8"
          DW_PERF_WORKFLOW_RUNS: "1000"
          DW_PERF_START_CONCURRENCY: "8"
          DW_PERF_MIN_WORKFLOW_COMPLETION_RATIO: "0.98"
          DW_PERF_HEALTH_INTERVAL_SECONDS: "0.5"
          DW_PERF_MAX_HEALTH_LATENCY_SECONDS: "3"
          DW_PERF_CONTROL_PLANE_INTERVAL_SECONDS: "5"
          DW_PERF_MAX_CONTROL_PLANE_LATENCY_SECONDS: "5"
          DW_PERF_WORKFLOW_VERSION: "2.0.0-rc.1"
          DW_PERF_MAX_SERVER_MEMORY_MB: "768"
          DW_PERF_MAX_POLLING_KEYS: "512"
          DW_PERF_MAX_FINAL_POLLING_KEYS: "0"
          DW_PERF_MIN_SAMPLE_COVERAGE: "0.75"
          DW_PERF_MAX_SERVER_CACHE_KEYS_BY_POLICY: '{"polling_cache_availability_probe":0,"workflow_task_poll_requests":512,"activity_task_poll_requests":512,"query_task_poll_requests":512,"sqlite_worker_poll_claim_gate":1,"long_poll_signals":512,"long_poll_wait_slots":64,"workflow_query_tasks":64,"task_queue_admission_locks":128,"task_queue_dispatch_counters":128,"workflow_task_expired_lease_recovery":128,"history_retention_inline":64,"worker_compatibility_heartbeat":64,"readiness_probe":16}'
          DW_PERF_MAX_FINAL_SERVER_CACHE_KEYS_BY_POLICY: '{"polling_cache_availability_probe":0,"workflow_task_poll_requests":0,"activity_task_poll_requests":0,"query_task_poll_requests":0,"sqlite_worker_poll_claim_gate":0,"long_poll_signals":0,"long_poll_wait_slots":0,"workflow_query_tasks":0,"task_queue_admission_locks":0,"task_queue_dispatch_counters":0,"workflow_task_expired_lease_recovery":0,"history_retention_inline":0,"worker_compatibility_heartbeat":0,"readiness_probe":0}'
          RUNNER_ENVIRONMENT: "github-hosted"
        run: scripts/perf/run-server-soak.sh

      - name: Upload perf artifacts
        if: always() && github.server_url == 'https://github.com'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: server-perf-smoke
          path: build/perf/
          if-no-files-found: warn

  qualification:
    name: Performance source qualification
    needs: [contract, smoke]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require the intended qualification route
        env:
          ACTIONS_SERVER_URL: ${{ github.server_url }}
          CONTRACT_RESULT: ${{ needs.contract.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
        run: |
          set -euo pipefail
          test "$CONTRACT_RESULT" = success
          if [[ "$ACTIONS_SERVER_URL" == "https://github.com" ]]; then
            test "$SMOKE_RESULT" = success
            echo "Complete GitHub polling-cache qualification succeeded."
          else
            test "$SMOKE_RESULT" = skipped
            echo "Focused bounded-growth contract qualification succeeded."
          fi
