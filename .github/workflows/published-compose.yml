name: Published Compose Smoke
run-name: Published Compose ${{ inputs.server_image || github.ref }}

on:
  pull_request:
    paths:
      - docker-compose.published.yml
      - scripts/ci/native_qualification.py
      - scripts/ci/native_alias_transport.py
      - scripts/ci/native_alias_evidence.py
      - scripts/ci/native-qualification-subject.json
      - scripts/smoke-published-compose.sh
      - scripts/ci/select-published-compose-image.sh
      - .github/workflows/published-compose.yml
  workflow_dispatch:
    inputs:
      server_image:
        description: "Native image reference or digest to test instead of docker-compose.published.yml's default"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: published-compose-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: ${{ matrix.platform }} ${{ matrix.profile }} published image
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DW_PUBLISHED_COMPOSE_PROJECT: published-compose-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.shard }}
      MYSQL_VERSION: 8.0@sha256:62fb722c78b24245ddff1796a0fcee4a49cc5b87e0aaaf20c92d1da9e0a2497b
      QUALIFICATION_QEMU_IMAGE: docker.io/tonistiigi/binfmt@sha256:465d3fdd28d0f2b871ba4b4ec98bd183292e96167f00d9fd40bd249f8632d705

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            profile: local
            shard: amd64-local
          - platform: linux/arm64
            profile: local
            shard: arm64-local
          - platform: linux/amd64
            profile: production
            shard: amd64-production
          - platform: linux/arm64
            profile: production
            shard: arm64-production

    steps:
      - name: Checkout server
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Admit published qualification subject
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_IMAGE: ${{ inputs.server_image }}
        run: >-
          python3 scripts/ci/native_qualification.py admit --kind compose --image "$NATIVE_IMAGE"
          --output qualification-state/admission.json

      - name: Set up QEMU
        if: matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4
        with:
          image: ${{ env.QUALIFICATION_QEMU_IMAGE }}
          platforms: arm64

      - name: Set Compose image selector
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SERVER_IMAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.server_image || '' }}
        run: scripts/ci/select-published-compose-image.sh

      - name: Smoke published Compose stack
        id: body
        env:
          GH_TOKEN: ${{ github.token }}
          DW_SERVER_PLATFORM: ${{ matrix.platform }}
          DW_PUBLISHED_COMPOSE_PROFILE: ${{ matrix.profile }}
          SERVER_PORT: "0"
          DW_AUTH_TOKEN: published-compose-token
        run: scripts/smoke-published-compose.sh

      - name: Verify owned qualification cleanup
        id: cleanup
        if: always()
        run: |
          python3 scripts/ci/native_qualification.py cleanup --kind compose \
            --scope "$DW_PUBLISHED_COMPOSE_PROJECT" --output qualification-state/cleanup.json

      - name: Finalize promotion receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_BODY_OUTCOME: ${{ steps.body.outcome }}
          QUALIFICATION_CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
          PLATFORM: ${{ matrix.platform }}
          PROFILE: ${{ matrix.profile }}
        run: >-
          python3 scripts/ci/native_qualification.py finalize --kind compose --image "${DW_SERVER_IMAGE:-}"
          --platform "$PLATFORM" --profile "$PROFILE"
          --identity qualification-state/image.json --observations qualification-state/observations.json
          --cleanup qualification-state/cleanup.json --output promotion-receipt/receipt.json

      - name: Keep promotion receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: native-compose-promotion-receipt-${{ matrix.shard }}
          path: promotion-receipt/receipt.json
          retention-days: 14
          if-no-files-found: error
