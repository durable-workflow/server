name: Native release candidate

# Publishes the native (Rust) server image for an existing immutable native
# Git tag, native-<version> (Server #325). A native- tag never matches the PHP
# Release workflow's tag filter, so it starts no PHP release; the image tag is
# the version without the prefix. Each architecture builds on its own runner and pushes by
# digest only; that exact digest is pulled back and smoke-tested there, so a
# failed smoke leaves no tag. The publish job then refuses tags that already
# exist, gives both smoked digests
# the release tag in both registries as one index, verifies it, and attests
# its build provenance. The PHP image and its Release workflow are unchanged.
#
# It publishes to the same repositories as the PHP release,
# durableworkflow/server and ghcr.io/durable-workflow/server (operator
# decision, November 1), with the repository's Docker Hub credentials. A
# native version is a major version above every PHP release, and the
# publish job refuses a tag either registry already has, so it never
# replaces a PHP image. A final release then moves X.Y, X and latest
# forward to its index (operator decision, November 1); a candidate moves
# none, and the PHP Release workflow leaves latest to a newer native
# release. It runs only from main, in the dockerhub-native Environment.
#
# A release candidate (a version with a -rc.N suffix) publishes to GHCR only
# (operator decision, October 30). Any other version publishes to both
# registries: each job then signs in to Docker Hub before it builds anything,
# so a dispatch that cannot sign in stops there and pushes nothing.

run-name: Native ${{ inputs.tag }} at ${{ inputs.release_commit }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing immutable native Git tag, native-<version> (for example native-2.12.0-rc.1); the image tag drops native-'
        required: true
      release_commit:
        description: 'Full source commit of that tag'
        required: true

permissions:
  contents: read

concurrency:
  group: native-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  DOCKERHUB_IMAGE: durableworkflow/server
  GHCR_IMAGE: ghcr.io/durable-workflow/server

jobs:
  plan:
    name: Choose the registries for this tag
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dockerhub: ${{ steps.plan.outputs.dockerhub }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Publish a release candidate to GHCR only
        id: plan
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^native-[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] \
            || { echo 'tag must be native-X.Y.Z or native-X.Y.Z-rc.N' >&2; exit 1; }
          if [[ -n "${BASH_REMATCH[1]}" ]]; then echo dockerhub=false; else echo dockerhub=true; fi >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#native-}" >> "$GITHUB_OUTPUT"

  build-amd64:
    name: Build and smoke linux/amd64
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: dockerhub-native
    permissions:
      contents: read
      packages: write
    env:
      PLATFORM: linux/amd64
      RESOURCE_SCOPE: dw-native-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ github.sha }}

      - name: Check out immutable release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          path: release-source
          ref: refs/tags/${{ inputs.tag }}

      - name: Verify the release tag names the planned commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TAG_PREFIX: native-
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          set -euo pipefail
          scripts/ci/verify-release-tag-source.sh
          test "$(git -C release-source rev-parse HEAD)" = "$RELEASE_COMMIT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4

      - name: Log in to Docker Hub
        if: needs.plan.outputs.dockerhub == 'true'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/amd64 by digest only
        id: build
        timeout-minutes: 60
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: release-source
          file: release-source/Dockerfile.native
          platforms: linux/amd64
          pull: true
          provenance: false
          build-args: |
            DW_SERVER_VERSION=${{ needs.plan.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.release_commit }}
            dev.durable-workflow.release.tag=${{ inputs.tag }}
            dev.durable-workflow.release.run-id=${{ github.run_id }}
          outputs: type=image,"name=${{ env.GHCR_IMAGE }}${{ needs.plan.outputs.dockerhub == 'true' && format(',{0}', env.DOCKERHUB_IMAGE) || '' }}",push-by-digest=true,name-canonical=true,push=true

      - name: Smoke-test the pushed linux/amd64 digest on its own architecture
        env:
          IMAGE: ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}
        run: bash scripts/ci/native-image-smoke.sh "$IMAGE" "$PLATFORM" native-release/smoke-amd64.json

      - name: Remove this job's smoke containers and network
        if: always()
        run: |
          docker rm -f "$RESOURCE_SCOPE-native-sqlite" "$RESOURCE_SCOPE-native-pgsql" "$RESOURCE_SCOPE-native-mysql" "$RESOURCE_SCOPE-postgres" "$RESOURCE_SCOPE-mysql" || true
          docker network rm "$RESOURCE_SCOPE" || true

      - name: Keep the linux/amd64 smoke receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: native-smoke-amd64
          path: native-release
          retention-days: 30
          if-no-files-found: ignore

  build-arm64:
    name: Build and smoke linux/arm64
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    environment: dockerhub-native
    permissions:
      contents: read
      packages: write
    env:
      PLATFORM: linux/arm64
      RESOURCE_SCOPE: dw-native-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ github.sha }}

      - name: Check out immutable release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          path: release-source
          ref: refs/tags/${{ inputs.tag }}

      - name: Verify the release tag names the planned commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TAG_PREFIX: native-
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          set -euo pipefail
          scripts/ci/verify-release-tag-source.sh
          test "$(git -C release-source rev-parse HEAD)" = "$RELEASE_COMMIT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4

      - name: Log in to Docker Hub
        if: needs.plan.outputs.dockerhub == 'true'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/arm64 by digest only
        id: build
        timeout-minutes: 60
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: release-source
          file: release-source/Dockerfile.native
          platforms: linux/arm64
          pull: true
          provenance: false
          build-args: |
            DW_SERVER_VERSION=${{ needs.plan.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.release_commit }}
            dev.durable-workflow.release.tag=${{ inputs.tag }}
            dev.durable-workflow.release.run-id=${{ github.run_id }}
          outputs: type=image,"name=${{ env.GHCR_IMAGE }}${{ needs.plan.outputs.dockerhub == 'true' && format(',{0}', env.DOCKERHUB_IMAGE) || '' }}",push-by-digest=true,name-canonical=true,push=true

      - name: Smoke-test the pushed linux/arm64 digest on its own architecture
        env:
          IMAGE: ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}
        run: bash scripts/ci/native-image-smoke.sh "$IMAGE" "$PLATFORM" native-release/smoke-arm64.json

      - name: Remove this job's smoke containers and network
        if: always()
        run: |
          docker rm -f "$RESOURCE_SCOPE-native-sqlite" "$RESOURCE_SCOPE-native-pgsql" "$RESOURCE_SCOPE-native-mysql" "$RESOURCE_SCOPE-postgres" "$RESOURCE_SCOPE-mysql" || true
          docker network rm "$RESOURCE_SCOPE" || true

      - name: Keep the linux/arm64 smoke receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: native-smoke-arm64
          path: native-release
          retention-days: 30
          if-no-files-found: ignore

  publish:
    name: Tag, verify and attest the native index
    needs: [plan, build-amd64, build-arm64]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dockerhub-native
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4

      - name: Log in to Docker Hub
        if: needs.plan.outputs.dockerhub == 'true'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and verify the index in each registry
        id: index
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          DIGEST_AMD64: ${{ needs.build-amd64.outputs.digest }}
          DIGEST_ARM64: ${{ needs.build-arm64.outputs.digest }}
          PUBLISH_DOCKERHUB: ${{ needs.plan.outputs.dockerhub }}
        run: bash scripts/ci/native-release-publish.sh

      - name: Attest the index's build provenance in GHCR
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

      - name: Attest the index's build provenance in Docker Hub
        if: needs.plan.outputs.dockerhub == 'true'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4
        with:
          subject-name: index.docker.io/${{ env.DOCKERHUB_IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

  # A final release (never a candidate) moves X.Y, X and latest forward to the
  # attested index. This is its own job so a failed alias write can be rerun
  # alone ("Re-run failed jobs") from the already published index; it first
  # re-verifies that both exact tags name that index. One repository-wide
  # group serializes alias writes across native releases, and the script
  # rechecks each alias's current version in the registry right before
  # writing, so an older release never moves an alias backward.
  aliases:
    name: Move the rolling tags of a final release
    needs: [plan, publish]
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.dockerhub == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dockerhub-native
    concurrency:
      group: durable-workflow-server-rolling-aliases
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reconcile the rolling tags with the attested index
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          INDEX_DIGEST: ${{ needs.publish.outputs.digest }}
          RELEASE_IMAGE_TAG_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: bash scripts/ci/native-release-rolling-tags.sh
