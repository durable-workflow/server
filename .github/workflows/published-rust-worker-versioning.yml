name: Published Rust worker versioning

on:
  pull_request:
    paths:
      - .github/workflows/published-rust-worker-versioning.yml
      - scripts/conformance/worker-versioning-rust-*
      - scripts/conformance/worker-versioning-published-artifacts.*
      - tests/Unit/WorkerVersioningPublishedRustWorkerTest.mjs
  workflow_dispatch:
    inputs:
      server_version:
        description: Exact published Server version
        required: true
        type: string
      server_image:
        description: Exact published Server image digest
        required: true
        type: string
      rust_sdk_version:
        description: Exact published Rust SDK version
        required: true
        type: string

permissions:
  contents: read

jobs:
  published-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # One default artifact tuple for pull-request checks. Dispatch selects its own.
      DW_SERVER_VERSION: ${{ inputs.server_version || '2.5.10' }}
      DW_SERVER_IMAGE: ${{ inputs.server_image || 'durableworkflow/server@sha256:2043e097d6eb411632386b001385cb5d8145dac1e3b5b14df901ac333d81c5ec' }}
      DW_RUST_SDK_VERSION: ${{ inputs.rust_sdk_version || '3.4.0' }}
      DW_WV_NAMESPACE: rust-worker-versioning
      DW_WV_RUNNER_COMMIT: ${{ github.sha }}
      RESOURCE: wv-rust-${{ github.run_id }}-${{ github.run_attempt }}
      RUST_IMAGE: rust@sha256:300ec56abce8cc9448ddea2172747d048ed902a3090e6b57babb2bf19f754081
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check result validation
        run: |
          docker run --rm --init --user "$(id -u):$(id -g)" \
            --volume "$PWD:/repo:ro" --workdir /repo node:22-slim \
            node --test tests/Unit/WorkerVersioningPublishedRustWorkerTest.mjs

      - name: Start the selected published stack
        run: |
          set -euo pipefail
          [[ "$DW_SERVER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$DW_RUST_SDK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$DW_SERVER_IMAGE" =~ ^(docker.io/)?durableworkflow/server@sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/worker-versioning"
          docker pull "$DW_SERVER_IMAGE"
          docker image inspect "$DW_SERVER_IMAGE" > "$RUNNER_TEMP/worker-versioning/server-image.json"
          docker network create "$RESOURCE"
          docker run -d --name "$RESOURCE-mysql" --network "$RESOURCE" \
            -e MYSQL_DATABASE=durable_workflow -e MYSQL_USER=workflow \
            -e MYSQL_PASSWORD=workflow -e MYSQL_ROOT_PASSWORD=root \
            mysql@sha256:679e7e924f38a3cbb62a3d7df32924b83f7321a602d3f9f967c01b3df18495d6
          docker run -d --name "$RESOURCE-redis" --network "$RESOURCE" \
            redis@sha256:0637954999d01b7c9ce9167db2da50656e2590d3b884f1c600c5f63bb6e6773c
          for attempt in $(seq 1 60); do
            if docker exec "$RESOURCE-mysql" mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then break; fi
            if [[ "$attempt" == 60 ]]; then exit 1; fi
            sleep 1
          done
          docker run -d --init --name "$RESOURCE-server" --network "$RESOURCE" \
            -e APP_ENV=production -e APP_DEBUG=false -e LOG_CHANNEL=stderr \
            -e APP_KEY=base64:ZHVyYWJsZS13b3JrZmxvdy1saWZlY3ljbGUta2V5ISE= \
            -e DB_CONNECTION=mysql -e DB_HOST="$RESOURCE-mysql" \
            -e DB_DATABASE=durable_workflow -e DB_USERNAME=workflow -e DB_PASSWORD=workflow \
            -e REDIS_HOST="$RESOURCE-redis" -e QUEUE_CONNECTION=redis -e CACHE_STORE=redis \
            -e DW_AUTH_DRIVER=token -e DW_AUTH_TOKEN=dev-token \
            -e DW_TASK_DISPATCH_MODE=poll -e DW_V2_TASK_DISPATCH_MODE=poll "$DW_SERVER_IMAGE"
          docker cp "$RESOURCE-server:/app/resources/release/source-release.json" \
            "$RUNNER_TEMP/worker-versioning/server-source-release.json"
          jq -e --arg version "$DW_SERVER_VERSION" '.server.version == $version' \
            "$RUNNER_TEMP/worker-versioning/server-source-release.json"
          docker exec --user 1000:1000 "$RESOURCE-server" server-bootstrap \
            > "$RUNNER_TEMP/worker-versioning/bootstrap.log" 2>&1
          docker exec "$RESOURCE-server" curl -fsS http://127.0.0.1:8080/api/ready \
            > "$RUNNER_TEMP/worker-versioning/readiness.json"

      - name: Execute installed Rust workers
        run: |
          set -euo pipefail
          result_dir="$RUNNER_TEMP/worker-versioning"
          docker create --name "$RESOURCE-node" node:22-slim
          docker cp "$RESOURCE-node:/usr/local/bin/node" "$result_dir/node"
          docker rm "$RESOURCE-node"
          docker run --rm --init --user "$(id -u):$(id -g)" \
            --name "$RESOURCE-runner" --network "$RESOURCE" --cpus 2 --memory 2g \
            --volume "$PWD:/repo:ro" --volume "$result_dir:/result" \
            -e CARGO_HOME=/result/cargo -e CARGO_TARGET_DIR=/result/target -e CARGO_BUILD_JOBS=2 \
            -e DW_SERVER_VERSION -e DW_SERVER_IMAGE -e DW_RUST_SDK_VERSION \
            -e DW_WV_NAMESPACE -e DW_WV_RUNNER_COMMIT \
            -e DW_WV_SERVER_URL="http://$RESOURCE-server:8080" \
            -e DW_WV_RESULT_DIR=/result -e DW_WV_RUN_ROOT=/result/run \
            "$RUST_IMAGE" /result/node /repo/scripts/conformance/worker-versioning-rust-published-workers.mjs

      - name: Save service logs and remove job resources
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/worker-versioning"
          for role in server mysql redis; do
            docker logs "$RESOURCE-$role" > "$RUNNER_TEMP/worker-versioning/$role.log" 2>&1 || true
          done
          docker rm -f "$RESOURCE-runner" "$RESOURCE-server" "$RESOURCE-mysql" "$RESOURCE-redis" "$RESOURCE-node" || true
          docker network rm "$RESOURCE" || true

      - name: Retain observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-worker-versioning-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/worker-versioning/*.json
            ${{ runner.temp }}/worker-versioning/*.log
            ${{ runner.temp }}/worker-versioning/*.lock
          if-no-files-found: error
          retention-days: 30
