name: Native image rescan

# Server #802: rescans the latest stable native image weekly, so advisories
# or fixes published after a release are seen. It reads the image from the
# registry and runs nothing. A HIGH or CRITICAL row with a fixed version
# fails the run; record the disposition on server#802. Unfixed rows are
# inventory in the kept receipts.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-image-rescan
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/durable-workflow/server

jobs:
  rescan:
    name: Rescan latest ${{ matrix.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Resolve latest to its platform digest
        id: resolve
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$GHCR_IMAGE:latest" --format '{{json .Manifest}}' > index.json
          digest=$(python3 -I -c 'import json, sys
          os_name, arch = sys.argv[2].split("/")
          index = json.load(open(sys.argv[1]))
          found = [m["digest"] for m in index["manifests"] if m.get("platform", {}).get("os") == os_name and m["platform"].get("architecture") == arch]
          assert len(found) == 1, found
          print(found[0])' index.json "$PLATFORM")
          echo "image=$GHCR_IMAGE@$digest" >> "$GITHUB_OUTPUT"

      - name: Scan the latest ${{ matrix.platform }} digest
        env:
          IMAGE: ${{ steps.resolve.outputs.image }}
          PLATFORM: ${{ matrix.platform }}
        run: bash scripts/ci/native-image-scan.sh "$IMAGE" "$PLATFORM" native-scan

      - name: Keep the scan receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: native-rescan-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: native-scan
          retention-days: 90
          if-no-files-found: ignore
