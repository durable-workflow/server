name: Published release verification recovery

run-name: Verify published Server ${{ inputs.release_tag }} at ${{ inputs.release_commit }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact existing immutable Server release tag
        required: true
        type: string
      release_commit:
        description: Full source commit for the existing release tag
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: published-release-recovery-${{ inputs.release_tag }}-${{ inputs.release_commit }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify existing published release
    if: >-
      github.repository == 'durable-workflow/server' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      release_source_commit: ${{ inputs.release_commit }}
      release_verification_outcome: ${{ steps.release_verify.outcome }}
      published_database_tls_outcome: ${{ steps.published_database_tls.outcome }}
    steps:
      - name: Check out trusted default-branch verification tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Docker manifest inspection
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4

      - name: Verify requested immutable release artifacts
        id: release_verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_RECOVERY_EVIDENCE: published-release-recovery-evidence.json
        run: scripts/ci/verify-published-release-recovery.sh

      - name: Verify published image database TLS and certificate refusals
        id: published_database_tls
        timeout-minutes: 10
        env:
          TLS_TEST_MODE: published
          TLS_TEST_IMAGE: ghcr.io/durable-workflow/server@${{ steps.release_verify.outputs.image_digest }}
          TLS_TEST_PROJECT: dw-server-published-tls-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          TLS_TEST_ROOT: ${{ runner.temp }}/dw-server-tls-release-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: bash scripts/ci/qualify-database-tls.sh

      - name: Verify existing image first-run readiness and container logging
        env:
          DW_SERVER_IMAGE: ghcr.io/durable-workflow/server@${{ steps.release_verify.outputs.image_digest }}
          DW_FIRST_RUN_SCOPE: recovery-first-run-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          RELEASE_SOURCE_COMMIT: ${{ inputs.release_commit }}
        run: |
          if git cat-file -e "${RELEASE_SOURCE_COMMIT}:scripts/ci/verify-container-logging.mjs" 2>/dev/null; then
            scripts/smoke-published-first-run.sh
          else
            echo "This immutable release predates container logging acceptance; historical verification remains unchanged."
          fi

      - name: Clean up existing image first-run resources
        if: always()
        env:
          DW_FIRST_RUN_SCOPE: recovery-first-run-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          docker ps -aq --filter "label=dev.durable-workflow.container-logging=${DW_FIRST_RUN_SCOPE}-logs" | xargs -r docker rm -f >/dev/null 2>&1 || true
          docker volume ls -q --filter "label=dev.durable-workflow.container-logging=${DW_FIRST_RUN_SCOPE}-logs" | xargs -r docker volume rm >/dev/null 2>&1 || true
          docker rm -f "${DW_FIRST_RUN_SCOPE}-server" "${DW_FIRST_RUN_SCOPE}-bootstrap" >/dev/null 2>&1 || true
          docker volume rm "${DW_FIRST_RUN_SCOPE}-database" >/dev/null 2>&1 || true

      - name: Clean up published image database TLS fixtures
        if: always()
        env:
          TLS_TEST_PROJECT: dw-server-published-tls-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          TLS_TEST_ROOT: ${{ runner.temp }}/dw-server-tls-release-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          docker rm -f "$TLS_TEST_PROJECT-certificates" >/dev/null 2>&1 || true
          docker ps -aq --filter "label=com.docker.compose.project=$TLS_TEST_PROJECT" | xargs -r docker rm -f >/dev/null 2>&1 || true
          docker network ls -q --filter "label=com.docker.compose.project=$TLS_TEST_PROJECT" | xargs -r docker network rm >/dev/null 2>&1 || true
          docker volume ls -q --filter "label=com.docker.compose.project=$TLS_TEST_PROJECT" | xargs -r docker volume rm -f >/dev/null 2>&1 || true
          bash scripts/ci/cleanup-database-tls.sh

      - name: Retain bounded verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: published-release-recovery-${{ inputs.release_tag }}
          path: |
            published-release-recovery-evidence.json
          if-no-files-found: error
          retention-days: 14

  publish-chart:
    name: Recover matching immutable Helm chart
    needs: verify
    if: >-
      always() &&
      needs.verify.result == 'success' &&
      needs.verify.outputs.release_verification_outcome == 'success' &&
      needs.verify.outputs.published_database_tls_outcome == 'success' &&
      github.repository == 'durable-workflow/server' &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/helm-chart-publish.yml  # local
    with:
      source_ref: ${{ needs.verify.outputs.release_source_commit }}
      allow_missing_image: false
