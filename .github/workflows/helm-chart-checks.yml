name: Reusable Helm Chart Checks

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact Server source revision to validate
        required: true
        type: string

permissions:
  contents: read

env:
  CHART_PATH: k8s/helm/durable-workflow
  PYTHON_VERSION: 3.12.11
  HELM_VERSION: v3.16.2
  CHART_TESTING_VERSION: 3.14.0
  YAMLLINT_VERSION: 1.33.0
  YAMALE_VERSION: 6.0.0
  KUBECONFORM_VERSION: v0.6.7
  KUBE_VERSIONS: "1.27.0 1.28.0 1.29.0 1.30.0"
  KIND_VERSION: v0.23.0
  KUBECTL_VERSION: v1.29.4
  KIND_NODE_IMAGE: kindest/node:v1.29.4

jobs:
  lint-and-template:
    name: Lint, render, and validate manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout server
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_ref }}

      - name: Enforce immutable chart versioning
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF="HEAD^"
          fi
          python3 scripts/ci/test_helm_chart_release.py
          python3 scripts/ci/helm_chart_release.py check-version --base-ref "$BASE_REF"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Helm lint
        run: |
          helm lint "${CHART_PATH}"
          for f in "${CHART_PATH}"/ci/*-values.yaml; do
            echo "::group::helm lint with $(basename "$f")"
            helm lint "${CHART_PATH}" -f "$f"
            echo "::endgroup::"
          done

      - name: Render every CI fixture
        run: |
          mkdir -p rendered
          for f in "${CHART_PATH}"/ci/*-values.yaml; do
            name="$(basename "$f" .yaml)"
            echo "::group::helm template ${name}"
            helm template "rel-${name}" "${CHART_PATH}" \
              --namespace durable-workflow \
              -f "$f" \
              > "rendered/${name}.yaml"
            echo "::endgroup::"
          done

      - name: Validate rendered manifests against Kubernetes schemas
        run: |
          docker run --rm \
            -v "${PWD}/rendered:/manifests:ro" \
            ghcr.io/yannh/kubeconform:${KUBECONFORM_VERSION} \
            -strict \
            -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -kubernetes-version 1.29.0 \
            /manifests

      - name: Validate against the supported Kubernetes version matrix
        run: |
          for kv in ${KUBE_VERSIONS}; do
            echo "::group::kubeconform against ${kv}"
            docker run --rm \
              -v "${PWD}/rendered:/manifests:ro" \
              ghcr.io/yannh/kubeconform:${KUBECONFORM_VERSION} \
              -strict \
              -summary \
              -kubernetes-version "${kv}" \
              /manifests
            echo "::endgroup::"
          done

      - name: Upload rendered manifests
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: helm-rendered-manifests
          path: rendered/
          if-no-files-found: error

  ct-lint-install:
    name: chart-testing lint + install (kind)
    needs: lint-and-template
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HELM_CT_CLUSTER_NAME: dw-helm-ct-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      HELM_CT_NETWORK_NAME: dw-helm-kind-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      KUBECONFIG: /tmp/dw-helm-ct-kubeconfig-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - name: Checkout server
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_ref }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f  # v2.8.0
        with:
          version: ${{ env.CHART_TESTING_VERSION }}
          yamllint_version: ${{ env.YAMLLINT_VERSION }}
          yamale_version: ${{ env.YAMALE_VERSION }}

      - name: Configure kind networking for containerized runners
        run: |
          if [ -n "${JOB_CONTAINER_NAME:-}" ]; then
            workflow_network="$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{printf "%s" $k}}{{end}}' "${JOB_CONTAINER_NAME}")"
            if [ -z "${workflow_network}" ]; then
              echo "unable to determine workflow network for ${JOB_CONTAINER_NAME}" >&2
              exit 1
            fi
            echo "KIND_EXPERIMENTAL_DOCKER_NETWORK=${workflow_network}" >> "${GITHUB_ENV}"
            echo "KIND_CLEANUP_NETWORK=" >> "${GITHUB_ENV}"
          else
            echo "KIND_EXPERIMENTAL_DOCKER_NETWORK=${HELM_CT_NETWORK_NAME}" >> "${GITHUB_ENV}"
            echo "KIND_CLEANUP_NETWORK=${HELM_CT_NETWORK_NAME}" >> "${GITHUB_ENV}"
            docker network create "${HELM_CT_NETWORK_NAME}"
          fi

      - name: Set up kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc  # v1.14.0
        with:
          version: ${{ env.KIND_VERSION }}
          kubectl_version: ${{ env.KUBECTL_VERSION }}
          node_image: ${{ env.KIND_NODE_IMAGE }}
          cluster_name: ${{ env.HELM_CT_CLUSTER_NAME }}
          kubeconfig: ${{ env.KUBECONFIG }}
          wait: 120s
          ignore_failed_clean: true

      - name: Export internal kind kubeconfig for containerized runners
        if: env.JOB_CONTAINER_NAME != ''
        run: kind export kubeconfig --name "${HELM_CT_CLUSTER_NAME}" --internal

      - name: ct lint
        run: |
          ct lint \
            --target-branch "${{ github.event.repository.default_branch }}" \
            --chart-dirs k8s/helm \
            --charts "${CHART_PATH}" \
            --validate-maintainers=false

      - name: Exercise memo-transition image guard
        run: scripts/ci/helm-memo-transition-upgrade.sh

      - name: Resolve locked workflow package authority
        id: workflow
        run: php scripts/ci/resolve-workflow-package-authority.php

      - name: Run kind smoke script
        env:
          ACTIONS_SERVER_URL: ${{ github.server_url }}
          WORKFLOW_PACKAGE_SOURCE: ${{ steps.workflow.outputs.source }}
          WORKFLOW_PACKAGE_REF: ${{ steps.workflow.outputs.ref }}
          WORKFLOW_PACKAGE_COMMIT: ${{ steps.workflow.outputs.commit }}
          K8S_HELM_SMOKE_KIND_NODE_IMAGE: ${{ env.KIND_NODE_IMAGE }}
          K8S_HELM_SMOKE_CLUSTER: ${{ env.HELM_CT_CLUSTER_NAME }}
          K8S_HELM_SMOKE_REUSE_CLUSTER: "1"
          K8S_HELM_SMOKE_IMAGE: durableworkflow/server:helm-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          K8S_HELM_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/helm-smoke
        run: |
          if [[ "$ACTIONS_SERVER_URL" != "https://github.com" ]]; then
            export WORKFLOW_PACKAGE_QUALIFICATION_REF="$WORKFLOW_PACKAGE_COMMIT"
          fi
          scripts/helm-chart-kind-smoke.sh

      - name: Print smoke diagnostics
        if: failure()
        run: |
          artifact_dir="${{ runner.temp }}/helm-smoke"
          if [ ! -d "${artifact_dir}" ]; then
            echo "no smoke artifacts collected"
            exit 0
          fi

          for file in \
            helm-status.txt \
            events.txt \
            describe.txt \
            resources.txt \
            migration-job.log \
            server.log \
            worker.log \
            mysql.log \
            redis.log \
            port-forward.log; do
            path="${artifact_dir}/${file}"
            if [ ! -f "${path}" ]; then
              continue
            fi
            echo "::group::${file}"
            tail -n 200 "${path}" || cat "${path}" || true
            echo "::endgroup::"
          done

      - name: Upload smoke artifacts
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: helm-chart-kind-smoke
          path: ${{ runner.temp }}/helm-smoke
          if-no-files-found: ignore

      - name: Clean up kind infrastructure
        if: always()
        env:
          KIND_CLEANUP_CLUSTER: ${{ env.HELM_CT_CLUSTER_NAME }}
          KIND_CLEANUP_KUBECONFIG: ${{ env.KUBECONFIG }}
        run: |
          if [ -n "${KIND_CLEANUP_NETWORK:-}" ]; then
            docker network rm "${HELM_CT_NETWORK_NAME}" >/dev/null 2>&1 || true
          fi
          scripts/ci/cleanup-kind-cluster.sh
