name: Public Boundary

on:
  pull_request:
  merge_group:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan public boundary
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Qualify the PHP APT source prerequisite without packages
        run: |
          /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C /usr/bin/python3 -I --version
          /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C /usr/bin/python3 -I tests/Unit/Support/php_apt_test.py
          /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C /usr/bin/python3 -I tests/Unit/Support/brotli_trust_test.py
          /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C /usr/bin/python3 -I scripts/ci/verify-php-apt-source.py
          /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C /bin/sh -n docker/apt/require-fixed-apt.sh
          /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C /usr/bin/shellcheck docker/apt/require-fixed-apt.sh

      - name: Verify metadata scan failures
        run: bash tests/Unit/Support/public_boundary_test.sh

      - name: Scan files and commit metadata
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "merge_group" ]]; then
            range="${{ github.event.merge_group.base_sha }}..${{ github.event.merge_group.head_sha }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            range="-1 ${{ github.sha }}"
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            range="-1 ${{ github.sha }}"
          else
            if ! git cat-file -e '${{ github.event.before }}^{commit}' 2>/dev/null; then
              git fetch --no-tags origin '${{ github.event.before }}'
            fi
            range="${{ github.event.before }}..${{ github.sha }}"
          fi

          PUBLIC_BOUNDARY_GIT_RANGE="$range" scripts/check-public-boundary.sh

      - name: Check Docker workflow isolation
        run: |
          python3 scripts/ci/check-docker-workflow-isolation.py
          python3 -m unittest tests/Unit/Support/docker_workflow_isolation_policy_test.py
