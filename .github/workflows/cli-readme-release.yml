name: CLI README Release

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 */6 * * *'
  repository_dispatch:
    types:
      - product-train-release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-readme-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Verify supported CLI release and README drift
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout server
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Check generated README against the public CLI release on GitHub
        if: ${{ github.server_url == 'https://github.com' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/sync-cli-readme-release.mjs --check

      - name: Check generated README against checked-in release authority
        if: ${{ github.server_url != 'https://github.com' }}
        run: node scripts/ci/sync-cli-readme-release.mjs --check --offline

      - name: Verify public release assets and installed binary identity
        run: scripts/ci/verify-cli-readme-release.sh
