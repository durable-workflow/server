name: Published Nexus SDK execution

on:
  pull_request:
    paths:
      - .github/workflows/published-nexus-sdk-callers.yml
      - scripts/conformance/nexus-published-artifacts.sh
      - scripts/conformance/nexus-replay-transport.cjs
      - scripts/conformance/nexus-python-workflow-probe.py
      - scripts/conformance/nexus_python_caller_workflow.py
      - scripts/conformance/nexus-php-service-worker.php
      - scripts/conformance/nexus-php-workflow-probe.php
      - scripts/conformance/nexus-php-caller-recovery.php
      - scripts/conformance/nexus-python-caller-recovery.py
      - scripts/conformance/nexus-python-service-worker.py
      - scripts/conformance/nexus-service-call-audit.php
      - tests/Unit/NexusSdkCallerEvidenceTest.mjs
      - tests/Unit/NexusExternalSdkEvidenceTest.mjs
  push:
    branches: [main]
    paths:
      - .github/workflows/published-nexus-sdk-callers.yml
      - scripts/conformance/nexus-published-artifacts.sh
      - scripts/conformance/nexus-replay-transport.cjs
      - scripts/conformance/nexus-python-workflow-probe.py
      - scripts/conformance/nexus_python_caller_workflow.py
      - scripts/conformance/nexus-php-service-worker.php
      - scripts/conformance/nexus-php-workflow-probe.php
      - scripts/conformance/nexus-php-caller-recovery.php
      - scripts/conformance/nexus-python-caller-recovery.py
      - scripts/conformance/nexus-python-service-worker.py
      - scripts/conformance/nexus-service-call-audit.php
      - tests/Unit/NexusSdkCallerEvidenceTest.mjs
      - tests/Unit/NexusExternalSdkEvidenceTest.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-callers-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  callers:
    name: SDK client admissions and PHP/Python caller workflows
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DW_SERVER_IMAGE: durableworkflow/server:2.11.8@sha256:3848d5d5cd1b23bd2881e3fdecea64cc44b72e6fb812e577c2db6d0872d065dd
      DW_SERVER_VERSION: 2.11.8
      DW_WORKFLOW_PHP_VERSION: 2.15.12
      DW_PHP_SDK_VERSION: 3.6.1
      DW_PYTHON_SDK_VERSION: 2.12.2
      DW_CLI_VERSION: 2.3.3
      DW_WATERLINE_VERSION: 2.13.0
      DW_NEXUS_EXTERNAL_PAYLOAD_PROBES: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Reject false execution evidence
        run: node --test tests/Unit/NexusSdkCallerEvidenceTest.mjs tests/Unit/NexusExternalSdkEvidenceTest.mjs
      - name: Execute the published client and service pairs
        shell: bash
        env:
          DW_NEXUS_RESULT_DIR: ${{ runner.temp }}/nexus-proof
          DW_NEXUS_RUN_ROOT: ${{ runner.temp }}/nexus-run
        run: |
          set -euo pipefail
          mkdir -p "$DW_NEXUS_RESULT_DIR"
          # The complete Nexus suite remains non-passing until caller workflows
          # and durable terminal service outcomes have actually been executed.
          set +e
          scripts/conformance/nexus-published-artifacts.sh
          result=$?
          set -e
          printf '%s\n' "$result" > "$DW_NEXUS_RESULT_DIR/complete-suite-exit-code.txt"
          NEXUS_SDK_CLIENT_MATRIX="$DW_NEXUS_RESULT_DIR/nexus-sdk-client-matrix.json" \
            NEXUS_CONFORMANCE_RESULT="$DW_NEXUS_RESULT_DIR/nexus-conformance-result.json" \
            NEXUS_PYTHON_WORKFLOW_PROBE="$DW_NEXUS_RESULT_DIR/nexus-python-workflow-probe.json" \
            NEXUS_PHP_WORKFLOW_PROBE="$DW_NEXUS_RESULT_DIR/nexus-php-workflow-probe.json" \
            NEXUS_PHP_PHP_WORKFLOW_PROBE="$DW_NEXUS_RESULT_DIR/nexus-php-php-workflow-probe.json" \
            NEXUS_PYTHON_PYTHON_WORKFLOW_PROBE="$DW_NEXUS_RESULT_DIR/nexus-python-python-workflow-probe.json" \
            NEXUS_TYPED_FAILURE_PROBES="$DW_NEXUS_RESULT_DIR/nexus-typed-failure-probes.json" \
            NEXUS_UNCAUGHT_FAILURE_PROBES="$DW_NEXUS_RESULT_DIR/nexus-uncaught-failure-probes.json" \
            NEXUS_CANCELLATION_PROBES="$DW_NEXUS_RESULT_DIR/nexus-cancellation-probes.json" \
            NEXUS_WAITING_CALLER_CANCELLATION_PROBES="$DW_NEXUS_RESULT_DIR/nexus-waiting-caller-cancellation-probes.json" \
            NEXUS_CALLER_RECOVERY_PROBES="$DW_NEXUS_RESULT_DIR/nexus-caller-recovery-probes.json" \
            NEXUS_BACKEND_INTERRUPTION_PROBES="$DW_NEXUS_RESULT_DIR/nexus-backend-interruption-probes.json" \
            NEXUS_DEADLINE_PROBE="$DW_NEXUS_RESULT_DIR/nexus-deadline-probe.json" \
            node --test tests/Unit/NexusSdkCallerEvidenceTest.mjs
          NEXUS_EXTERNAL_SDK_PROBES="$DW_NEXUS_RESULT_DIR/nexus-external-sdk-probes.json" \
            NEXUS_AUTHORED_AUTHORIZATION_PROBES="$DW_NEXUS_RESULT_DIR/nexus-authored-authorization-probes.json" \
            node --test tests/Unit/NexusExternalSdkEvidenceTest.mjs
          node -e 'const report = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); if (report.outcome !== "pass") throw new Error("Aggregate Nexus conformance: " + report.outcome);' \
            "$DW_NEXUS_RESULT_DIR/nexus-conformance-result.json"
      - name: Summarize actual outcomes and bound retained diagnostics
        if: always()
        env:
          REPORT_ROOT: ${{ runner.temp }}/nexus-proof
        run: |
          node <<'JS'
          const fs = require('node:fs'), path = require('node:path');
          const root = process.env.REPORT_ROOT, retained = path.join(root, 'retained');
          fs.mkdirSync(retained, {recursive: true});
          const summary = {};
          const failureSummary = history => {
            const payload = history?.events?.find(event => event.event_type === 'WorkflowFailed')?.payload;
            return payload ? {type: payload.exception_type || payload.exception_class, message: payload.message} : null;
          };
          const emitOutcome = value => {
            const message = JSON.stringify(value).replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
            console.log('::notice title=Nexus SDK outcomes::' + message);
          };
          const conformancePath = path.join(root, 'nexus-conformance-result.json');
          if (fs.existsSync(conformancePath)) {
            const report = JSON.parse(fs.readFileSync(conformancePath, 'utf8'));
            const findings = report.findings || [];
            summary.conformance = {
              outcome: report.outcome,
              scenario_statuses: (report.scenario_results || []).map(row => ({scenario_id: row.scenario_id, status: row.status,
                ...(row.observed_outputs?.authored_caller_workflow_observations
                  ? {caller_workflows: row.observed_outputs.authored_caller_workflow_observations} : {})})),
              finding_count: findings.length,
              findings_truncated: findings.length > 64,
              findings: findings.slice(0, 64).map(finding => Object.fromEntries([
                'scenario_id', 'type', 'finding_type', 'owning_surface', 'finding_url', 'issue_url',
                'observed_behavior', 'expected_behavior', 'next_acceptance_criterion',
              ].filter(key => typeof finding[key] === 'string').map(key => [key, finding[key].slice(0, 1500)]))),
            };
            emitOutcome({kind: 'conformance', outcome: report.outcome,
              scenario_statuses: summary.conformance.scenario_statuses, finding_count: findings.length});
          } else {
            summary.conformance = {missing: true};
          }
          for (const [kind, name] of [['external', 'nexus-external-sdk-probes.json'],
            ['authorization', 'nexus-authored-authorization-probes.json'],
            ['uncaught', 'nexus-uncaught-failure-probes.json']]) {
            if (!fs.existsSync(path.join(root, name))) { summary[kind] = {missing: true}; continue; }
            const report = JSON.parse(fs.readFileSync(path.join(root, name), 'utf8'));
            summary[kind] = report.reports.map(pair => ({caller: pair.caller, service: pair.service,
              process_ok: pair.observation?.ok, audit_exit_code: pair.audit_exit_code,
              process_error: pair.observation?.body?.error,
              process_stderr: pair.observation?.body?.stderr?.slice(-1500),
              observations: (pair.observation?.body?.observations || []).map(row => ({
                namespace: row.caller_namespace, workflow_id: row.workflow_id, run_id: row.run_id,
                call_id: row.original_service_call_id || row.result?.service_call_id,
                recovered: row.recovery_qualified, authorization: row.authorization_qualified,
                uncaught_failure: row.uncaught_failure_qualified,
                failure: row.failure, status: row.result?.status || row.caller_status, value: row.result?.external_result,
                caller_failure: failureSummary(row.history), service_failure: failureSummary(row.linked_service_history),
                caller_event_types: row.last_observed_caller_event_types || (row.history?.events || []).map(event => event.event_type),
                service_event_types: row.last_observed_service_event_types || (row.linked_service_history?.events || []).map(event => event.event_type),
                caller_status: row.caller_status,
                worker_diagnostic_head: typeof row.worker_log === 'string' ? row.worker_log.slice(0, 1500) : row.worker_log?.head,
                worker_diagnostic_tail: typeof row.worker_log === 'string' ? row.worker_log.slice(-1500) : row.worker_log?.tail,
                elapsed: row.elapsed_seconds, replacement_exit: row.replacement_worker_exit_code,
                observer_memory_limit: row.observer_memory_limit, observer_peak_bytes: row.observer_peak_bytes,
                admin_refusal_status: row.admin_refusal_status,
                history_status: row.raw_caller_history?.status,
                history_reason: row.raw_caller_history?.body?.reason,
                reference_checks: (row.retained_references || []).map(item => ({namespace: item.namespace,
                  reference_id: item.reference.reference_id, size: item.reference.size_bytes,
                  owner_status: item.owner.status, foreign_status: item.foreign.status,
                  exact_bytes: item.owner.bytes === item.reference.size_bytes,
                  exact_hash: item.owner.sha256 === item.reference.sha256})),
              }))}));
            if (kind === 'uncaught') emitOutcome({kind, reports: summary[kind].map(pair => ({
              caller: pair.caller, service: pair.service, process_ok: pair.process_ok,
              observations: pair.observations.map(row => ({namespace: row.namespace, run_id: row.run_id,
                call_id: row.call_id, status: row.status, uncaught_failure: row.uncaught_failure,
                elapsed: row.elapsed})),
            }))});
            else for (const pair of summary[kind]) emitOutcome({kind, ...pair});
          }
          let retainedBytes = 0;
          const omittedReports = [];
          for (const name of ['nexus-external-sdk-probes.json', 'nexus-external-sdk-probes-error.json',
            'nexus-authored-authorization-probes.json', 'nexus-authored-authorization-probes-error.json',
            'nexus-uncaught-failure-probes.json', 'nexus-uncaught-failure-probes-error.json',
            'complete-suite-exit-code.txt', 'pins.json']) {
            const file = path.join(root, name);
            if (!fs.existsSync(file)) continue;
            const bytes = fs.statSync(file).size;
            if (retainedBytes + bytes > 2 * 1024 * 1024) { omittedReports.push({name, bytes}); continue; }
            fs.copyFileSync(file, path.join(retained, name)); retainedBytes += bytes;
          }
          for (const name of fs.readdirSync(root).filter(name => /-(external|authorization)\.log$|-uncaught-failure-probe\.log$/.test(name))) {
            const bytes = fs.readFileSync(path.join(root, name));
            fs.writeFileSync(path.join(retained, name), Buffer.concat([bytes.subarray(0, 1200),
              Buffer.from('\n[bounded diagnostic tail]\n'), bytes.subarray(Math.max(1200, bytes.length - 4000))]));
          }
          summary.retention = {payload_bytes: retainedBytes, limit_bytes: 2 * 1024 * 1024, omitted_reports: omittedReports};
          fs.writeFileSync(path.join(retained, 'outcomes.json'), JSON.stringify(summary, null, 2));
          JS
      - name: Retain bounded actual observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nexus-sdk-callers-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nexus-proof/retained
          if-no-files-found: error
          retention-days: 1
