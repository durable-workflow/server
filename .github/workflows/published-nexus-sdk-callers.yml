name: Published Nexus SDK execution

on:
  pull_request:
    paths:
      - .github/workflows/published-nexus-sdk-callers.yml
      - scripts/conformance/nexus-published-artifacts.sh
      - scripts/conformance/nexus-replay-transport.cjs
      - scripts/conformance/nexus-python-workflow-probe.py
      - scripts/conformance/nexus-php-service-worker.php
      - scripts/conformance/nexus-php-workflow-probe.php
      - scripts/conformance/nexus-python-service-worker.py
      - tests/Unit/NexusSdkCallerEvidenceTest.mjs
  push:
    branches: [main]
    paths:
      - .github/workflows/published-nexus-sdk-callers.yml
      - scripts/conformance/nexus-published-artifacts.sh
      - scripts/conformance/nexus-replay-transport.cjs
      - scripts/conformance/nexus-python-workflow-probe.py
      - scripts/conformance/nexus-php-service-worker.php
      - scripts/conformance/nexus-php-workflow-probe.php
      - scripts/conformance/nexus-python-service-worker.py
      - tests/Unit/NexusSdkCallerEvidenceTest.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-callers-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  callers:
    name: SDK client admissions and PHP/Python caller workflows
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DW_SERVER_IMAGE: durableworkflow/server@sha256:5e0d2dc34f6199f4b01b77874e046c173d9697499f647cc0e9ca543ea89bee7c
      DW_SERVER_VERSION: 2.5.22
      DW_WORKFLOW_PHP_VERSION: 2.5.11
      DW_PHP_SDK_VERSION: 2.3.0-rc.1
      DW_PYTHON_SDK_VERSION: 2.6.0rc2
      DW_CLI_VERSION: 2.2.3
      DW_WATERLINE_VERSION: 2.9.1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Reject false execution evidence
        run: node --test tests/Unit/NexusSdkCallerEvidenceTest.mjs
      - name: Execute the frozen published client and service pairs
        shell: bash
        env:
          DW_NEXUS_RESULT_DIR: ${{ runner.temp }}/nexus-proof
          DW_NEXUS_RUN_ROOT: ${{ runner.temp }}/nexus-run
        run: |
          set -euo pipefail
          mkdir -p "$DW_NEXUS_RESULT_DIR"
          # The complete Nexus suite remains non-passing until caller workflows
          # and durable terminal service outcomes have actually been executed.
          set +e
          scripts/conformance/nexus-published-artifacts.sh
          result=$?
          set -e
          printf '%s\n' "$result" > "$DW_NEXUS_RESULT_DIR/complete-suite-exit-code.txt"
          NEXUS_SDK_CLIENT_MATRIX="$DW_NEXUS_RESULT_DIR/nexus-sdk-client-matrix.json" \
            NEXUS_CONFORMANCE_RESULT="$DW_NEXUS_RESULT_DIR/nexus-conformance-result.json" \
            NEXUS_PYTHON_WORKFLOW_PROBE="$DW_NEXUS_RESULT_DIR/nexus-python-workflow-probe.json" \
            NEXUS_PHP_WORKFLOW_PROBE="$DW_NEXUS_RESULT_DIR/nexus-php-workflow-probe.json" \
            NEXUS_PHP_PHP_WORKFLOW_PROBE="$DW_NEXUS_RESULT_DIR/nexus-php-php-workflow-probe.json" \
            NEXUS_PYTHON_PYTHON_WORKFLOW_PROBE="$DW_NEXUS_RESULT_DIR/nexus-python-python-workflow-probe.json" \
            NEXUS_TYPED_FAILURE_PROBES="$DW_NEXUS_RESULT_DIR/nexus-typed-failure-probes.json" \
            NEXUS_CANCELLATION_PROBES="$DW_NEXUS_RESULT_DIR/nexus-cancellation-probes.json" \
            node --test tests/Unit/NexusSdkCallerEvidenceTest.mjs
      - name: Retain actual requests and durable observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nexus-sdk-callers-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nexus-proof
          if-no-files-found: error
          retention-days: 30
