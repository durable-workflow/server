---
apiVersion: v1
kind: Namespace
metadata:
  name: durable-workflow
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: durable-workflow
spec:
  selector:
    app.kubernetes.io/name: durable-workflow-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: durable-workflow-mysql
  namespace: durable-workflow
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: durable-workflow-mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: durable-workflow-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: durable_workflow
            - name: MYSQL_USER
              value: durable_workflow
            - name: MYSQL_PASSWORD
              value: durable_workflow
            - name: MYSQL_ROOT_PASSWORD
              value: durable_workflow
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  mysqladmin ping -h 127.0.0.1 -u$MYSQL_USER
                  -p$MYSQL_PASSWORD --silent
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: durable-workflow
spec:
  selector:
    app.kubernetes.io/name: durable-workflow-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: durable-workflow-redis
  namespace: durable-workflow
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: durable-workflow-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: durable-workflow-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
