[package]
name = "server-parity-query-authority-client"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
durable-workflow = "=3.5.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }

[profile.dev]
debug = 0
incremental = false

