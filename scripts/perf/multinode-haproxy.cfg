# Round-robin over the three native nodes. A node that stops answering health
# checks is taken out within two seconds and returns when it answers again.
# A request that could not connect to a node never reached it, so it is
# retried on another node, as a production balancer does. A request a node
# accepted and then dropped when it was killed is never retried here: it fails
# back to its client, which owns that retry.
global
    log stdout format raw local0 info

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 1s

defaults
    mode http
    log global
    # One line per request: the evidence that stale completions were refused.
    option httplog
    timeout connect 2s
    # Long polls hold for up to 30 seconds.
    timeout client 75s
    timeout server 75s
    # The default retry-on is conn-failure only.
    retries 3
    option redispatch 1

frontend api
    bind :8080
    default_backend natives

backend natives
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    default-server inter 1s fall 2 rise 2 resolvers docker init-addr none
    server native-1 native-1:8080 check
    server native-2 native-2:8080 check
    server native-3 native-3:8080 check
