# Versioned development comparison profile for Server #325.
# Use a unique explicit Compose project. All durable data is disposable.
services:
  mysql:
    image: mysql@sha256:679e7e924f38a3cbb62a3d7df32924b83f7321a602d3f9f967c01b3df18495d6
    platform: linux/amd64
    environment:
      MYSQL_DATABASE: durable_workflow
      MYSQL_USER: workflow
      MYSQL_PASSWORD: port-mysql
      MYSQL_ROOT_PASSWORD: port-root
    command: ["--innodb-flush-log-at-trx-commit=1", "--sync-binlog=1"]
    volumes: [mysql-data:/var/lib/mysql]
    cpus: 1.0
    mem_limit: 1024m
    memswap_limit: 1024m
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=port-mysql mysqladmin ping --silent -h 127.0.0.1 -u workflow"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis@sha256:0637954999d01b7c9ce9167db2da50656e2590d3b884f1c600c5f63bb6e6773c
    platform: linux/amd64
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "", "--requirepass", "port-redis"]
    volumes: [redis-data:/data]
    cpus: 0.25
    mem_limit: 256m
    memswap_limit: 256m
    restart: "no"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "port-redis", "--no-auth-warning", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  bootstrap:
    image: &php_image durableworkflow/server@sha256:4f8edd005e596718185a65f34224ac81cd584a35f540df6bb3d156078c976081
    platform: linux/amd64
    user: "1000:1000"
    command: [server-bootstrap]
    environment: &server_environment
      APP_ENV: local
      APP_DEBUG: "false"
      APP_VERSION: "2.5.13"
      LOG_LEVEL: warning
      DW_SERVER_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      DW_MODE: service
      DW_AUTH_DRIVER: token
      DW_AUTH_TOKEN: port-test-token
      DW_SERVER_PROCESS_CLASS: server_http_node
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: durable_workflow
      DB_USERNAME: workflow
      DB_PASSWORD: port-mysql
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PASSWORD: port-redis
      DW_WORKER_LONG_POLL_MAX_CONCURRENT: "6"
      DW_QUERY_TASK_POLL_MAX_CONCURRENT: "2"
    restart: "no"
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}

  server:
    image: *php_image
    platform: linux/amd64
    user: "1000:1000"
    environment: *server_environment
    cpus: 1.0
    mem_limit: 1024m
    memswap_limit: 1024m
    restart: "no"
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "server-healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 20

  worker:
    image: *php_image
    platform: linux/amd64
    user: "1000:1000"
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--max-time=3600"]
    environment:
      <<: *server_environment
      DW_SERVER_PROCESS_CLASS: worker_node
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 512m
    restart: "no"
    depends_on:
      server: {condition: service_healthy}

  scheduler:
    image: *php_image
    platform: linux/amd64
    user: "1000:1000"
    command: ["sh", "-c", "while true; do php artisan schedule:evaluate --limit=100 --json; php artisan activity:timeout-enforce --limit=100; php artisan external-payloads:cleanup --limit=100 --json; php artisan history:prune --limit=100; sleep 10; done"]
    environment:
      <<: *server_environment
      DW_SERVER_PROCESS_CLASS: scheduler_node
    cpus: 0.25
    mem_limit: 256m
    memswap_limit: 256m
    restart: "no"
    depends_on:
      server: {condition: service_healthy}

  sdk-worker:
    image: *php_image
    platform: linux/amd64
    user: "1000:1000"
    entrypoint: [php]
    working_dir: /source
    command: ["benchmarks/capacity/v1/bindings/php/capacity_adapter.php", "worker"]
    environment: &sdk_environment
      DURABLE_WORKFLOW_RUNTIME_URL: http://server:8080
      DURABLE_WORKFLOW_NAMESPACE: default
      DURABLE_WORKFLOW_TASK_QUEUE: server-port-v1
      DURABLE_WORKFLOW_TOKEN: port-test-token
      DURABLE_WORKFLOW_CAPACITY_CELL: one-activity
      DURABLE_WORKFLOW_WORKER_CONCURRENCY: "1"
    volumes: &sdk_volumes
      - "${DW_PORT_SOURCE_ROOT:?Set the absolute source directory}:/source:ro"
      - "${DW_PORT_SOURCE_ROOT}/scripts/conformance/server-parity/vendor:/source/benchmarks/capacity/v1/bindings/php/vendor:ro"
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 512m
    restart: "no"
    depends_on:
      server: {condition: service_healthy}

  probe:
    image: *php_image
    platform: linux/amd64
    user: "1000:1000"
    entrypoint: [php]
    working_dir: /source
    profiles: [probe]
    command: ["scripts/perf/idle-poll-probe.php", "6", "10", "mixed"]
    environment: *sdk_environment
    volumes: *sdk_volumes
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 512m
    restart: "no"

volumes:
  mysql-data:
  redis-data:
