# Multi-node native qualification: three native nodes share one database
# behind a load balancer, while run-server-port-multinode.sh kills and
# restarts them. Choose exactly one database profile: mysql, postgres or sqlite.
x-native: &native
  stop_signal: SIGTERM
  image: &php_image durableworkflow/server@sha256:944c384c9875fd82637dd2bdea74dcb881cf983a57599ba0e492bec706296549
  platform: linux/amd64
  user: "1000:1000"
  entrypoint: [/native/server]
  environment:
    DW_RUST_EXPERIMENTAL: "1"
    DW_BIND_ADDRESS: 0.0.0.0:8080
    DW_AUTH_DRIVER: token
    DW_AUTH_TOKEN: multinode-test-token
    DW_WORKFLOW_TASK_TIMEOUT: "${DW_MN_WORKFLOW_TASK_TIMEOUT:-60}"
    DB_CONNECTION: "${DW_MN_DB_CONNECTION:?Set the database connection}"
    DB_HOST: "${DW_MN_DB_HOST:-}"
    DB_DATABASE: "${DW_MN_DB_DATABASE:?Set the database}"
    DB_USERNAME: "${DW_MN_DB_USERNAME:-}"
    DB_PASSWORD: "${DW_MN_DB_PASSWORD:-}"
  volumes:
    - "${DW_PORT_NATIVE_BINARY:?Set the absolute native binary path}:/native/server:ro"
    - "${DW_MN_STATE_DIR:?Set the shared state directory}:/state"
  cpus: 1
  mem_limit: 512m
  memswap_limit: 512m
  restart: "no"
  healthcheck:
    test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/api/ready]
    interval: 2s
    timeout: 3s
    retries: 30

x-client: &client
  image: *php_image
  platform: linux/amd64
  user: "1000:1000"
  entrypoint: [php]
  working_dir: /source
  environment: &client_environment
    DURABLE_WORKFLOW_RUNTIME_URL: http://lb:8080
    DURABLE_WORKFLOW_NAMESPACE: default
    DURABLE_WORKFLOW_TASK_QUEUE: multinode
    DURABLE_WORKFLOW_TOKEN: multinode-test-token
    DURABLE_WORKFLOW_CAPACITY_CELL: one-activity
    DURABLE_WORKFLOW_WORKER_CONCURRENCY: "1"
  volumes:
    - "${DW_PORT_SOURCE_ROOT:?Set the absolute source directory}:/source:ro"
    - "${DW_PORT_SDK_ROOT:?Set the normally installed SDK directory}/vendor:/source/benchmarks/capacity/v1/bindings/php/vendor:ro"
  cpus: 0.5
  mem_limit: 512m
  memswap_limit: 512m
  restart: "no"

services:
  mysql:
    profiles: [mysql]
    image: mysql@sha256:679e7e924f38a3cbb62a3d7df32924b83f7321a602d3f9f967c01b3df18495d6
    platform: linux/amd64
    environment:
      MYSQL_DATABASE: durable_workflow
      MYSQL_USER: workflow
      # The driver generates both secrets for each run.
      MYSQL_PASSWORD: ${DW_MN_DB_PASSWORD:?Run through run-server-port-multinode.sh}
      MYSQL_ROOT_PASSWORD: ${DW_MN_DB_ROOT_PASSWORD:?Run through run-server-port-multinode.sh}
    command: ["--innodb-flush-log-at-trx-commit=1", "--sync-binlog=1"]
    cpus: 1
    mem_limit: 1024m
    memswap_limit: 1024m
    restart: "no"
    healthcheck:
      test: [CMD-SHELL, "MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping --silent -h 127.0.0.1 -u workflow"]
      interval: 2s
      timeout: 3s
      retries: 30

  postgres:
    profiles: [postgres]
    image: mirror.gcr.io/library/postgres@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_DB: durable_workflow
      POSTGRES_USER: workflow
      # The driver generates the secret for each run.
      POSTGRES_PASSWORD: ${DW_MN_DB_PASSWORD:?Run through run-server-port-multinode.sh}
    cpus: 1
    mem_limit: 1024m
    memswap_limit: 1024m
    restart: "no"
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U workflow -d durable_workflow"]
      interval: 2s
      timeout: 3s
      retries: 30

  native-1: *native
  native-2: *native
  native-3: *native

  lb:
    image: mirror.gcr.io/library/haproxy@sha256:${DW_MN_HAPROXY_DIGEST:?Set the pinned HAProxy digest}
    user: "1000:1000"
    volumes:
      - "${DW_PORT_SOURCE_ROOT}/scripts/perf/multinode-haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro"
    cpus: 0.5
    mem_limit: 128m
    memswap_limit: 128m
    restart: "no"

  sdk-worker-1:
    <<: *client
    profiles: [clients]
    # A supervisor restarts a worker that exits; the run records each restart.
    restart: on-failure
    stop_signal: SIGTERM
    command: [benchmarks/capacity/v1/bindings/php/capacity_adapter.php, worker]
  sdk-worker-2:
    <<: *client
    profiles: [clients]
    # A supervisor restarts a worker that exits; the run records each restart.
    restart: on-failure
    stop_signal: SIGTERM
    command: [benchmarks/capacity/v1/bindings/php/capacity_adapter.php, worker]
  probe:
    <<: *client
    profiles: [clients]
