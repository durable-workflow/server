# Prospective development comparison. Never enable both runtime profiles in one project.
# The PHP Server roles run the profile's artifacts.php_server (the driver sets
# DW_PORT_PHP_IMAGE; published 2.6.2 when the profile does not name one). The
# SDK client runtime and the binary-mounted native server stay on the 2.6.2
# image, so client cost is unchanged across PHP references.
services:
  mysql:
    image: mysql@sha256:679e7e924f38a3cbb62a3d7df32924b83f7321a602d3f9f967c01b3df18495d6
    platform: linux/amd64
    environment:
      MYSQL_DATABASE: durable_workflow
      MYSQL_USER: workflow
      MYSQL_PASSWORD: port-mysql
      MYSQL_ROOT_PASSWORD: port-root
    command: ["--innodb-flush-log-at-trx-commit=1", "--sync-binlog=1"]
    volumes: [mysql-data:/var/lib/mysql]
    cpus: 1
    mem_limit: 1024m
    memswap_limit: 1024m
    restart: "no"
    healthcheck:
      test: [CMD-SHELL, "MYSQL_PWD=port-mysql mysqladmin ping --silent -h 127.0.0.1 -u workflow"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    profiles: [php]
    image: redis@sha256:0637954999d01b7c9ce9167db2da50656e2590d3b884f1c600c5f63bb6e6773c
    platform: linux/amd64
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec, --save, "", --requirepass, port-redis]
    volumes: [redis-data:/data]
    cpus: 0.25
    mem_limit: 256m
    memswap_limit: 256m
    restart: "no"
    healthcheck:
      test: [CMD, redis-cli, -a, port-redis, --no-auth-warning, ping]
      interval: 2s
      timeout: 3s
      retries: 15

  php-bootstrap:
    profiles: [php]
    image: &php_server_image "${DW_PORT_PHP_IMAGE:-durableworkflow/server@sha256:944c384c9875fd82637dd2bdea74dcb881cf983a57599ba0e492bec706296549}"
    platform: linux/amd64
    user: "1000:1000"
    command: [server-bootstrap]
    environment: &php_environment
      APP_ENV: local
      APP_DEBUG: "false"
      LOG_LEVEL: warning
      DW_SERVER_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      DW_MODE: service
      DW_AUTH_DRIVER: token
      DW_AUTH_TOKEN: port-test-token
      DW_SERVER_PROCESS_CLASS: server_http_node
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: durable_workflow
      DB_USERNAME: workflow
      DB_PASSWORD: port-mysql
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PASSWORD: port-redis
      DW_WORKER_LONG_POLL_MAX_CONCURRENT: "6"
      DW_QUERY_TASK_POLL_MAX_CONCURRENT: "2"
    cpus: 1
    mem_limit: 1024m
    memswap_limit: 1024m
    restart: "no"
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}

  php-server:
    profiles: [php]
    image: *php_server_image
    platform: linux/amd64
    user: "1000:1000"
    environment: *php_environment
    cpus: 1
    mem_limit: 1024m
    memswap_limit: 1024m
    restart: "no"
    depends_on:
      php-bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, server-healthcheck]
      interval: 2s
      timeout: 3s
      retries: 20

  php-worker:
    profiles: [php]
    stop_signal: SIGTERM
    image: *php_server_image
    platform: linux/amd64
    user: "1000:1000"
    command: [php, artisan, "queue:work", --sleep=1, --tries=3, --max-time=0]
    environment:
      <<: *php_environment
      DW_SERVER_PROCESS_CLASS: worker_node
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 512m
    restart: "no"
    depends_on:
      php-server: {condition: service_healthy}

  php-scheduler:
    profiles: [php]
    stop_signal: SIGTERM
    image: *php_server_image
    platform: linux/amd64
    user: "1000:1000"
    command: [sh, -c, "trap 'exit 0' TERM INT; while true; do php artisan schedule:evaluate --limit=100 --json; php artisan activity:timeout-enforce --limit=100; php artisan external-payloads:cleanup --limit=100 --json; php artisan history:prune --limit=100; sleep 10; done"]
    environment:
      <<: *php_environment
      DW_SERVER_PROCESS_CLASS: scheduler_node
    cpus: 0.25
    mem_limit: 256m
    memswap_limit: 256m
    restart: "no"
    depends_on:
      php-server: {condition: service_healthy}

  native-server:
    profiles: [native]
    stop_signal: SIGTERM
    image: &php_image durableworkflow/server@sha256:944c384c9875fd82637dd2bdea74dcb881cf983a57599ba0e492bec706296549
    platform: linux/amd64
    user: "1000:1000"
    entrypoint: [/native/server]
    environment: &native_environment
      DW_RUST_EXPERIMENTAL: "1"
      DW_BIND_ADDRESS: 0.0.0.0:8080
      DW_AUTH_DRIVER: token
      DW_AUTH_TOKEN: port-test-token
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: durable_workflow
      DB_USERNAME: workflow
      DB_PASSWORD: port-mysql
    volumes:
      - "${DW_PORT_NATIVE_BINARY:-/dev/null}:/native/server:ro"
    cpus: 2
    mem_limit: 2048m
    memswap_limit: 2048m
    restart: "no"
    depends_on:
      mysql: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/api/ready]
      interval: 2s
      timeout: 3s
      retries: 20

  # The published native image, by digest, as an operator runs it: its own
  # entrypoint, user and maintenance loop, with native-server's settings and
  # limits. Select it with the native-image implementation; it never runs
  # beside native-server. The image has bash but no curl, so readiness is a
  # plain GET over bash's /dev/tcp.
  native-image-server:
    profiles: [native-image]
    stop_signal: SIGTERM
    image: "${DW_PORT_NATIVE_IMAGE:-unset-native-image}"
    platform: linux/amd64
    environment: *native_environment
    cpus: 2
    mem_limit: 2048m
    memswap_limit: 2048m
    restart: "no"
    depends_on:
      mysql: {condition: service_healthy}
    healthcheck:
      test: [CMD, bash, -c, "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/ready HTTP/1.0\r\n\r\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 2s
      timeout: 3s
      retries: 20

  sdk-worker:
    profiles: [clients]
    stop_signal: SIGTERM
    image: *php_image
    platform: linux/amd64
    user: "1000:1000"
    entrypoint: [php]
    working_dir: /source
    command: [benchmarks/capacity/v1/bindings/php/capacity_adapter.php, worker]
    environment: &sdk_environment
      DURABLE_WORKFLOW_RUNTIME_URL: "${DW_PORT_RUNTIME_URL:?Select php-server or native-server URL}"
      DURABLE_WORKFLOW_NAMESPACE: default
      DURABLE_WORKFLOW_TASK_QUEUE: server-port-v2
      DURABLE_WORKFLOW_TOKEN: port-test-token
      DURABLE_WORKFLOW_CAPACITY_CELL: one-activity
      DURABLE_WORKFLOW_WORKER_CONCURRENCY: "1"
    volumes: &sdk_volumes
      - "${DW_PORT_SOURCE_ROOT:?Set the absolute source directory}:/source:ro"
      - "${DW_PORT_SDK_ROOT:?Set the normally installed SDK directory}/vendor:/source/benchmarks/capacity/v1/bindings/php/vendor:ro"
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 512m
    restart: "no"

  probe:
    profiles: [clients]
    image: *php_image
    platform: linux/amd64
    user: "1000:1000"
    entrypoint: [php]
    working_dir: /source
    environment: *sdk_environment
    volumes: *sdk_volumes
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 512m
    restart: "no"

volumes:
  mysql-data:
  redis-data:
