        propertyName: task_kind
        mapping:
          workflow: "#/components/schemas/WorkflowTask"
          update_validation: "#/components/schemas/UpdateValidationTask"
    WorkflowTask:
      type: object
      additionalProperties: true
      required: [task_kind, task_id, workflow_id, run_id, workflow_task_attempt, history_events, lease_owner, lease_expires_at]
      properties:
        task_kind: { type: string, const: workflow }
        task_id: { type: string, minLength: 1 }
        workflow_id: { type: string, minLength: 1 }
        run_id: { type: string, minLength: 1 }
        workflow_task_attempt: { type: integer, minimum: 1 }
        lease_owner: { type: string, minLength: 1 }
        lease_expires_at: { type: string, format: date-time }
        history_events: { type: array, items: { $ref: "#/components/schemas/WorkerHistoryEvent" } }
        cancellation_request:
          $ref: "#/components/schemas/CooperativeCancellationRequest"
