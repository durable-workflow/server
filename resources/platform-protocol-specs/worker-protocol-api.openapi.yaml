openapi: 3.1.0
info:
  title: durable-workflow.v2.worker-protocol-api
  version: "29"
  summary: Durable Workflow worker-plane HTTP+JSON API
  description: >
    Normative OpenAPI specification for the worker-plane HTTP+JSON API:
    worker registration, graceful worker deregistration, worker heartbeat,
    worker-session lifecycle,
    long-poll task acquisition, task history paging, task heartbeat,
    task completion, and task failure. Long-poll timing, cancellation,
    and lease semantics are specified by durable-workflow.v2.worker-protocol-stream.
    The server advertises its current 1.N version and accepts request headers
    from the same major whose minor is less than or equal to N.
x-durable-workflow-worker-protocol-negotiation:
  advertised_version_path: worker_protocol.version
  default_advertised_version: "1.19"
  request_header_rule: same_major_and_minor_less_than_or_equal_to_advertised
  accepted_request_versions_by_default: ["1.0", "1.1", "1.2", "1.3", "1.4", "1.5", "1.6", "1.7", "1.8", "1.9", "1.10", "1.11", "1.12", "1.13", "1.14", "1.15", "1.16", "1.17", "1.18", "1.19"]
  response_version: advertised_version
  fail_closed_on: [missing_header, malformed_version, different_major, minor_greater_than_advertised]
x-durable-workflow-catalog-entry: worker_protocol_api
x-durable-workflow-catalog-schema: durable-workflow.v2.platform-protocol-specs.catalog
x-durable-workflow-catalog-version: 16
x-durable-workflow-evolution-rule: additive_minor_breaking_major
x-durable-workflow-cooperative-cancellation-contract:
  minimum_protocol_version: "1.20"
  worker_capability: cooperative_cancellation
  request_operation: POST /workflows/{workflowId}/request-cancellation
  observation_field: cancellation_request
  observation_surfaces: [workflow_task_claim, successful_workflow_task_heartbeat]
  delivery_operation: POST /worker/workflow-tasks/{taskId}/deliver-cancellation
  canonical_history_event: CooperativeCancellationDelivered
  delivery_identity: [request_id, sequence, call_kind, sequence_span, operation_sequence, operation_sequence_span]
  pending_child_delivery: { status: 200, delivered: false, reason: cancellation_waiting_for_child, claim_released: true, canonical_delivery_recorded: false, resume_source: child_terminal_history }
  child_operation_policies: [try_cancel, wait_cancellation_completed, abandon]
  cooperative_parent_close_policy: request_cancellation
  legacy_terminal_parent_close_policy: request_cancel
  child_policy_admission: [server_protocol, request_protocol, immutable_worker_claim_capability, installed_runtime_child_policy]
  unsupported_child_policy: { status: 409, reason: child_cancellation_policy_not_supported, recorded: false }
  claim_proof: immutable_registration_snapshot_bound_to_task_run_owner_and_attempt
  request_against_incompatible_active_claim: { status: 409, reason: active_claim_cancellation_not_supported, history_appended: false }
  request_claim_race: serialized_on_workflow_run_lock
  prior_completed_calls: replay_normally_before_canonical_delivery_boundary
  cleanup_deadline: immutable_original_request_deadline
  cleanup_completion: cancelled_with_original_request_id
  terminal_cancel_and_terminate: unchanged
x-durable-workflow-prepared-local-activity-contract:
  status: candidate
  minimum_protocol_version: "1.20"
  worker_capabilities: [cooperative_cancellation, prepared_local_activities]
  backend_role: Workflow\V2\Contracts\PreparedLocalActivityTaskBridge
  advertised_support: configured_protocol_and_actual_bound_optional_role
  preparation: canonical_scheduled_and_started_commit_before_callback_admission
  prefix: ordinary_command_validation_authorization_and_quota_with_retained_claim
  supervisor: original_issued_claim_bound_to_namespace_task_run_owner_epoch_and_attempt
  renewal: atomic_workflow_and_local_attempt_leases_without_application_heartbeat
  application_heartbeat: canonical_progress_and_heartbeat_timeout_without_lease_renewal
  shielded_cleanup: canonical_request_and_delivery_identity_with_runtime_owned_original_deadline
  cancellation: original_root_identity_and_deadline_without_releasing_cleanup_claim
  stop_acknowledgement: original_supervisor_reports_only_after_callback_is_stopped_and_joined
  expired_callback_stop: unknown_until_original_supervisor_reports_join
  retry: durable_workflow_task_backoff_and_original_total_deadline
  outcome: immutable_duplicate_receipt_and_stale_publication_refusal
  history_refresh_page_token: opaque_cursor_from_first_event_with_current_claim_authority_still_required
  storage_draining: existing_issued_claim_may_finish_and_report_join
  storage_fenced: all_seven_local_mutation_endpoints_refused_before_handler
  published_protocol_1_19: unchanged
x-durable-workflow-message-streams-contract:
  discovery_path: /cluster/info#/message_streams_contract
  minimum_protocol_version: "1.15"
  worker_capability: message_streams
  completion_fields: [message_stream_cursors, message_stream_waits]
  cursor_advancement: highest_contiguous_consumed_position
  replay_identity: [stream_name, message_id, position]
  payload_envelope:
    field: payload_envelope
    worker_delivery: inline_avro_blob
    persistence: exact_inline_bytes_or_external_storage_reference
  version_gate:
    workers_below_minimum:
      advertise_capability: forbidden
      submit_completion_fields: forbidden
    workers_at_or_above_minimum:
      advertise_capability: allowed
      submit_completion_fields: allowed
    rejection_status: 409
    rejection_reason: message_streams_unavailable
x-durable-workflow-workflow-memo-update-contract:
  minimum_protocol_version: "1.14"
  worker_capability: memo_upserts
  capability_enforcement:
    registration_below_floor: { status: 409, reason: workflow_metadata_capability_protocol_mismatch }
    completion_without_capability: { status: 409, reason: workflow_metadata_capability_not_advertised, recorded: false }
    replay_routing: requires_active_lease_owner_registration_capability
    protocol_and_capability_checks: independent
  command:
    type: upsert_memo
    required_fields: [type, entries]
    entries: payload-envelope<avro-map<string, Value|null>>
  merge: replace_named_keys_delete_null_preserve_others
  canonical_order: lexicographic_key_order
  structural_limits:
    max_entries_per_run: 100
    max_value_size_bytes: 10240
    max_total_size_bytes: 65536
    size_measurement: avro_single_object_bytes
    runtime_configured_total_limit: workflows.v2.structural_limits.memo_size_bytes
  validation_failures:
    invalid_command: { status: 422, reason: workflow_memo_validation_failed, recorded: false }
    configured_limit: { status: 422, reason: structural_limit_exceeded, recorded: false }
    unsupported_runtime: { status: 409, reason: workflow_memo_updates_unavailable, recorded: false }
  history_event:
    type: MemoUpserted
    required_fields: [sequence, entries, merged]
    replay_identity: [sequence, entries]
  task_fence: [workflow_task_id, workflow_task_attempt]
  duplicate_completion: does_not_append_or_apply
  continue_as_new: merged_memo_is_inherited
  external_payload_resolution_owner: runtime
  sdk_storage_drivers: false
  published_artifact_conformance:
    worker_languages: [php, python, rust]
    runtime_targets: [standalone_server, managed_cloud]
    required_observations:
      - capability_discovered
      - memo_update_completed
      - waiting_describe_merged
      - completed_describe_merged
      - replay_does_not_duplicate
x-durable-workflow-typed-search-attributes-contract:
  minimum_protocol_version: "1.16"
  worker_capability: typed_search_attributes
  capability_enforcement:
    registration_below_floor: { status: 409, reason: workflow_metadata_capability_protocol_mismatch }
    explicit_completion_without_capability: { status: 409, reason: workflow_metadata_capability_not_advertised, recorded: false }
    typed_history_routing: requires_active_lease_owner_registration_capability
    legacy_untyped_history_routing: capability_not_required
    protocol_and_capability_checks: independent
  canonical_type_names: [string, keyword, keyword_list, int, float, bool, datetime]
  completion_field: commands[].attribute_types
  declaration_identity: [key, canonical_type, json_value]
  server_boundary:
    validate: [declared_key, declared_type, declared_value, namespace_registered_type]
    malformed_or_conflicting_declaration_status: 422
    malformed_or_conflicting_declaration_reason: validation_failed
    inference_after_invalid_declaration: forbidden
  history:
    event_type: SearchAttributesUpserted
    payload_field: attribute_types
    new_event_rule: canonical_effective_type_required_for_every_non_deleted_attribute
    full_and_paginated_history: identical
    replay_identity: [sequence, attributes, attribute_types]
    legacy_missing_metadata: unknown_type_identity_compare_value_only
  version_gate:
    workers_below_minimum:
      submit_attribute_types: forbidden
    workers_at_or_above_minimum:
      submit_attribute_types: allowed
    rejection_status: 409
    rejection_reason: typed_search_attributes_unavailable
x-durable-workflow-condition-wait-occurrence-identity-contract:
  minimum_protocol_version: "1.17"
  command:
    type: open_condition_wait
    field: condition_wait_occurrence_id
  authoring_gate:
    workers_below_minimum: forbidden
    rejection_status: 409
    rejection_reason: condition_wait_occurrence_identity_unavailable
    recorded: false
  replay_gate:
    history_with_occurrence_identity: requires_minimum_worker_protocol_version
    history_without_occurrence_identity: compatible_older_workers_allowed
    applies_to: [cold_replay, cached_poll, redelivery]
  history:
    field: condition_wait_occurrence_id
    event_types: [ConditionWaitOpened, ConditionWaitSatisfied, ConditionWaitTimedOut, TimerScheduled, TimerFired, TimerCancelled]
  version_independence:
    server_below_minimum_rejects_worker_1_17: ahead_request_version
    server_at_minimum_accepts_worker_1_16_for_unaffected_history: true
x-durable-workflow-portable-worker-affinity-contract:
  minimum_protocol_version: "1.18"
  worker_capabilities: [local_activities, worker_sessions, sticky_execution]
  capability_manifest:
    required_feature_entries: [local_activities, worker_sessions, sticky_execution]
    supported_entry_must_match_flat_capability: true
  local_activities:
    command_type: record_local_activity
    attempt_reports_required_from_protocol_version: "1.19"
    retained_nested_object_unknown_fields: ignore
    strict_nested_object_shape_from_protocol_version: "1.19"
    attempt_sequence: contiguous_one_based
    maximum_attempts: 100
    maximum_heartbeats_per_attempt: 1000
    maximum_total_heartbeats: 1000
    terminal_attempt_outcome: matches_command_outcome
    non_final_outcomes: [failed, timed_out]
    durable_attempt_id_authority: server
    worker_attempt_id_preserved: true
    replay: recorded_terminal_side_effect_is_reused_without_execution
  worker_sessions:
    lifecycle_verbs: [create, heartbeat, close]
    holder_loss: replacement_worker_reacquires_and_rebuilds_process_local_state
  sticky_execution:
    cache_owner: worker_process
    cache_key_fields: [workflow_id, run_id, build_id]
    correctness_fallback: cold_replay
  version_gate:
    workers_below_minimum:
      advertise_capabilities: forbidden
      submit_portable_affinity_fields: forbidden
    workers_at_or_above_minimum:
      advertise_only_implemented_capabilities: required
    rejection_status: 409
    recorded: false
x-durable-workflow-object-families:
  - name: worker_registration_request
    owner_repo: durable-workflow/server
  - name: worker_deregistration_result
    owner_repo: durable-workflow/server
  - name: worker_task_poll_request
    owner_repo: durable-workflow/server
  - name: worker_task_result
    owner_repo: durable-workflow/server
  - name: worker_query_task_poll_request
    owner_repo: durable-workflow/server
  - name: worker_query_task_result
    owner_repo: durable-workflow/server
  - name: external_task_input_contract
    owner_repo: durable-workflow/server
  - name: external_task_result_contract
    owner_repo: durable-workflow/server
servers:
  - url: /api
security:
  - durableWorkerAuth: []
paths:
  /worker/register:
    post:
      operationId: registerWorker
      tags: [worker-lifecycle]
      parameters: [{ $ref: "#/components/parameters/WorkerProtocolVersionHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkerRegistrationRequest" }
      responses:
        "201": { $ref: "#/components/responses/WorkerRegistrationEnvelope" }
        "400": { $ref: "#/components/responses/WorkerError" }
        "409": { $ref: "#/components/responses/WorkerRegistrationFailure" }
        "422": { $ref: "#/components/responses/WorkerError" }
        "503": { $ref: "#/components/responses/WorkerServiceUnavailable" }
  /worker/registrations/{workerId}:
    delete:
      operationId: deregisterWorker
      summary: Gracefully deregister a worker
      description: >
        Removes the named worker registration in the resolved namespace and
        recovers its outstanding workflow-task leases for replacement workers.
        This worker-plane lifecycle operation requires the worker role; it is
        distinct from the administrator-only worker-management endpoint.
      tags: [worker-lifecycle]
      x-durable-workflow-required-role: worker
      parameters:
        - $ref: "#/components/parameters/WorkerProtocolVersionHeader"
        - $ref: "#/components/parameters/WorkerIdPath"
      responses:
        "200": { $ref: "#/components/responses/WorkerDeregistrationEnvelope" }
        "400": { $ref: "#/components/responses/WorkerError" }
        "401": { $ref: "#/components/responses/WorkerError" }
        "403": { $ref: "#/components/responses/WorkerError" }
        "404": { $ref: "#/components/responses/WorkerError" }
        "409": { $ref: "#/components/responses/WorkerError" }
  /worker/heartbeat:
    post:
      operationId: heartbeatWorker
      tags: [worker-lifecycle]
      parameters: [{ $ref: "#/components/parameters/WorkerProtocolVersionHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkerHeartbeatRequest" }
      responses:
        "200": { $ref: "#/components/responses/WorkerEnvelope" }
        "404": { $ref: "#/components/responses/WorkerError" }
        "503": { $ref: "#/components/responses/WorkerServiceUnavailable" }
  /worker/sessions:
    post:
      operationId: createWorkerSession
      tags: [worker-sessions]
      parameters: [{ $ref: "#/components/parameters/WorkerProtocolVersionHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./worker-sessions-runtime.schema.json#/$defs/workerSessionCreateRequest" }
      responses:
        "200": { $ref: "#/components/responses/WorkerSessionOperation" }
        "201": { $ref: "#/components/responses/WorkerSessionOperation" }
        "409": { $ref: "#/components/responses/WorkerError" }
        "412": { $ref: "#/components/responses/WorkerError" }
        "422": { $ref: "#/components/responses/WorkerError" }
  /worker/sessions/{sessionId}/heartbeat:
    post:
      operationId: heartbeatWorkerSession
      tags: [worker-sessions]
      parameters:
        - $ref: "#/components/parameters/WorkerProtocolVersionHeader"
        - $ref: "#/components/parameters/SessionIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./worker-sessions-runtime.schema.json#/$defs/workerSessionHeartbeatRequest" }
      responses:
        "200": { $ref: "#/components/responses/WorkerSessionOperation" }
        "404": { $ref: "#/components/responses/WorkerError" }
        "409": { $ref: "#/components/responses/WorkerError" }
  /worker/sessions/{sessionId}:
    delete:
      operationId: closeWorkerSession
      tags: [worker-sessions]
      parameters:
        - $ref: "#/components/parameters/WorkerProtocolVersionHeader"
        - $ref: "#/components/parameters/SessionIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./worker-sessions-runtime.schema.json#/$defs/workerSessionCloseRequest" }
      responses:
        "200": { $ref: "#/components/responses/WorkerSessionOperation" }
        "404": { $ref: "#/components/responses/WorkerError" }
        "409": { $ref: "#/components/responses/WorkerError" }
  /worker/workflow-tasks/poll:
    post:
      operationId: pollWorkflowTask
      tags: [workflow-tasks]
      parameters: [{ $ref: "#/components/parameters/WorkerProtocolVersionHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowTaskPollRequest" }
      responses:
        "200":
          description: A claimed workflow task, an empty long-poll result, or a draining-worker response.
          headers: { X-Durable-Workflow-Protocol-Version: { schema: { $ref: "#/components/schemas/AdvertisedWorkerProtocolVersion" } } }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowTaskPollResponse"
        "400": { $ref: "#/components/responses/WorkerError" }
        "429": { $ref: "#/components/responses/WorkerPollBackpressure" }
        "409": { $ref: "#/components/responses/WorkflowTaskPollConflict" }
        "422": { $ref: "#/components/responses/WorkerError" }
        "503": { $ref: "#/components/responses/WorkerServiceUnavailable" }
  /worker/workflow-tasks/{taskId}/history:
    post:
      operationId: getWorkflowTaskHistoryPage
      tags: [workflow-tasks]
      parameters:
        - $ref: "#/components/parameters/WorkerProtocolVersionHeader"
        - $ref: "#/components/parameters/TaskIdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HistoryPageRequest" }
      responses:
        "200": { $ref: "#/components/responses/WorkerEnvelope" }
        "404": { $ref: "#/components/responses/WorkerError" }
        "409": { $ref: "#/components/responses/WorkerError" }
  /worker/workflow-tasks/{taskId}/heartbeat:
    post:
      operationId: heartbeatWorkflowTask
      tags: [workflow-tasks]
      parameters:
        - $ref: "#/components/parameters/WorkerProtocolVersionHeader"
        - $ref: "#/components/parameters/TaskIdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowTaskHeartbeatRequest" }
      responses:
        "200":
          description: Lease renewal with optional durable cancellation observation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowTaskHeartbeatResponse" }
        "404": { $ref: "#/components/responses/WorkerError" }
        "409": { $ref: "#/components/responses/WorkerError" }
        "503": { $ref: "#/components/responses/WorkerServiceUnavailable" }
  /worker/workflow-tasks/{taskId}/deliver-cancellation:
    post:
      operationId: deliverWorkflowCancellation
      tags: [workflow-tasks]
      x-durable-workflow-minimum-protocol-version: "1.20"
      x-durable-workflow-worker-capability: cooperative_cancellation
      parameters:
        - $ref: "#/components/parameters/WorkerProtocolVersionHeader"
        - $ref: "#/components/parameters/TaskIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CooperativeCancellationDeliveryRequest" }
      responses:
        "200":
          description: Canonical delivery committed, an identical acknowledgment retried, or child cancellation completion still pending.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CooperativeCancellationDeliveryResponse" }
        "404": { $ref: "#/components/responses/WorkerError" }
        "409": { $ref: "#/components/responses/WorkerError" }
        "422": { $ref: "#/components/responses/WorkerError" }
  /worker/workflow-tasks/{taskId}/local-activities/prepare:
    post:
      operationId: prepareLocalActivity
      tags: [workflow-tasks]
      x-durable-workflow-minimum-protocol-version: "1.20"
      x-durable-workflow-worker-capability: prepared_local_activities
      description: >-
        Commit callback admission before application code starts. Retry an identical preparation with the same workflow claim and SDK attempt nonce.
      parameters:
        - $ref: "#/components/parameters/WorkerProtocolVersionHeader"
        - $ref: "#/components/parameters/TaskIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PreparedLocalPrepareRequest" }
      responses:
        "200":
          description: The durable prepare result.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/WorkerEnvelope"
                  - $ref: "#/components/schemas/PreparedLocalPreparationResult"
        "404": { $ref: "#/components/responses/WorkerError" }
        "409": { $ref: "#/components/responses/WorkerError" }
        "422": { $ref: "#/components/responses/WorkerError" }
        "429": { $ref: "#/components/responses/WorkerError" }
        "503": { $ref: "#/components/responses/WorkerServiceUnavailable" }
  /worker/workflow-tasks/{taskId}/local-activities/checkpoint:
    post:
      operationId: checkpointLocalActivityPrefix
      tags: [workflow-tasks]
      x-durable-workflow-minimum-protocol-version: "1.20"
      x-durable-workflow-worker-capability: prepared_local_activities
      description: >-
        Commit the preceding command prefix using ordinary completion validation, authorization and quota. Retain the hosting claim. Checkpoint commit grants no callback admission.
      parameters:
        - $ref: "#/components/parameters/WorkerProtocolVersionHeader"
        - $ref: "#/components/parameters/TaskIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PreparedLocalCheckpointRequest" }
      responses:
        "200":
          description: The durable checkpoint result.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/WorkerEnvelope"
                  - $ref: "#/components/schemas/PreparedLocalCheckpointResult"
        "404": { $ref: "#/components/responses/WorkerError" }
        "409": { $ref: "#/components/responses/WorkerError" }
        "422": { $ref: "#/components/responses/WorkerError" }
        "429": { $ref: "#/components/responses/WorkerError" }
        "503": { $ref: "#/components/responses/WorkerServiceUnavailable" }
  /worker/workflow-tasks/{taskId}/local-activities/recover:
    post:
      operationId: recoverLocalActivity
      tags: [workflow-tasks]
      x-durable-workflow-minimum-protocol-version: "1.20"
      x-durable-workflow-worker-capability: prepared_local_activities
      description: >-
        A replacement workflow claim recovers an expired original local attempt. Durable recovery records callback stop as unknown and preserves the original total timeout budget.
      parameters:
        - $ref: "#/components/parameters/WorkerProtocolVersionHeader"
        - $ref: "#/components/parameters/TaskIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PreparedLocalRecoverRequest" }
      responses:
        "200":
          description: The durable recover result.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/WorkerEnvelope"
                  - $ref: "#/components/schemas/PreparedLocalRecoveryResult"
        "404": { $ref: "#/components/responses/WorkerError" }
        "409": { $ref: "#/components/responses/WorkerError" }
        "422": { $ref: "#/components/responses/WorkerError" }
        "429": { $ref: "#/components/responses/WorkerError" }
        "503": { $ref: "#/components/responses/WorkerServiceUnavailable" }
  /worker/workflow-tasks/{taskId}/local-activities/{attemptId}/control:
    post:
      operationId: controlLocalActivity
      tags: [workflow-tasks]
      x-durable-workflow-minimum-protocol-version: "1.20"
      x-durable-workflow-worker-capability: prepared_local_activities
      description: >-
        Observe the original local attempt and optionally renew both workflow and attempt leases atomically. No application heartbeat is recorded. Accepted cancellation returns its original identity and deadline even after workflow claim takeover.
      parameters:
        - $ref: "#/components/parameters/WorkerProtocolVersionHeader"
        - $ref: "#/components/parameters/TaskIdPath"
        - $ref: "#/components/parameters/PreparedLocalAttemptIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PreparedLocalControlRequest" }
      responses:
        "200":
          description: The durable control result.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/WorkerEnvelope"
                  - $ref: "#/components/schemas/PreparedLocalControlResult"
        "404": { $ref: "#/components/responses/WorkerError" }
        "409": { $ref: "#/components/responses/WorkerError" }
        "422": { $ref: "#/components/responses/WorkerError" }
        "429": { $ref: "#/components/responses/WorkerError" }
        "503": { $ref: "#/components/responses/WorkerServiceUnavailable" }
  /worker/workflow-tasks/{taskId}/local-activities/{attemptId}/heartbeat:
    post:
      operationId: heartbeatLocalActivity
      tags: [workflow-tasks]
      x-durable-workflow-minimum-protocol-version: "1.20"
      x-durable-workflow-worker-capability: prepared_local_activities
      description: >-
        Record an application heartbeat and bounded progress under the original prepared claim. Update the heartbeat timeout without renewing either lease or moving fixed execution or root cleanup deadlines. Stale workers can observe cancellation but cannot record a heartbeat.
      parameters:
        - $ref: "#/components/parameters/WorkerProtocolVersionHeader"
        - $ref: "#/components/parameters/TaskIdPath"
        - $ref: "#/components/parameters/PreparedLocalAttemptIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PreparedLocalHeartbeatRequest" }
      responses:
        "200":
          description: The durable heartbeat or stop result.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/WorkerEnvelope"
                  - $ref: "#/components/schemas/PreparedLocalControlResult"
        "404": { $ref: "#/components/responses/WorkerError" }
        "409": { $ref: "#/components/responses/WorkerError" }
        "422": { $ref: "#/components/responses/WorkerError" }
        "429": { $ref: "#/components/responses/WorkerError" }
        "503": { $ref: "#/components/responses/WorkerServiceUnavailable" }
  /worker/workflow-tasks/{taskId}/local-activities/{attemptId}/outcome:
    post:
      operationId: recordLocalActivityOutcome
      tags: [workflow-tasks]
      x-durable-workflow-minimum-protocol-version: "1.20"
      x-durable-workflow-worker-capability: prepared_local_activities
      description: >-
        Commit an original callback outcome under its issued authority. An identical committed receipt remains readable after takeover. A stale worker cannot publish a fresh result.
      parameters:
        - $ref: "#/components/parameters/WorkerProtocolVersionHeader"
        - $ref: "#/components/parameters/TaskIdPath"
        - $ref: "#/components/parameters/PreparedLocalAttemptIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PreparedLocalOutcomeRequest" }
      responses:
        "200":
          description: The durable outcome result.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/WorkerEnvelope"
                  - $ref: "#/components/schemas/PreparedLocalOutcomeResult"
        "404": { $ref: "#/components/responses/WorkerError" }
        "409": { $ref: "#/components/responses/WorkerError" }
        "422": { $ref: "#/components/responses/WorkerError" }
        "429": { $ref: "#/components/responses/WorkerError" }
        "503": { $ref: "#/components/responses/WorkerServiceUnavailable" }
  /worker/workflow-tasks/{taskId}/local-activities/{attemptId}/acknowledge-cancellation:
    post:
      operationId: acknowledgeLocalActivityCancellation
      tags: [workflow-tasks]
      x-durable-workflow-minimum-protocol-version: "1.20"
      x-durable-workflow-worker-capability: prepared_local_activities
      description: >-
        Report only after the original supervisor has stopped and joined the callback. A surviving supervisor may report after registration drain or claim takeover without gaining result or lease authority.
      parameters:
        - $ref: "#/components/parameters/WorkerProtocolVersionHeader"
        - $ref: "#/components/parameters/TaskIdPath"
        - $ref: "#/components/parameters/PreparedLocalAttemptIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PreparedLocalStopRequest" }
      responses:
        "200":
          description: The durable acknowledge-cancellation result.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/WorkerEnvelope"
                  - $ref: "#/components/schemas/PreparedLocalStopResult"
        "404": { $ref: "#/components/responses/WorkerError" }
        "409": { $ref: "#/components/responses/WorkerError" }
        "422": { $ref: "#/components/responses/WorkerError" }
        "429": { $ref: "#/components/responses/WorkerError" }
        "503": { $ref: "#/components/responses/WorkerServiceUnavailable" }
  /worker/workflow-tasks/{taskId}/complete:
    post:
      operationId: completeWorkflowTask
      tags: [workflow-tasks]
      parameters:
        - $ref: "#/components/parameters/WorkerProtocolVersionHeader"
        - $ref: "#/components/parameters/TaskIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowTaskCompleteRequest" }
      responses:
        "200": { $ref: "#/components/responses/WorkflowTaskCompletion" }
        "409": { $ref: "#/components/responses/WorkflowTaskCompletionFailure" }
        "422": { $ref: "#/components/responses/WorkerError" }
  /worker/workflow-tasks/{taskId}/fail:
    post:
      operationId: failWorkflowTask
      tags: [workflow-tasks]
      parameters:
        - $ref: "#/components/parameters/WorkerProtocolVersionHeader"
        - $ref: "#/components/parameters/TaskIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskFailureRequest" }
      responses:
        "200": { $ref: "#/components/responses/WorkerEnvelope" }
        "409": { $ref: "#/components/responses/WorkerError" }
  /worker/update-validation-tasks/poll:
    post:
      operationId: pollUpdateValidationTask
      tags: [update-validation-tasks]
      parameters: [{ $ref: "#/components/parameters/WorkerProtocolVersionHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateValidationTaskPollRequest" }
      responses:
        "200":
          description: A claimed update-validation task or an empty long-poll result.
          headers: { X-Durable-Workflow-Protocol-Version: { schema: { $ref: "#/components/schemas/AdvertisedWorkerProtocolVersion" } } }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/UpdateValidationTaskClaim"
                  - $ref: "#/components/schemas/EmptyPoll"
        "400": { $ref: "#/components/responses/WorkerError" }
        "409": { $ref: "#/components/responses/WorkerError" }
        "429": { $ref: "#/components/responses/WorkerPollBackpressure" }
        "422": { $ref: "#/components/responses/WorkerError" }
        "503": { $ref: "#/components/responses/WorkerServiceUnavailable" }
  /worker/update-validation-tasks/{taskId}/approve:
    post:
      operationId: approveUpdateValidationTask
      tags: [update-validation-tasks]
      parameters:
        - $ref: "#/components/parameters/WorkerProtocolVersionHeader"
        - $ref: "#/components/parameters/TaskIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateValidationTaskCompletionRequest" }
      responses:
        "200": { $ref: "#/components/responses/UpdateValidationTaskCompletion" }
        "404": { $ref: "#/components/responses/UpdateValidationTaskCompletionFailure" }
        "409": { $ref: "#/components/responses/UpdateValidationTaskCompletionFailure" }
        "422": { $ref: "#/components/responses/WorkerError" }
  /worker/update-validation-tasks/{taskId}/reject:
    post:
      operationId: rejectUpdateValidationTask
      tags: [update-validation-tasks]
      parameters:
        - $ref: "#/components/parameters/WorkerProtocolVersionHeader"
        - $ref: "#/components/parameters/TaskIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateValidationTaskRejectionRequest" }
      responses:
        "200": { $ref: "#/components/responses/UpdateValidationTaskCompletion" }
        "404": { $ref: "#/components/responses/UpdateValidationTaskCompletionFailure" }
        "409": { $ref: "#/components/responses/UpdateValidationTaskCompletionFailure" }
        "422": { $ref: "#/components/responses/WorkerError" }
  /worker/query-tasks/poll:
    post:
      operationId: pollQueryTask
      tags: [query-tasks]
      parameters: [{ $ref: "#/components/parameters/WorkerProtocolVersionHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PollRequest" }
      responses:
        "200": { $ref: "#/components/responses/WorkerEnvelope" }
        "429": { $ref: "#/components/responses/WorkerPollBackpressure" }
        "503": { $ref: "#/components/responses/WorkerServiceUnavailable" }
  /worker/query-tasks/{queryTaskId}/complete:
    post:
      operationId: completeQueryTask
      tags: [query-tasks]
      parameters:
        - $ref: "#/components/parameters/WorkerProtocolVersionHeader"
        - name: queryTaskId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QueryTaskCompleteRequest" }
      responses:
        "200": { $ref: "#/components/responses/WorkerEnvelope" }
        "409": { $ref: "#/components/responses/WorkerError" }
  /worker/query-tasks/{queryTaskId}/fail:
    post:
      operationId: failQueryTask
      tags: [query-tasks]
      parameters:
        - $ref: "#/components/parameters/WorkerProtocolVersionHeader"
        - name: queryTaskId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskFailureRequest" }
      responses:
        "200": { $ref: "#/components/responses/WorkerEnvelope" }
        "409": { $ref: "#/components/responses/WorkerError" }
  /worker/activity-tasks/poll:
    post:
      operationId: pollActivityTask
      tags: [activity-tasks]
      parameters: [{ $ref: "#/components/parameters/WorkerProtocolVersionHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PollRequest" }
      responses:
        "200":
          description: A claimed activity task, an empty long-poll result, or a draining-worker response.
          headers: { X-Durable-Workflow-Protocol-Version: { schema: { $ref: "#/components/schemas/AdvertisedWorkerProtocolVersion" } } }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ActivityTaskClaim"
                  - $ref: "#/components/schemas/EmptyPoll"
                  - $ref: "#/components/schemas/DrainingPoll"
        "429": { $ref: "#/components/responses/WorkerPollBackpressure" }
        "503": { $ref: "#/components/responses/WorkerServiceUnavailable" }
  /worker/activity-tasks/{taskId}/status:
    post:
      operationId: observeActivityTask
      tags: [activity-tasks]
      x-durable-workflow-minimum-protocol-version: "1.20"
      description: >
        Observe an activity attempt using its namespace, task, attempt and owner
        fence. This call never renews an attempt lease, worker session or user
        heartbeat and never writes history. An expired lease or execution/heartbeat
        deadline refuses continuation even before timeout repair. A required
        worker session must remain active, owned and within its lease and TTL.
        Observation
        remains available under draining or fenced storage admission. User
        heartbeats retain the existing ownership
        renewal contract. A successful observation is not a reservation for later
        publication, which must independently validate the same attempt fence.
      parameters:
        - $ref: "#/components/parameters/WorkerProtocolVersionHeader"
        - $ref: "#/components/parameters/TaskIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivityTaskStatusRequest" }
      responses:
        "200":
          description: Observed continuation or stop state, with no ownership or progress renewal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityTaskStatusResponse" }
        "400": { $ref: "#/components/responses/WorkerError" }
        "404": { $ref: "#/components/responses/WorkerError" }
        "409": { $ref: "#/components/responses/WorkerError" }
        "422": { $ref: "#/components/responses/WorkerError" }
        "503": { $ref: "#/components/responses/WorkerServiceUnavailable" }
  /worker/activity-tasks/{taskId}/acknowledge-cancellation:
    post:
      operationId: acknowledgeActivityCancellation
      tags: [activity-tasks]
      x-durable-workflow-minimum-protocol-version: "1.20"
      description: >
        Report that the original remote callback has stopped and been joined.
        Requires the immutable cooperative worker claim, original task, attempt,
        owner and local cancellation request, plus matching canonical cancellation
        history. Cancelled rows, lease expiry and a disconnected worker are not
        stop reports. Duplicates return the original receipt event. This report
        never renews leases, records application heartbeats, restores publication
        authority or extends the cleanup deadline. Late receipt remains late.
        A worker report does not undo external effects. Local activities require
        separate workflow claim authority and cannot use this endpoint. Installed
        runtimes without this primitive return explicit capability diagnostics.
        Available during draining storage admission. Fenced storage refuses writes.
      parameters:
        - $ref: "#/components/parameters/WorkerProtocolVersionHeader"
        - $ref: "#/components/parameters/TaskIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivityCancellationAcknowledgementRequest" }
      responses:
        "200":
          description: Original callback-stop receipt, including an idempotent duplicate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityCancellationAcknowledgementResponse" }
        "400": { $ref: "#/components/responses/WorkerError" }
        "403": { $ref: "#/components/responses/WorkerError" }
        "404": { $ref: "#/components/responses/WorkerError" }
        "409": { $ref: "#/components/responses/WorkerError" }
        "422": { $ref: "#/components/responses/WorkerError" }
        "503": { $ref: "#/components/responses/WorkerServiceUnavailable" }
  /worker/activity-tasks/{taskId}/heartbeat:
    post:
      operationId: heartbeatActivityTask
      tags: [activity-tasks]
      parameters:
        - $ref: "#/components/parameters/WorkerProtocolVersionHeader"
        - $ref: "#/components/parameters/TaskIdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskHeartbeatRequest" }
      responses:
        "200": { $ref: "#/components/responses/WorkerEnvelope" }
        "409": { $ref: "#/components/responses/WorkerError" }
  /worker/activity-tasks/{taskId}/complete:
    post:
      operationId: completeActivityTask
      tags: [activity-tasks]
      description: >
        An unknown backend outcome returns a retryable 503 fenced by task_id,
        activity_attempt_id and lease_owner. Retry the same result without
        rerunning the activity. A committed first attempt can return 409
        stale_attempt with completed activity, attempt and task statuses.
      parameters:
        - $ref: "#/components/parameters/WorkerProtocolVersionHeader"
        - $ref: "#/components/parameters/TaskIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivityTaskCompleteRequest" }
      responses:
        "200": { $ref: "#/components/responses/WorkerEnvelope" }
        "409": { $ref: "#/components/responses/WorkerError" }
        "503": { $ref: "#/components/responses/WorkerServiceUnavailable" }
  /worker/activity-tasks/{taskId}/fail:
    post:
      operationId: failActivityTask
      tags: [activity-tasks]
      parameters:
        - $ref: "#/components/parameters/WorkerProtocolVersionHeader"
        - $ref: "#/components/parameters/TaskIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskFailureRequest" }
      responses:
        "200": { $ref: "#/components/responses/WorkerEnvelope" }
        "409": { $ref: "#/components/responses/WorkerError" }
components:
  securitySchemes:
    durableWorkerAuth:
      type: apiKey
      in: header
      name: Authorization
  parameters:
    WorkerProtocolVersionHeader:
      name: X-Durable-Workflow-Protocol-Version
      in: header
      required: true
      description: >
        Worker-selected protocol version. The default server advertises 1.19
        and accepts same-major versions whose minor is no newer than 19.
        Missing, malformed, different-major, and ahead-of-server values fail closed.
      schema: { $ref: "#/components/schemas/AcceptedWorkerProtocolRequestVersion" }
    TaskIdPath:
      name: taskId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    PreparedLocalAttemptIdPath:
      name: attemptId
      in: path
      required: true
      description: Canonical durable attempt ID returned by preparation, distinct from worker_attempt_id.
      schema: { type: string, minLength: 1 }
    SessionIdPath:
      name: sessionId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 255 }
    WorkerIdPath:
      name: workerId
      in: path
      required: true
      description: Worker registration identity in the resolved namespace.
      schema: { type: string, minLength: 1, maxLength: 255 }
  responses:
    WorkerEnvelope:
      description: Worker-protocol response envelope.
      headers:
        X-Durable-Workflow-Protocol-Version:
          schema: { $ref: "#/components/schemas/AdvertisedWorkerProtocolVersion" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/WorkerEnvelope" }
    WorkerError:
      description: Machine-readable worker-protocol error envelope.
      headers:
        X-Durable-Workflow-Protocol-Version:
          schema: { $ref: "#/components/schemas/AdvertisedWorkerProtocolVersion" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/WorkerError" }
    WorkerServiceUnavailable:
      description: >
        Temporary database connection loss returns backend_unavailable with an
        unknown operation outcome. Retry with bounded backoff and the identical
        worker, queue and poll_request_id; task=null does not prove that no task
        was claimed. Registration and worker heartbeat likewise do not acknowledge or
        reject an operation whose result is unknown. A workflow-task heartbeat
        carries task_id, lease_owner, and workflow_task_attempt so a worker can
        retry the same lease fence; a later 409 still revokes that lease. An
        activity completion carries task_id, activity_attempt_id and lease_owner
        to retry the same immutable result. Other
        503 errors retain their own contracts and are not automatically retryable. Optional
        storage admission returns storage_pressure or storage_admission_unavailable
        before admitting a request or a new poll claim. Retain the poll ID on
        retry: refusal of this attempt does not describe an earlier outcome.
      headers:
        X-Durable-Workflow-Protocol-Version:
          schema: { $ref: "#/components/schemas/AdvertisedWorkerProtocolVersion" }
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            anyOf:
              - $ref: "#/components/schemas/WorkerBackendUnavailable"
              - $ref: "#/components/schemas/WorkerStorageAdmissionRefusal"
              - $ref: "#/components/schemas/WorkerError"
    WorkerPollBackpressure:
      description: The node has no capacity for another held long poll; retry after the advertised delay.
      headers:
        X-Durable-Workflow-Protocol-Version:
          schema: { $ref: "#/components/schemas/AdvertisedWorkerProtocolVersion" }
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/WorkerPollBackpressure" }
    WorkerRegistrationEnvelope:
      description: Accepted worker registration and its authoritative capabilities.
      headers:
        X-Durable-Workflow-Protocol-Version:
          schema: { $ref: "#/components/schemas/AdvertisedWorkerProtocolVersion" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/WorkerRegistrationEnvelope" }
    WorkerRegistrationFailure:
      description: A worker registration boundary rejection.
      headers:
        X-Durable-Workflow-Protocol-Version:
          schema: { $ref: "#/components/schemas/AdvertisedWorkerProtocolVersion" }
      content:
        application/json:
          schema:
            anyOf:
              - $ref: "#/components/schemas/WorkflowMetadataCapabilityFailure"
              - $ref: "#/components/schemas/PortableWorkerAffinityFailure"
              - $ref: "#/components/schemas/WorkerError"
    WorkflowMetadataCapabilityFailure:
      description: A metadata capability registration or completion boundary rejection.
      headers:
        X-Durable-Workflow-Protocol-Version:
          schema: { $ref: "#/components/schemas/AdvertisedWorkerProtocolVersion" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/WorkflowMetadataCapabilityFailure" }
    WorkflowTaskCompletion:
      description: A fenced workflow-task completion result.
      headers:
        X-Durable-Workflow-Protocol-Version:
          schema: { $ref: "#/components/schemas/AdvertisedWorkerProtocolVersion" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/WorkflowTaskCompletionResult" }
    WorkflowTaskCompletionFailure:
      description: A workflow-task completion boundary rejection.
      headers:
        X-Durable-Workflow-Protocol-Version:
          schema: { $ref: "#/components/schemas/AdvertisedWorkerProtocolVersion" }
      content:
        application/json:
          schema:
            anyOf:
              - $ref: "#/components/schemas/WorkflowMetadataCapabilityFailure"
              - $ref: "#/components/schemas/ConditionWaitOccurrenceIdentityFailure"
              - $ref: "#/components/schemas/PortableWorkerAffinityFailure"
              - $ref: "#/components/schemas/WorkerError"
    WorkflowTaskPollConflict:
      description: The poll request is unsupported, its idempotency identity conflicts with a previously bound task-kind set, or a cached task cannot be replayed within the requested task-kind set.
      headers:
        X-Durable-Workflow-Protocol-Version:
          schema: { $ref: "#/components/schemas/AdvertisedWorkerProtocolVersion" }
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/PollRequestTaskKindsConflict"
              - $ref: "#/components/schemas/CachedPollTaskKindConflict"
              - $ref: "#/components/schemas/UpdateValidationCapabilityConflict"
    UpdateValidationTaskCompletion:
      description: A fenced update-validation task approval or rejection result.
      headers:
        X-Durable-Workflow-Protocol-Version:
          schema: { $ref: "#/components/schemas/AdvertisedWorkerProtocolVersion" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/UpdateValidationTaskCompletionResult" }
    UpdateValidationTaskCompletionFailure:
      description: A typed update-validation completion fence rejection.
      headers:
        X-Durable-Workflow-Protocol-Version:
          schema: { $ref: "#/components/schemas/AdvertisedWorkerProtocolVersion" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/UpdateValidationTaskCompletionFailure" }
    WorkerSessionOperation:
      description: Worker-session lifecycle admission or renewal result.
      headers:
        X-Durable-Workflow-Protocol-Version:
          schema: { $ref: "#/components/schemas/AdvertisedWorkerProtocolVersion" }
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/WorkerEnvelope"
              - $ref: "./worker-sessions-runtime.schema.json#/$defs/workerSessionOperationResult"
    WorkerDeregistrationEnvelope:
      description: Graceful worker-deregistration result in the WorkerProtocol success envelope.
      headers:
        X-Durable-Workflow-Protocol-Version:
          schema: { $ref: "#/components/schemas/AdvertisedWorkerProtocolVersion" }
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/WorkerEnvelope"
              - $ref: "#/components/schemas/WorkerDeregistrationResult"
  schemas:
    AcceptedWorkerProtocolRequestVersion:
      type: string
      enum: ["1.0", "1.1", "1.2", "1.3", "1.4", "1.5", "1.6", "1.7", "1.8", "1.9", "1.10", "1.11", "1.12", "1.13", "1.14", "1.15", "1.16", "1.17", "1.18", "1.19"]
      description: >
        Request versions accepted by a server using the default advertised
        version 1.19. If deployment configuration changes the advertised
        version to 1.N, the accepted set is 1.0 through 1.N.
    AdvertisedWorkerProtocolVersion:
      type: string
      const: "1.19"
      description: Default worker protocol version advertised by responses implementing the Durable Workflow 2.0 protocol contract.
    WorkerEnvelope:
      type: object
      additionalProperties: true
      required: [protocol_version, server_capabilities]
      properties:
        protocol_version: { $ref: "#/components/schemas/AdvertisedWorkerProtocolVersion" }
        server_capabilities: { $ref: "#/components/schemas/WorkerServerCapabilities" }
    WorkerError:
      type: object
      additionalProperties: true
      required: [protocol_version, server_capabilities]
      properties:
        protocol_version: { $ref: "#/components/schemas/AdvertisedWorkerProtocolVersion" }
        error: { type: string }
        reason: { type: [string, "null"] }
        remediation: { type: [string, "null"] }
        server_capabilities: { $ref: "#/components/schemas/WorkerServerCapabilities" }
    WorkerStorageAdmissionRefusal:
      allOf:
        - $ref: "#/components/schemas/WorkerError"
        - type: object
          required: [reason, storage_state, retryable, retry_after_seconds]
          properties:
            reason: { type: string, enum: [storage_pressure, storage_admission_unavailable] }
            storage_state: { type: string, enum: [draining, fenced] }
            request_admitted:
              type: boolean
              const: false
              description: Present only when admission refused before entering the handler. Does not describe previous requests.
            retryable: { type: boolean, const: true }
            retry_after_seconds: { type: integer, minimum: 1 }
          if:
            required: [poll_status]
          then:
            required: [task, claim_admitted, poll_request_id, retry_same_poll_request_id]
            properties:
              task: { type: "null" }
              claim_admitted: { type: boolean, const: false }
              poll_status: { type: string, enum: [storage_pressure, storage_admission_unavailable] }
              poll_request_id: { type: [string, "null"], minLength: 1, maxLength: 255 }
              retry_same_poll_request_id: { type: boolean, const: true }
    WorkerBackendUnavailable:
      allOf:
        - $ref: "#/components/schemas/WorkerError"
        - type: object
          required: [reason, operation, outcome, worker_id, task_queue, retryable, retry_after_seconds]
          properties:
            reason: { type: string, const: backend_unavailable }
            operation:
              type: string
              enum: [register_worker, heartbeat_worker, heartbeat_workflow_task, complete_workflow_task, complete_activity_task, poll_workflow_task, poll_activity_task, poll_query_task, poll_update_validation_task]
            outcome: { type: string, const: unknown }
            worker_id: { type: [string, "null"], minLength: 1, maxLength: 255 }
            task_queue: { type: [string, "null"], minLength: 1, maxLength: 255 }
            task_id: { type: [string, "null"], minLength: 1, maxLength: 255 }
            lease_owner: { type: [string, "null"], minLength: 1, maxLength: 255 }
            workflow_task_attempt: { type: [integer, "null"], minimum: 1 }
            activity_attempt_id: { type: [string, "null"], minLength: 1, maxLength: 255 }
            retryable: { type: boolean }
            retry_after_seconds: { type: integer, minimum: 1 }
          if:
            properties:
              operation: { enum: [poll_workflow_task, poll_activity_task, poll_query_task, poll_update_validation_task] }
          then:
            required: [task, poll_status, poll_request_id, retry_same_poll_request_id]
            properties:
              task: { type: "null" }
              poll_status: { type: string, const: backend_unavailable }
              poll_request_id: { type: [string, "null"], minLength: 1, maxLength: 255 }
              retry_same_poll_request_id: { type: boolean, const: true }
          else:
            if:
              properties:
                operation: { enum: [heartbeat_workflow_task, complete_workflow_task] }
            then:
              required: [task_id, lease_owner, workflow_task_attempt]
            else:
              if:
                properties:
                  operation: { const: complete_activity_task }
              then:
                required: [task_id, lease_owner, activity_attempt_id]
    WorkerPollBackpressure:
      allOf:
        - $ref: "#/components/schemas/WorkerError"
        - type: object
          required: [task, poll_status, error, reason, namespace, task_queue, task_kind, wait_pool, retry_after_seconds, retryable]
          properties:
            task: { type: "null" }
            poll_status: { type: string, const: long_poll_capacity_exhausted }
            reason: { type: string, const: long_poll_capacity_exhausted }
            namespace: { type: string, minLength: 1 }
            task_queue: { type: string, minLength: 1 }
            task_kind: { type: string, enum: [workflow_task, activity_task, query_task, update_validation_task] }
            wait_pool: { type: string, enum: [worker, query] }
            retry_after_seconds: { type: integer, minimum: 1 }
            retryable: { type: boolean, const: true }
    WorkerRegistrationEnvelope:
      allOf:
        - $ref: "#/components/schemas/WorkerEnvelope"
        - type: object
          required: [worker_id, registered, namespace, task_queue, runtime, capabilities, capability_manifest, status, heartbeat_interval_seconds]
          properties:
            worker_id: { type: string, minLength: 1 }
            registered: { type: boolean, const: true }
            namespace: { type: string, minLength: 1 }
            task_queue: { type: string, minLength: 1 }
            runtime: { type: string, enum: [php, python, rust, typescript, go, java, external] }
            build_id: { type: [string, "null"] }
            capabilities:
              type: array
              uniqueItems: true
              items: { type: string }
            capability_manifest:
              $ref: "#/components/schemas/PortableWorkerCapabilityManifest"
            status: { type: string, minLength: 1 }
            heartbeat_interval_seconds: { type: integer, minimum: 1 }
    WorkflowMetadataCapabilityFailure:
      allOf:
        - $ref: "#/components/schemas/WorkerError"
        - type: object
          required: [reason, capability, minimum_protocol_version]
          properties:
            reason:
              type: string
              enum: [workflow_metadata_capability_protocol_mismatch, workflow_metadata_capability_not_advertised]
            capability:
              type: string
              enum: [memo_upserts, typed_search_attributes]
            minimum_protocol_version: { type: string, enum: ["1.14", "1.16"] }
          oneOf:
            - required: [registered, requested_version]
              properties:
                registered: { type: boolean, const: false }
                requested_version: { type: string }
            - required: [task_id, workflow_task_attempt, outcome, recorded, command_type]
              properties:
                task_id: { type: string, minLength: 1 }
                workflow_task_attempt: { type: integer, minimum: 1 }
                outcome: { type: string, const: rejected }
                recorded: { type: boolean, const: false }
                command_type: { type: string, enum: [upsert_memo, upsert_search_attributes] }
    ConditionWaitOccurrenceIdentityFailure:
      allOf:
        - $ref: "#/components/schemas/WorkerError"
        - type: object
          required: [task_id, workflow_task_attempt, outcome, recorded, reason, requested_version, minimum_protocol_version, command_type, command_field]
          properties:
            task_id: { type: string, minLength: 1 }
            workflow_task_attempt: { type: integer, minimum: 1 }
            outcome: { type: string, const: rejected }
            recorded: { type: boolean, const: false }
            reason: { type: string, const: condition_wait_occurrence_identity_unavailable }
            requested_version: { type: string }
            minimum_protocol_version: { type: string, const: "1.17" }
            command_type: { type: string, const: open_condition_wait }
            command_field: { type: string, const: condition_wait_occurrence_id }
    PortableWorkerAffinityFailure:
      allOf:
        - $ref: "#/components/schemas/WorkerError"
        - type: object
          required: [reason, capability, minimum_protocol_version]
          properties:
            reason:
              type: string
              enum:
                - worker_capability_manifest_mismatch
                - worker_capability_protocol_floor_mismatch
                - portable_worker_affinity_protocol_floor_unavailable
                - worker_capability_not_supported
                - sticky_cache_identity_mismatch
            capability:
              type: string
              enum: [local_activities, worker_sessions, sticky_execution]
            requested_version: { type: [string, "null"] }
            minimum_protocol_version: { type: string, const: "1.18" }
          oneOf:
            - required: [registered]
              properties:
                registered: { type: boolean, const: false }
            - required: [task_id, workflow_task_attempt, outcome, recorded]
              properties:
                task_id: { type: string, minLength: 1 }
                workflow_task_attempt: { type: integer, minimum: 1 }
                outcome: { type: string, const: rejected }
                recorded: { type: boolean, const: false }
    WorkerServerCapabilities:
      type: object
      additionalProperties: true
      required: [supported_workflow_task_commands, workflow_task_poll_request_idempotency, workflow_memo_updates, message_streams, typed_search_attributes, condition_wait_occurrence_identity, update_validation_tasks, synchronous_update_validation, local_activities, sticky_execution]
      properties:
        cooperative_cancellation:
          type: boolean
          description: Explicit support for claim-bound cooperative request delivery, requiring worker protocol 1.20 or newer in the same major version. False at the default protocol 1.19.
        activity_cancellation_acknowledgement:
          type: boolean
          description: Original remote callback-stop receipts require an installed runtime primitive and worker protocol 1.20. False for the default protocol and for runtimes without that primitive.
        prepared_local_activities:
          type: boolean
          description: Candidate preparation, prefix checkpoint, supervisor control, application heartbeat, outcome, recovery and joined-stop receipts. Requires protocol 1.20 and the actual bound PreparedLocalActivityTaskBridge role including heartbeat support. False at the default protocol 1.19.
        supported_workflow_task_commands:
          type: array
          uniqueItems: true
          items: { type: string }
        workflow_task_poll_request_idempotency: { type: boolean, const: true }
        workflow_memo_updates:
          $ref: "#/components/schemas/WorkflowMemoUpdateCapability"
        message_streams:
          $ref: "#/components/schemas/MessageStreamsCapability"
        typed_search_attributes:
          $ref: "#/components/schemas/TypedSearchAttributesCapability"
        condition_wait_occurrence_identity:
          $ref: "#/components/schemas/ConditionWaitOccurrenceIdentityCapability"
        update_validation_tasks: { type: boolean, const: true }
        synchronous_update_validation:
          $ref: "#/components/schemas/SynchronousUpdateValidationCapability"
        worker_session_verbs:
          type: array
          items: { type: string, enum: [create, heartbeat, close] }
          minItems: 3
        worker_sessions:
          $ref: "./worker-sessions-runtime.schema.json#/$defs/workerSessionRuntimeContract"
        local_activities:
          $ref: "#/components/schemas/LocalActivityCapability"
        sticky_execution:
          $ref: "#/components/schemas/StickyExecutionCapability"
    PortableWorkerCapabilityManifest:
      type: object
      additionalProperties: true
      required: [local_activities, worker_sessions, sticky_execution]
      properties:
        local_activities: { $ref: "#/components/schemas/PortableWorkerCapabilityDeclaration" }
        worker_sessions: { $ref: "#/components/schemas/PortableWorkerCapabilityDeclaration" }
        sticky_execution: { $ref: "#/components/schemas/PortableWorkerCapabilityDeclaration" }
    PortableWorkerCapabilityDeclaration:
      type: object
      additionalProperties: false
      required: [supported, minimum_protocol_version]
      properties:
        supported: { type: boolean }
        minimum_protocol_version: { type: string, pattern: "^1\\.[0-9]+$" }
        implementation: { type: string, minLength: 1, maxLength: 255 }
        reason: { type: string, minLength: 1, maxLength: 255 }
    LocalActivityCapability:
      type: object
      additionalProperties: true
      required: [schema, version, supported, worker_capability, minimum_worker_protocol_version, execution, retry, timeouts, visibility]
      properties:
        schema: { type: string, const: durable-workflow.v2.local-activity.contract }
        version: { type: integer, const: 1 }
        supported: { type: boolean }
        worker_capability: { type: string, const: local_activities }
        minimum_worker_protocol_version: { type: string, const: "1.18" }
        execution: { type: object, additionalProperties: true }
        retry: { type: object, additionalProperties: true }
        timeouts: { type: object, additionalProperties: true }
        visibility: { type: object, additionalProperties: true }
    StickyExecutionCapability:
      type: object
      additionalProperties: true
      required: [feature, supported, worker_capability, minimum_worker_protocol_version, cache_key_fields, correctness_fallback, metrics]
      properties:
        feature: { type: string, const: sticky_execution }
        supported: { type: boolean }
        worker_capability: { type: string, const: sticky_execution }
        minimum_worker_protocol_version: { type: string, const: "1.18" }
        cache_key_fields:
          type: array
          prefixItems: [{ const: workflow_id }, { const: run_id }, { const: build_id }]
          minItems: 3
          maxItems: 3
        correctness_fallback: { type: string, const: cold_replay }
        metrics:
          type: array
          uniqueItems: true
          items: { type: string, enum: [hit, miss, eviction, forced_cold_replay] }
    MessageStreamsCapability:
