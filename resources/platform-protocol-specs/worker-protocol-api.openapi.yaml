        worker_capability: { type: string, const: typed_search_attributes }
        canonical_types:
          type: array
          uniqueItems: true
          minItems: 7
          maxItems: 7
          items: { $ref: "#/components/schemas/SearchAttributeType" }
        command_field: { type: string, const: attribute_types }
        history_field: { type: string, const: attribute_types }
        legacy_history_rule: { type: string, const: absent_metadata_is_unknown_type_identity }
    ConditionWaitOccurrenceIdentityCapability:
