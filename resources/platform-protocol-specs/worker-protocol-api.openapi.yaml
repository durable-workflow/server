      properties:
        request_id: { type: string, minLength: 1 }
        requested_at: { type: string, format: date-time }
        cleanup_deadline_at: { type: string, format: date-time }
        delivery_sequence: { type: [integer, "null"], minimum: 1 }
        delivered_at: { type: [string, "null"], format: date-time }
        history_refresh_page_token:
          type: string
          minLength: 1
          description: Server-issued token for the first bounded history page. Reload canonical history after delivery using this token and the same task ownership fence.
    CooperativeCancellationDeliveryRequest:
      type: object
      additionalProperties: true
      required: [lease_owner, workflow_task_attempt, request_id, sequence, call_kind]
      properties:
        lease_owner: { type: string, minLength: 1 }
        workflow_task_attempt: { type: integer, minimum: 1 }
        request_id: { type: string, minLength: 1 }
        sequence: { type: integer, minimum: 1 }
        call_kind: { type: string, enum: [activity, local_activity, timer, condition, signal, child, parallel, selection_handle] }
        sequence_span: { type: [integer, "null"], minimum: 1, default: 1 }
        operation_sequence: { type: [integer, "null"], minimum: 1 }
        operation_sequence_span: { type: [integer, "null"], minimum: 1, default: 1 }
    CooperativeCancellationDeliveryResponse:
      allOf:
        - $ref: "#/components/schemas/WorkerEnvelope"
        - oneOf:
            - type: object
              required: [delivered, task_id, workflow_run_id, request_id, sequence, call_kind, sequence_span, operation_sequence, operation_sequence_span, reason]
              properties:
                delivered: { type: boolean, const: true }
                task_id: { type: string, minLength: 1 }
                workflow_run_id: { type: string, minLength: 1 }
                request_id: { type: string, minLength: 1 }
                sequence: { type: integer, minimum: 1 }
                call_kind: { type: string, enum: [activity, local_activity, timer, condition, signal, child, parallel, selection_handle] }
                sequence_span: { type: integer, minimum: 1 }
                operation_sequence: { type: [integer, "null"], minimum: 1 }
                operation_sequence_span: { type: integer, minimum: 1 }
                reason: { type: "null" }
            - type: object
              required: [delivered, task_id, workflow_run_id, request_id, sequence, call_kind, sequence_span, operation_sequence, operation_sequence_span, reason, claim_released]
              properties:
                delivered: { type: boolean, const: false }
                claim_released: { type: boolean, const: true }
                task_id: { type: string, minLength: 1 }
                workflow_run_id: { type: string, minLength: 1 }
                request_id: { type: "null" }
                sequence: { type: "null" }
                call_kind: { type: "null" }
                sequence_span: { type: "null" }
                operation_sequence: { type: "null" }
                operation_sequence_span: { type: "null" }
                reason: { type: string, const: cancellation_waiting_for_child }
    PreparedLocalClaimRequest:
      type: object
      required: [lease_owner, workflow_task_attempt]
      properties:
        lease_owner: { type: string, minLength: 1, maxLength: 255 }
        workflow_task_attempt: { type: integer, minimum: 1 }
    PreparedLocalDescriptor:
      type: object
      additionalProperties: false
      required: [type, activity_type, arguments]
      properties:
        type: { type: string, const: record_local_activity }
        activity_type: { type: string, minLength: 1 }
        arguments:
          description: Encoded Avro or a standard Avro envelope resolved by this namespace's configured runtime storage.
          oneOf:
            - { type: string, minLength: 1 }
            - { type: object, required: [codec], properties: { codec: { const: avro } } }
        payload_codec: { type: string, const: avro }
        execution_mode: { type: string, const: local }
        start_to_close_timeout: { type: [integer, "null"], minimum: 1 }
        schedule_to_close_timeout: { type: [integer, "null"], minimum: 1 }
        heartbeat_timeout: { type: [integer, "null"], minimum: 1 }
        cancellation_cleanup:
          type: object
          additionalProperties: false
          required: [request_id, delivery_history_event_id]
          description: Explicit shielded cleanup after canonical delivery. The runtime supplies the original root identity and deadline.
          properties:
            request_id: { type: string, minLength: 1 }
            delivery_history_event_id: { type: string, minLength: 1 }
        retry_policy:
          type: [object, "null"]
          properties:
            max_attempts: { type: [integer, "null"], minimum: 1 }
            backoff_seconds: { type: array, items: { type: integer, minimum: 0 } }
            non_retryable_error_types: { type: array, items: { type: string } }
    PreparedLocalRecoverRequest:
      allOf:
        - $ref: "#/components/schemas/PreparedLocalClaimRequest"
        - type: object
          required: [sequence, descriptor]
          properties:
            sequence: { type: integer, minimum: 1 }
            descriptor: { $ref: "#/components/schemas/PreparedLocalDescriptor" }
    PreparedLocalPrepareRequest:
      allOf:
        - $ref: "#/components/schemas/PreparedLocalRecoverRequest"
        - type: object
          required: [worker_attempt_id]
          properties:
            worker_attempt_id:
