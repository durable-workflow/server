            message_streams: "1.15"
            typed_search_attributes: "1.16"
            local_activities: "1.18"
            worker_sessions: "1.18"
            sticky_execution: "1.18"
            cooperative_cancellation: "1.20"
        capability_manifest:
          $ref: "#/components/schemas/PortableWorkerCapabilityManifest"
    WorkerHeartbeatRequest:
