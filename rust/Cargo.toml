[package]
name = "durable-workflow-server"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"
description = "Development of the compatible Rust Durable Workflow Server"

[dependencies]
apache-avro = { version = "=0.22.0", default-features = false }
base64 = "0.22"
thiserror = "2"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
hmac = "0.13"
form_urlencoded = "1.2"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "sqlite-bundled", "postgres", "mysql", "migrate", "chrono", "json"] }
subtle = "=2.6.1"
getrandom = "=0.3.4"
regex-lite = "0.1"
phpserz = { version = "=0.3.0", default-features = false }
tempfile = "3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-util = { version = "=0.7.19", features = ["io", "io-util"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs", "io-util"] }
ulid = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
# Native installs no `log` logger, and dependencies such as apache-avro
# format whole values in `log` messages. Compiling every `log` macro out
# keeps payloads out of any logger a later change might install.
log = { version = "0.4", features = ["max_level_off", "release_max_level_off"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0

[patch.crates-io]
apache-avro = { path = "vendor/apache-avro" }
sqlx-mysql = { path = "vendor/sqlx-mysql" }
