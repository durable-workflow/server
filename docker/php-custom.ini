; Disable X-Powered-By header for language-agnostic API
expose_php = Off

; The standalone HTTP process uses PHP's multi-worker CLI server. Share
; compiled framework bytecode across those workers so a burst of requests does
; not make every child parse the full application before it can enter a route.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
