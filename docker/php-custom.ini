; Disable X-Powered-By header for language-agnostic API
expose_php = Off

; The standalone HTTP process uses Apache prefork with mod_php. Share compiled
; framework bytecode across request processes, while keeping OPcache available
; to the image's PHP CLI worker, scheduler, and bootstrap commands.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
