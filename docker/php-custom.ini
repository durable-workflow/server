; Disable X-Powered-By header for language-agnostic API
expose_php = Off

; The API enforces separate bounded JSON and binary transport limits. PHP must
; not consume/discard POST bodies or emit warnings before that boundary runs.
enable_post_data_reading = Off
; Keep the default 64 MiB binary transport usable. The API applies its stricter
; JSON and per-route limits; it does not accept PHP multipart file uploads.
post_max_size = 64M
upload_max_filesize = 64M
session.upload_progress.enabled = Off
display_errors = Off
display_startup_errors = Off
log_errors = On

; The standalone HTTP process uses Apache prefork with mod_php. Share compiled
; framework bytecode across request processes, while keeping OPcache available
; to the image's PHP CLI worker, scheduler, and bootstrap commands.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
