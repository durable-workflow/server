<IfModule mpm_prefork_module>
    # mod_php children load the full Laravel graph on demand. Keep the eager
    # and idle pools small so control-plane cold starts retain memory headroom.
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          4
    MaxRequestWorkers       24
    MaxConnectionsPerChild 1000
    # An idle persistent connection would retain a whole PHP request process.
    # Release it after each response so fresh control requests can enter.
    KeepAlive Off
</IfModule>
