# Production reference values using externally managed secrets.
#
# This is the recommended shape for GitOps repositories: the chart never sees
# raw credentials. Use External Secrets Operator, Vault Secret Operator,
# Secrets Store CSI Driver, or any other bridge that produces the listed
# Kubernetes Secrets in the target namespace.

image:
  registry: ghcr.io
  repository: durable-workflow/server
  # Pin a digest in production for change-control auditability.
  digest: ""    # e.g. "sha256:abc123..."
  tag: "2.0.3"

externalDatabase:
  connection: pgsql
  host: workflow-db.example.internal
  port: 5432
  database: durable_workflow
  sslMode: require
  existingSecret: durable-workflow-db-credentials
  # Override key names if your secret store emits something different:
  # existingSecretUsernameKey: username
  # existingSecretPasswordKey: password

externalRedis:
  host: workflow-redis.example.internal
  port: 6379
  tls: true
  existingSecret: durable-workflow-redis-credentials

auth:
  existingSecret: durable-workflow-app-credentials

config:
  appEnv: production
  auth:
    driver: token
    backwardCompatible: "false"

server:
  replicaCount: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  pdb:
    enabled: true
    minAvailable: 2
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: "1Gi"
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: workflow.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: workflow-tls
        hosts:
          - workflow.example.com
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: server

worker:
  replicaCount: 4
  pdb:
    enabled: true
    maxUnavailable: 1
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: "1Gi"

# The scheduler is a singleton — keep concurrencyPolicy: Forbid.
scheduler:
  enabled: true
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

argocd:
  useSyncWaves: true

flux:
  useDependsOn: true

networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          team: platform-ingress
