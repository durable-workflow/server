# Reference values + companion ExternalSecret manifests for the External
# Secrets Operator (https://external-secrets.io). The Helm chart consumes the
# K8s Secrets that ESO produces; the ExternalSecret resources themselves
# live outside the chart so the secret-source backend remains the operator's
# concern.

image:
  tag: "2.0.3"

externalDatabase:
  connection: pgsql
  host: workflow-db.example.internal
  port: 5432
  database: durable_workflow
  existingSecret: durable-workflow-db-credentials
  existingSecretUsernameKey: username
  existingSecretPasswordKey: password

externalRedis:
  host: workflow-redis.example.internal
  port: 6379
  existingSecret: durable-workflow-redis-credentials
  existingSecretUsernameKey: username
  existingSecretPasswordKey: password

auth:
  existingSecret: durable-workflow-app-credentials

server:
  replicaCount: 3
  ingress:
    enabled: true
    className: nginx

