# Default values for the durable-workflow Helm chart.
#
# The chart runs one of two Server runtimes (see `runtime` below):
#
#   native (default for new installs): the 3.x Server. API replicas behind a
#     ClusterIP Service. Each pod is one process that checks its schema at
#     startup and runs timers, repair, retention and schedules itself. No
#     worker, scheduler, migration Job or Redis.
#   php (existing 2.x installs): the frozen 2.x Server in the small-cluster
#     shape at https://durable-workflow.github.io/docs/2.0/deployment :
#       * stateless API replicas behind a ClusterIP Service
#       * a separately-scaled worker Deployment
#       * exactly one scheduler/maintenance runner (CronJob with concurrencyPolicy=Forbid)
#       * a bootstrap Job that runs once per release before the new pods take traffic
#
# This chart deliberately does NOT bundle MySQL/PostgreSQL or Redis. External
# persistence is a first-class contract: point .externalDatabase (and, in PHP
# mode, .externalRedis) at the endpoints you already operate (RDS, Cloud SQL,
# Aurora, ElastiCache, Memorystore, Sentinel, etc.). For local exercise, the
# kind smoke harnesses in scripts/ provision disposable in-cluster services.

# Server runtime: "native", "php", or empty.
#   * Empty: a new install runs native. An upgrade stays native only when the
#     release already runs native, and otherwise refuses to render. A release
#     installed by chart 0.x runs PHP, so its upgrade must set runtime.
#   * "native": the 3.x Server. image.tag must be a 3.x tag, a custom tag or
#     a digest.
#   * "php": the frozen 2.x Server for existing installs. Pin image.tag to
#     your 2.x release. The final one is 2.11.8.
# Moving a PHP release to native takes over its database first. Follow
# docs/UPGRADING.md (chart 1.0.0) before setting runtime=native on it.
runtime: ""

# ---------------------------------------------------------------------------
# Image and global identity
# ---------------------------------------------------------------------------

image:
  registry: docker.io
  repository: durableworkflow/server
  # The native Server this chart release packages. Generated by
  # scripts/ci/sync-source-release.mjs. Do not edit this default.
  # A tag must match the runtime: 3.x (or latest) for native, 2.x for php.
  # The chart refuses a mismatch at render time.
  tag: "3.0.1"
  # Optional digest pin. When set, takes precedence over tag for change control.
  # Example: "sha256:abc123..."
  # The chart cannot see which runtime a digest names. Pin a native digest
  # for runtime=native and a 2.x digest for runtime=php.
  digest: ""
  # PHP mode only. Required when a custom repository, custom tag, or digest
  # prevents the chart from deriving this image capability. Leave empty for
  # recognized official release tags. Valid identities are raw-json-v1,
  # envelope-v1, and dual-v1.
  memoPayloadStorage: ""
  pullPolicy: IfNotPresent
  pullSecrets: []
  # imagePullSecrets:
  # - name: my-registry-secret

# Override fully-qualified resource names. Defaults derive from .Release.Name
# and the chart name. nameOverride affects only the chart-name portion of
# generated names; fullnameOverride replaces the whole prefix.
nameOverride: ""
fullnameOverride: ""

# ServiceAccount used by every workload in this chart. Disable to inherit the
# namespace default; supply a name to consume one you already manage.
serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: true

# Common labels applied to every rendered resource. Every label and
# annotation map in these values may not set keys under
# workflows.durable-workflow.dev/ or the helm.sh/hook keys: the chart sets
# those itself and relies on them for its runtime, memo storage and
# schema-upgrade checks, so it refuses to render a map that sets one. A user
# key that the chart also sets on an object is dropped in favor of the
# chart's value.
commonLabels: {}
commonAnnotations: {}

# ---------------------------------------------------------------------------
# Durable Workflow application configuration
# ---------------------------------------------------------------------------

# Application-level configuration baked into the shared ConfigMap. Keys mirror
# environment variables consumed by the Server containers. appName, appEnv,
# appDebug, appVersion, auth.backwardCompatible and metrics apply to PHP mode
# only. The native Server does not read them.
config:
  appName: "Durable Workflow Server"
  appEnv: "production"
  appDebug: "false"
  # PHP mode. Defaults to a 2.x image.tag when empty. Otherwise the PHP image
  # reports its own release.
  appVersion: ""

  auth:
    # Native accepts only "token".
    driver: "token"
    # PHP mode only. Set false for production to disable the legacy unscoped
    # DW_AUTH_TOKEN path. Existing Compose deployments often start with this
    # true; the chart defaults to the production posture. The native Server
    # always requires DW_AUTH_TOKEN and accepts it for every role, so native
    # mode leaves this setting out.
    backwardCompatible: "false"

  metrics:
    workflowTaskFailureTypeLimit: "20"

  # Free-form ConfigMap entries appended verbatim. Use this for environment
  # tuning that the chart does not expose as first-class settings (e.g.
  # DW_V2_MATCHING_ROLE_QUEUE_WAKE for dedicated matching rollouts).
  extraEnv:
    LOG_CHANNEL: "stderr"
  # extraEnv:
  #   DW_V2_MATCHING_ROLE_QUEUE_WAKE: "0"
  #   LOG_STDERR_FORMATTER: 'Monolog\Formatter\JsonFormatter'

# ---------------------------------------------------------------------------
# External persistence (REQUIRED — no in-cluster database is bundled)
# ---------------------------------------------------------------------------

# Workflow database. The chart does not provision a database; pass connection
# info for the database your platform team already operates. Either set
# .externalDatabase.existingSecret to consume credentials managed by your
# secret store (External Secrets Operator, Vault, Secrets Store CSI, etc.) or
# fill .auth.username / .auth.password to have the chart create a Secret.
externalDatabase:
  # Required. mysql, mariadb, or pgsql.
  connection: "mysql"
  host: ""
  port: 3306
  database: "durable_workflow"
  # Optional connection-string overrides for proxies (RDS Proxy, ProxySQL,
  # PgBouncer). When set, the engine sees this connection rather than the
  # raw managed endpoint.
  socket: ""
  sslMode: ""
  # Pre-create this CA bundle Secret before Helm's bootstrap hook runs.
  tls:
    existingSecret: ""
    caKey: "ca.crt"
  # Credentials. existingSecret takes precedence over auth.{username,password}.
  existingSecret: ""
  existingSecretUsernameKey: "DB_USERNAME"
  existingSecretPasswordKey: "DB_PASSWORD"
  auth:
    username: ""
    password: ""

# Redis acceleration layer. PHP mode only; native mode ignores this block.
# Required for the PHP multi-node correctness contract
# (see workflow/docs/deployment/multi-node-requirements.md). Configure either
# an existingSecret or inline credentials. Anonymous Redis is permitted; in
# that case leave existingSecret empty and credentials blank.
externalRedis:
  host: ""
  port: 6379
  database: "0"
  tls: false
  # Credentials are optional — set existingSecret when your Redis enforces
  # AUTH or RBAC. Keys default to REDIS_USERNAME / REDIS_PASSWORD and are
  # mounted as optional secret refs so an unauthenticated Redis still works.
  existingSecret: ""
  existingSecretUsernameKey: "REDIS_USERNAME"
  existingSecretPasswordKey: "REDIS_PASSWORD"
  auth:
    username: ""
    password: ""

# ---------------------------------------------------------------------------
# Application secrets (engine signing key + role-scoped tokens)
# ---------------------------------------------------------------------------

# Either point this chart at a Secret you already manage (existingSecret) or
# let the chart create one from inline values. The "GitOps with externally
# managed secrets" path is existingSecret — never commit real tokens here.
auth:
  existingSecret: ""
  # When existingSecret is empty, the chart renders a Secret using these keys.
  # In production, prefer existingSecret with values populated by your secret
  # manager (Vault, AWS Secrets Manager, GCP Secret Manager, etc.).
  serverKey: ""               # DW_SERVER_KEY (base64:...)
  authToken: ""               # DW_AUTH_TOKEN — shared token; required in native mode
  principalTokens: ""         # DW_PRINCIPAL_TOKENS — JSON named-principal token map (PHP only, native refuses it)
  workerToken: ""             # DW_WORKER_TOKEN
  operatorToken: ""           # DW_OPERATOR_TOKEN
  adminToken: ""              # DW_ADMIN_TOKEN
  # Map of arbitrary additional secret entries to add to the rendered Secret.
  # Ignored when existingSecret is set.
  extra: {}
  # extra:
  #   DW_PAYLOAD_CODEC_KEY: "base64:..."

# ---------------------------------------------------------------------------
# Native Server settings (runtime=native)
# ---------------------------------------------------------------------------

native:
  # The native Server never calls the Kubernetes API, so its pods mount no
  # service account token. Set true only for a sidecar that needs one.
  automountServiceAccountToken: false

  # Ephemeral storage added to the server and schema-upgrade containers unless
  # their resources already set it. The payload emptyDir (no storage claim)
  # counts toward the server pod's limit.
  ephemeralStorage:
    request: 128Mi
    limit: 2Gi

  # On SIGTERM the native Server holds open worker polls until they end. A
  # poll waits DW_WORKER_POLL_TIMEOUT (30 seconds) unless it asks for up to 60,
  # so keep this above 60 for a rollout to drain polls instead of cutting them
  # off. The chart refuses a value at or below a DW_WORKER_POLL_TIMEOUT set in
  # config.extraEnv.
  terminationGracePeriodSeconds: 65

  # Liveness for native pods. /api/health reports database liveness, so
  # probing it would restart every pod during a database outage while the
  # connection pool would have recovered on its own. Native probes the
  # listener instead; readiness (server.readinessProbe on /api/ready) still
  # takes a pod out of service when its database, schema or maintenance loop
  # fails. server.livenessProbe applies to PHP mode only.
  livenessProbe:
    tcpSocket:
      port: http
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3

  # Native keeps external payload objects on local disk at /app/storage.
  # Without a claim the chart mounts an emptyDir, which is lost with the pod.
  # Set a PersistentVolumeClaim before any namespace enables external payload
  # storage. More than one replica (server.replicaCount above 1 or
  # autoscaling) requires a claim, and it must be ReadWriteMany so every pod
  # reads the same objects. The chart refuses more than one replica without
  # one.
  storage:
    existingClaim: ""

  # Explicit schema upgrade between native releases. A native Server never
  # upgrades its schema at startup: on an older schema it refuses with
  # native_schema_upgrade_required and stays unready. Patch releases within a
  # minor line keep the schema. When a release notes a schema change, with
  # helm upgrade against the cluster:
  #   1. scale the Server to zero (server.replicaCount=0, autoscaling off),
  #   2. back up the database,
  #   3. upgrade to the new image with schemaUpgrade.enabled=true and your
  #      usual replica count (autoscaling still off),
  #   4. set schemaUpgrade.enabled=false again for later upgrades.
  # The hook renders only in helm upgrade, and only when the live native
  # Deployment has zero replicas, no autoscaler and no running pod. An
  # install, helm template or GitOps render with this enabled is refused; use
  # the manual path in the chart README instead.
  schemaUpgrade:
    enabled: false
    backoffLimit: 0
    activeDeadlineSeconds: 1800
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

# ---------------------------------------------------------------------------
# Bootstrap / migration job (PHP mode only)
# ---------------------------------------------------------------------------

bootstrap:
  enabled: true
  # Helm hook ordering. The default — pre-install,pre-upgrade with
  # before-hook-creation,hook-succeeded — keeps pods from rolling forward
  # until migrations finish. GitOps controllers (Argo CD, Flux) that don't
  # honour Helm hooks should keep argocd.useSyncWaves: true so this Job
  # gets the lower sync-wave annotation instead.
  useHelmHooks: true
  backoffLimit: 3
  activeDeadlineSeconds: 600
  # Extra entrypoint args for migration. The default runs server-bootstrap.
  args:
    - "server-bootstrap"
  podAnnotations: {}
  podLabels: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  securityContext: {}
  containerSecurityContext: {}

# ---------------------------------------------------------------------------
# Server (API) deployment
# ---------------------------------------------------------------------------

server:
  enabled: true
  # Empty takes the runtime default: 1 native pod (more than one needs
  # native.storage.existingClaim) or 2 PHP pods. 0 stops the Server.
  replicaCount: ""

  # Strategy controls. Default RollingUpdate with maxUnavailable=0 enforces
  # the rolling-upgrade contract (https://durable-workflow.github.io/docs/2.0/rolling-upgrades).
  # Set strategy.type=Recreate for stop-the-world deployments.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  # Optional pacing knob: minReadySeconds delays "ready" until the pod has
  # been healthy for this long. Useful when /api/ready flips green before
  # cluster discovery propagates through your load balancer.
  minReadySeconds: 0
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 5

  service:
    type: ClusterIP
    port: 8080
    annotations: {}
    # Set to true to expose a NodePort or LoadBalancer; production should
    # terminate TLS at the ingress, not on the Service.
    nodePort: ""
    loadBalancerSourceRanges: []
    sessionAffinity: ""

  # Probes. Defaults preserve the small-cluster contract: liveness on
  # /api/health, readiness on /api/ready. Changing readinessProbe.path away
  # from /api/ready breaks the single-region HA contract. In PHP mode
  # /api/ready tests DB and Redis usability. In native mode it tests the
  # schema and the in-process maintenance loop, so keep it out of liveness:
  # a stalled maintenance tick would otherwise restart every pod.
  livenessProbe:
    httpGet:
      path: /api/health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /api/ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 2
    successThreshold: 1
  startupProbe: {}

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

  # PodDisruptionBudget. Honoured by node drains and rolling upgrades.
  pdb:
    enabled: true
    minAvailable: 1
    # Set maxUnavailable instead of minAvailable when the chart user prefers
    # the alternate constraint. Only one of the two should be set.
    maxUnavailable: ""

  podLabels: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Topology spread defaults to a soft anti-affinity hint per zone. Set to []
  # to disable.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: server

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: ["ALL"]

  # Optional ingress in front of the API Service. Disabled by default; many
  # clusters route through a platform-managed gateway instead.
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: durable-workflow.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
    # tls:
    #   - secretName: durable-workflow-tls
    #     hosts:
    #       - durable-workflow.example.com

  # Horizontal Pod Autoscaler. Disabled by default — the engine's preferred
  # scaling axis is replicas + queue admission, not raw CPU.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: ""

  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

# ---------------------------------------------------------------------------
# Worker deployment (PHP mode only)
# ---------------------------------------------------------------------------

worker:
  enabled: true
  replicaCount: 2

  # Worker process command. Default runs Laravel queue worker.
  command:
    - "server-entrypoint"
  args:
    - "php"
    - "artisan"
    - "queue:work"
    - "--sleep=1"
    - "--tries=3"
    - "--max-time=3600"

  livenessProbe:
    exec:
      command: ["php", "artisan", "queue:monitor", "default"]
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe: {}

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  pdb:
    enabled: false
    minAvailable: 1
    maxUnavailable: ""

  podLabels: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: ["ALL"]

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 75

  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

# ---------------------------------------------------------------------------
# Scheduler / maintenance runner (PHP mode only; native runs it in process)
# ---------------------------------------------------------------------------

# CRITICAL: the scheduler is a singleton. Helm enforces this by setting
# concurrencyPolicy: Forbid on the CronJob and by refusing to render more than
# one CronJob. Do NOT add a parallel scheduler Deployment without rereading
# https://durable-workflow.github.io/docs/2.0/deployment#single-region-high-availability-and-failover.
scheduler:
  enabled: true
  schedule: "* * * * *"
  concurrencyPolicy: "Forbid"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 60
  activeDeadlineSeconds: 55
  backoffLimit: 1

  # Default command runs schedule eval, unscoped task repair, activity timeouts,
  # external-payload reclamation, and history pruning. The repair pass is skipped
  # when config.extraEnv.DW_V2_MATCHING_ROLE_QUEUE_WAKE is false or 0 because a
  # separately supervised matching daemon must then own the broad sweep.
  args:
    - "sh"
    - "-c"
    - >-
      php artisan schedule:evaluate --limit=100 --json;
      if [ "$DW_V2_MATCHING_ROLE_QUEUE_WAKE" != "false" ] && [ "$DW_V2_MATCHING_ROLE_QUEUE_WAKE" != "0" ]; then php artisan workflow:v2:repair-pass --json; fi;
      php artisan activity:timeout-enforce --limit=100;
      if php artisan list --raw | grep -q '^external-payloads:cleanup '; then php artisan external-payloads:cleanup --limit=100 --json; fi;
      php artisan history:prune --limit=100

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: ["ALL"]

# ---------------------------------------------------------------------------
# GitOps controller compatibility
# ---------------------------------------------------------------------------

# Argo CD / Flux do not always honour Helm hook annotations. Setting these
# adds sync-wave / depends-on annotations so the PHP bootstrap Job runs before
# the server/worker/scheduler workloads. Native mode has no bootstrap Job and
# renders no depends-on annotation.
argocd:
  useSyncWaves: true
  bootstrapWave: "-5"
  workloadWave: "0"

flux:
  # When true, adds kustomize.toolkit.fluxcd.io/depends-on annotations on
  # workloads so Flux waits for the bootstrap Job to settle. The chart relies
  # on the bootstrap Job's name being deterministic.
  useDependsOn: true

# ---------------------------------------------------------------------------
# Network policy (egress to DB/Redis is required; left to platform team)
# ---------------------------------------------------------------------------

networkPolicy:
  enabled: false
  # When enabled, allows traffic from these sources to reach the API Service
  # on the configured server port. Egress is left for platform policy.
  ingressFrom: []
  # ingressFrom:
  # - namespaceSelector:
  #     matchLabels:
  #       team: platform-ingress

# ---------------------------------------------------------------------------
# Pod-level extras
# ---------------------------------------------------------------------------

# Pod priority class for the workflow workloads. Production clusters often
# pin schedulers/migrations to a higher class than the API/worker pool.
priorityClassName: ""

# Optional sidecar containers injected on every pod (server, worker,
# scheduler, bootstrap, native schema upgrade). Use sparingly — the engine's
# contract is that the main container talks to its database directly.
sidecars: []
