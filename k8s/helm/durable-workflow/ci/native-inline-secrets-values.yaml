# CI fixture: the native Server with inline secrets and MySQL. Renders one
# server Deployment and no worker, scheduler, migration Job or Redis.
runtime: native

externalDatabase:
  connection: mysql
  host: db.example.internal
  port: 3306
  database: durable_workflow
  auth:
    username: workflow
    password: changeme-ci-only

auth:
  serverKey: "base64:CHANGE_ME_CI_ONLY"
  authToken: "ci-shared-token"
  workerToken: "ci-worker-token"
  operatorToken: "ci-operator-token"
  adminToken: "ci-admin-token"
