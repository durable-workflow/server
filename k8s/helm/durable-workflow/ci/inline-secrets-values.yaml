# CI fixture: smallest renderable values. Keeps secrets inline so the
# chart's render path is exercised end-to-end. Real deployments should use
# existingSecret instead.

# PHP 2.x mode. The chart defaults to the native 3.x Server. This file keeps
# an existing PHP installation on the frozen 2.x line.
runtime: php

image:
  tag: "2.11.8"

externalDatabase:
  connection: mysql
  host: db.example.internal
  port: 3306
  database: durable_workflow
  auth:
    username: workflow
    password: changeme-ci-only

externalRedis:
  host: redis.example.internal
  port: 6379

auth:
  serverKey: "base64:CHANGE_ME_CI_ONLY"
  principalTokens: '[{"token":"ci-operator-principal","subject":"ci:operator","roles":["operator"]}]'
  workerToken: "ci-worker-token"
  operatorToken: "ci-operator-token"
  adminToken: "ci-admin-token"
