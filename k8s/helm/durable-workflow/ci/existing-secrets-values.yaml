# CI fixture: GitOps / externally-managed-secret path. The chart consumes
# existing Secrets and renders no Secret resources of its own.
image:
  tag: "2.0.3"

externalDatabase:
  connection: pgsql
  host: db.example.internal
  port: 5432
  database: durable_workflow
  existingSecret: durable-workflow-db-credentials

externalRedis:
  host: redis.example.internal
  port: 6379
  existingSecret: durable-workflow-redis-credentials

auth:
  existingSecret: durable-workflow-app-credentials
