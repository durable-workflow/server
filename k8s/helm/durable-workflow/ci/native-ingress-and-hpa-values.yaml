# CI fixture: the native Server with PostgreSQL, existing Secrets, ingress,
# autoscaling, a shared payload claim and the opt-in schema-upgrade hook.
runtime: native

externalDatabase:
  connection: pgsql
  host: db.example.internal
  port: 5432
  database: durable_workflow
  existingSecret: durable-workflow-db-credentials

auth:
  existingSecret: durable-workflow-app-credentials

native:
  storage:
    existingClaim: durable-workflow-payloads
  schemaUpgrade:
    enabled: true

server:
  replicaCount: 3
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: workflow.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: workflow-tls
        hosts:
          - workflow.example.com
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 8

networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          team: platform-ingress
