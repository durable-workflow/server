apiVersion: v2
name: durable-workflow
description: Durable Workflow self-hosted Server for Kubernetes. Runs the native 3.x Server by default, or the PHP 2.x Server with its worker, scheduler and bootstrap job for existing installs.
type: application
# The chart's own semver version. Bumped on every chart release; treated as
# independent of the server image version (appVersion). Breaking-change rules
# for this version live in docs/UPGRADING.md alongside the chart.
version: 1.6.0
# The immutable native Durable Workflow Server this chart release packages.
# The onboarding default in values.yaml and appVersion are generated from the
# checked-in source release record (helm_chart.app_version).
appVersion: "3.8.0"
kubeVersion: ">=1.27.0-0"
home: https://durable-workflow.github.io/docs/2.0/deployment
sources:
  - https://github.com/durable-workflow/server
  - https://github.com/durable-workflow/workflow
keywords:
  - workflow
  - durable-workflow
  - workflows
  - orchestration
  - laravel
maintainers:
  - name: Durable Workflow
    url: https://durable-workflow.github.io
icon: https://durable-workflow.github.io/img/logo.svg
annotations:
  # The release workflow replaces "unreleased" in its staging copy with the
  # exact commit that most recently changed the packaged chart.
  org.opencontainers.image.source: https://github.com/durable-workflow/server
  dev.durable-workflow.source-revision: "unreleased"
  dev.durable-workflow.image-reference: "docker.io/durableworkflow/server:3.8.0"
  artifacthub.io/license: MIT
  artifacthub.io/category: integration-delivery
  # Free-form changelog for the current chart release shown by Artifact Hub.
  artifacthub.io/changes: |
    - kind: changed
      description: "Default image changes from native Server 3.7.0 to 3.8.0. Every backend needs a schema upgrade (SQLite 11 to 12, PostgreSQL and MariaDB 12 to 13, MySQL 13 to 14) that only creates the empty dw_task_queue_pauses table and takes seconds. Scale to zero, back up, run helm upgrade with native.schemaUpgrade.enabled=true, scale up; rolling back means restoring the backup (docs/UPGRADING.md)."
    - kind: added
      description: "Server 3.8.0: pause and resume activity dispatch on one task queue, advertised as capabilities.task_queue_activity_dispatch_pause (server#577); redrive reuses recorded side effects and version markers (server#980). https://github.com/durable-workflow/server/releases/tag/3.8.0"
    - kind: changed
      description: "Server 3.8.0: each MySQL, MariaDB and PostgreSQL pool connection caches up to 200 prepared statements. On MySQL check max_prepared_stmt_count (default 16382 fits about 20 nodes) or lower DW_NATIVE_DB_STATEMENT_CACHE_CAPACITY (server#1174)."
