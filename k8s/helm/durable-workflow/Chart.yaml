apiVersion: v2
name: durable-workflow
description: Durable Workflow self-hosted server, worker, scheduler/maintenance runner, and bootstrap job for Kubernetes.
type: application
# The chart's own semver version. Bumped on every chart release; treated as
# independent of the server image version (appVersion). Breaking-change rules
# for this version live in docs/UPGRADING.md alongside the chart.
version: 0.3.8
# The immutable Durable Workflow Server identity this chart release packages.
# The onboarding default in values.yaml and appVersion are generated from the
# checked-in source release record.
appVersion: "2.11.8"
kubeVersion: ">=1.27.0-0"
home: https://durable-workflow.github.io/docs/2.0/deployment
sources:
  - https://github.com/durable-workflow/server
  - https://github.com/durable-workflow/workflow
keywords:
  - workflow
  - durable-workflow
  - workflows
  - orchestration
  - laravel
maintainers:
  - name: Durable Workflow
    url: https://durable-workflow.github.io
icon: https://durable-workflow.github.io/img/logo.svg
annotations:
  # The release workflow replaces "unreleased" in its staging copy with the
  # exact commit that most recently changed the packaged chart.
  org.opencontainers.image.source: https://github.com/durable-workflow/server
  dev.durable-workflow.source-revision: "unreleased"
  dev.durable-workflow.image-reference: "docker.io/durableworkflow/server:2.11.8"
  artifacthub.io/license: MIT
  artifacthub.io/category: integration-delivery
  # Free-form changelog for the current chart release shown by Artifact Hub.
  artifacthub.io/changes: |
    - kind: fixed
      description: Preserve duplicate bridge update receipts for SDK-worker workflows.
    - kind: fixed
      description: Include canonical failure storage, retention recovery and rejected-outcome history readers.
    - kind: changed
      description: Package Server 2.11 with capability-gated activity lease maintenance and configurable lease duration.
    - kind: added
      description: Document compatible worker rollout and the distinction between leases and application deadlines.
    - kind: fixed
      description: Send application logs to container stderr by default and verify actual API, worker and scheduler logging before chart publication.
