apiVersion: v2
name: durable-workflow
description: Durable Workflow self-hosted server, worker, scheduler/maintenance runner, and bootstrap job for Kubernetes.
type: application
# The chart's own semver version. Bumped on every chart release; treated as
# independent of the server image version (appVersion). Breaking-change rules
# for this version live in docs/helm-upgrading.md alongside the chart.
version: 0.1.35
# The immutable Durable Workflow Server identity this chart release packages.
# The onboarding default in values.yaml is generated from the separately
# qualified compatibility authority; appVersion remains release metadata.
appVersion: "2.0.0-rc.44"
kubeVersion: ">=1.27.0-0"
home: https://durable-workflow.github.io/docs/2.0/deployment
sources:
  - https://github.com/durable-workflow/server
  - https://github.com/durable-workflow/workflow
keywords:
  - workflow
  - durable-workflow
  - workflows
  - orchestration
  - laravel
maintainers:
  - name: Durable Workflow
    url: https://durable-workflow.github.io
icon: https://durable-workflow.github.io/img/logo.svg
annotations:
  # The release workflow replaces "unreleased" in its staging copy with the
  # exact commit that most recently changed the packaged chart.
  org.opencontainers.image.source: https://github.com/durable-workflow/server
  dev.durable-workflow.source-revision: "unreleased"
  dev.durable-workflow.image-reference: "docker.io/durableworkflow/server:2.0.0-rc.44"
  artifacthub.io/license: MIT
  artifacthub.io/category: integration-delivery
  # Free-form changelog used by Artifact Hub. Keep the most recent chart-version
  # entry first; do not rewrite past entries.
  artifacthub.io/changes: |
    - kind: fixed
      description: Reclaim expired and incomplete runtime external-payload uploads in Server 2.0.0-rc.44.
    - kind: security
      description: Keep external payload storage behind the authenticated runtime boundary in Server 2.0.0-rc.43.
    - kind: added
      description: Add portable durable message streams and worker protocol 1.15 in Server 2.0.0-rc.42.
    - kind: fixed
      description: Ship Fiber-backed straight-line PHP conformance workers for current service-mode validation in Server 2.0.0-rc.41.
    - kind: added
      description: Add replay-safe workflow-command emission for run-scoped Workflow Streams in Server 2.0.0-rc.40.
    - kind: added
      description: Accept and persist deterministic service-workflow parallel group metadata in Server 2.0.0-rc.39.
    - kind: fixed
      description: Publish the capacity schema inventory and qualification contract for canonical public routes in Server 2.0.0-rc.38.
    - kind: fixed
      description: Publish worker OpenAPI document version 9 for the cached-poll conflict response union in Server 2.0.0-rc.37.
    - kind: fixed
      description: Add a focused published-artifact PHP CLI signal diagnostic with bounded post-attempt state evidence for Server 2.0.0-rc.36.
    - kind: security
      description: Exclude compound credential fields from retained portable signals/queries conformance text evidence for Server 2.0.0-rc.35.
    - kind: fixed
      description: Retain bounded failed-client routing diagnostics in portable signals/queries conformance evidence for Server 2.0.0-rc.34.
    - kind: fixed
      description: Advance the chart Server identity to 2.0.0-rc.33 with Fiber-backed PHP workflow consumers.
    - kind: fixed
      description: Advance the chart Server identity to 2.0.0-rc.32 with structured release-image provenance verification.
    - kind: added
      description: Advance the chart Server identity to 2.0.0-rc.31 with namespace capacity-evidence support.
    - kind: fixed
      description: Bind the embedded Workflow package to the Server Composer authority for 2.0.0-rc.31.
    - kind: fixed
      description: Route the default Server image through the passing public compatibility authority.
    - kind: fixed
      description: Advance the chart Server identity to 2.0.0-rc.30 with Avro-only payload enforcement and deployment preflight.
    - kind: fixed
      description: Advance the default Server image to 2.0.0-rc.29 with isolated workflow-update conformance authentication phases.
    - kind: added
      description: Advance the default Server image to 2.0.0-rc.28 with the versioned capacity benchmark suite.
    - kind: fixed
      description: Advance the default Server image to 2.0.0-rc.28 with deterministic source qualification for the Helm chart.
    - kind: fixed
      description: Advance the default Server image to 2.0.0-rc.27 with corrected Python lifecycle discovery conformance and retained diagnostics.
    - kind: fixed
      description: Advance the default Server image to 2.0.0-rc.25 with schema-valid fail-closed cached-poll conflicts.
    - kind: fixed
      description: Advance the default Server image to 2.0.0-rc.24 with validator conformance that honors multiplex fairness.
    - kind: fixed
      description: Advance the default Server image to 2.0.0-rc.23 with corrected Python worker shutdown conformance.
    - kind: fixed
      description: Advance the default Server image to 2.0.0-rc.21 with isolated activities conformance task queues.
    - kind: security
      description: Advance the default Server image to 2.0.0-rc.19 with the remediated Markdown dependency.
    - kind: security
      description: Advance the default Server image to 2.0.0-rc.18 with the remediated HTTP client dependency.
    - kind: added
      description: Initial self-serve Helm chart for Durable Workflow server, worker, scheduler/maintenance runner, and bootstrap job.
