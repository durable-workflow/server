{{- /*
Redis credentials Secret. Rendered only when at least one credential is
present and no existingSecret is configured. The standard env block mounts
the keys as `optional: true` so an unauthenticated Redis is permitted —
in that case nothing is rendered here.
*/ -}}
{{- if and (not .Values.externalRedis.existingSecret) (or .Values.externalRedis.auth.username .Values.externalRedis.auth.password) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "durable-workflow.redisSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "durable-workflow.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- if .Values.externalRedis.auth.username }}
  {{ .Values.externalRedis.existingSecretUsernameKey | default "REDIS_USERNAME" }}: {{ .Values.externalRedis.auth.username | quote }}
  {{- end }}
  {{- if .Values.externalRedis.auth.password }}
  {{ .Values.externalRedis.existingSecretPasswordKey | default "REDIS_PASSWORD" }}: {{ .Values.externalRedis.auth.password | quote }}
  {{- end }}
{{- end }}
