{{- /*
Application secret holding the engine signing key and role-scoped tokens.
Skipped entirely when the operator points the chart at an existing Secret —
that is the GitOps / externally-managed-secret path.
*/ -}}
{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "durable-workflow.appSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "durable-workflow.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- if .Values.auth.serverKey }}
  DW_SERVER_KEY: {{ .Values.auth.serverKey | quote }}
  {{- end }}
  {{- if .Values.auth.authToken }}
  DW_AUTH_TOKEN: {{ .Values.auth.authToken | quote }}
  {{- end }}
  {{- if .Values.auth.principalTokens }}
  DW_PRINCIPAL_TOKENS: {{ .Values.auth.principalTokens | quote }}
  {{- end }}
  {{- if .Values.auth.workerToken }}
  DW_WORKER_TOKEN: {{ .Values.auth.workerToken | quote }}
  {{- end }}
  {{- if .Values.auth.operatorToken }}
  DW_OPERATOR_TOKEN: {{ .Values.auth.operatorToken | quote }}
  {{- end }}
  {{- if .Values.auth.adminToken }}
  DW_ADMIN_TOKEN: {{ .Values.auth.adminToken | quote }}
  {{- end }}
  {{- range $k, $v := .Values.auth.extra }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
