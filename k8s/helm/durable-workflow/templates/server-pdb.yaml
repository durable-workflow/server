{{- /* In native mode the budget renders only when more than one pod can
run: minAvailable 1 on a single replica would block every voluntary eviction,
including node drains. */}}
{{- $multiple := or .Values.server.autoscaling.enabled (gt (int (include "durable-workflow.serverReplicas" .)) 1) }}
{{- if and .Values.server.enabled .Values.server.pdb.enabled (or (include "durable-workflow.isPhp" .) $multiple) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "durable-workflow.serverDeploymentName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "durable-workflow.componentLabels" (dict "context" . "component" "server") | nindent 4 }}
spec:
  {{- if .Values.server.pdb.maxUnavailable }}
  maxUnavailable: {{ .Values.server.pdb.maxUnavailable }}
  {{- else }}
  minAvailable: {{ .Values.server.pdb.minAvailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "durable-workflow.componentSelectorLabels" (dict "context" . "component" "server") | nindent 6 }}
{{- end }}
