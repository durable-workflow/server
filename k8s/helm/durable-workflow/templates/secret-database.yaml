{{- /*
Database credentials Secret. Skipped when externalDatabase.existingSecret is
set — operators with External Secrets / Vault / Secrets Store CSI manage the
Secret out of band and only hand the chart its name.
*/ -}}
{{- if not .Values.externalDatabase.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "durable-workflow.databaseSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "durable-workflow.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{ .Values.externalDatabase.existingSecretUsernameKey | default "DB_USERNAME" }}: {{ required "externalDatabase.auth.username is required when externalDatabase.existingSecret is empty" .Values.externalDatabase.auth.username | quote }}
  {{ .Values.externalDatabase.existingSecretPasswordKey | default "DB_PASSWORD" }}: {{ required "externalDatabase.auth.password is required when externalDatabase.existingSecret is empty" .Values.externalDatabase.auth.password | quote }}
{{- end }}
