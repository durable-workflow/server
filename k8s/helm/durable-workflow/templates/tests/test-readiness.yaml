{{- if .Values.server.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "durable-workflow.fullname" . }}-test-readiness
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "durable-workflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: probe
      image: curlimages/curl:8.10.1
      command:
        - sh
        - -c
        - |
          set -eu
          base="http://{{ include "durable-workflow.serverDeploymentName" . }}:{{ .Values.server.service.port }}"
          curl --fail --silent --show-error --max-time 5 "$base/api/health"
          curl --fail --silent --show-error --max-time 10 "$base/api/ready"
{{- end }}
